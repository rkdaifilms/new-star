<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Star Creator Hub - Profile</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: #fff;
      min-height: 100vh;
    }

    button, input, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
      color: #8b9cff;
    }

    .menu-wrap {
      position: relative;
    }

    .menu-button {
      background: #202944;
      border: 1px solid #39466b;
      color: white;
      border-radius: 12px;
      padding: 10px 15px;
      font-size: 20px;
    }

    .menu {
      display: none;
      position: absolute;
      right: 0;
      top: 48px;
      width: 230px;
      background: #17213b;
      border: 1px solid #39466b;
      border-radius: 14px;
      padding: 8px;
      z-index: 50;
      box-shadow: 0 12px 35px #0008;
    }

    .menu.show {
      display: block;
    }

    .menu button {
      display: block;
      width: 100%;
      text-align: left;
      color: white;
      background: transparent;
      border: 0;
      padding: 13px;
      border-radius: 9px;
    }

    .menu button:hover {
      background: #29385e;
    }

    .profile-card {
      overflow: hidden;
      background: #141d35;
      border: 1px solid #293758;
      border-radius: 20px;
    }

    .cover-area {
      position: relative;
      height: 300px;
      background: linear-gradient(135deg, #182b69, #7a35a8, #152b55);
      overflow: hidden;
      touch-action: none;
    }

    .cover-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: center;
      user-select: none;
      pointer-events: none;
    }

    .cover-controls {
      position: absolute;
      right: 14px;
      bottom: 14px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      z-index: 5;
    }

    .cover-controls button,
    .cover-controls label {
      background: #10182bdc;
      border: 1px solid #ffffff55;
      color: white;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 13px;
      cursor: pointer;
    }

    .cover-editor {
      display: none;
      background: #101a31;
      padding: 15px;
      border-top: 1px solid #344363;
    }

    .cover-editor.show {
      display: block;
    }

    .cover-editor label {
      display: block;
      margin: 10px 0 6px;
      color: #cbd5f5;
      font-size: 13px;
    }

    .cover-editor input[type="range"] {
      width: 100%;
    }

    .profile-info {
      padding: 0 22px 22px;
      position: relative;
    }

    .avatar-row {
      display: flex;
      align-items: end;
      gap: 18px;
      margin-top: -65px;
      position: relative;
      z-index: 3;
    }

    .avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      background: #283858;
      border: 5px solid #141d35;
    }

    .avatar-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .primary-button,
    .secondary-button,
    .danger-button {
      border: 0;
      border-radius: 10px;
      padding: 11px 15px;
      font-weight: 700;
    }

    .primary-button {
      color: white;
      background: #5865f2;
    }

    .secondary-button {
      color: white;
      background: #293858;
      border: 1px solid #405078;
    }

    .danger-button {
      color: white;
      background: #b8324b;
    }

    .profile-name {
      font-size: 27px;
      margin-top: 15px;
    }

    .username {
      color: #9eaccd;
      margin-top: 5px;
    }

    .bio {
      color: #d1d9ef;
      margin-top: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .stats {
      display: flex;
      gap: 30px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .stat strong {
      display: block;
      font-size: 20px;
    }

    .stat span {
      color: #9eaccd;
      font-size: 13px;
    }

    .section {
      margin-top: 22px;
      padding: 20px;
      background: #141d35;
      border: 1px solid #293758;
      border-radius: 18px;
    }

    .section h2 {
      font-size: 20px;
      margin-bottom: 16px;
    }

    .edit-form {
      display: none;
      margin-top: 22px;
      padding: 18px;
      border-radius: 14px;
      background: #0e172b;
      border: 1px solid #344363;
    }

    .edit-form.show {
      display: block;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: #cbd5f5;
      font-size: 13px;
    }

    .field input,
    .field textarea {
      width: 100%;
      padding: 12px;
      color: white;
      background: #1b2946;
      border: 1px solid #405078;
      border-radius: 10px;
      outline: none;
    }

    .field textarea {
      min-height: 90px;
      resize: vertical;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 14px;
    }

    .video-card {
      overflow: hidden;
      background: #0d162a;
      border: 1px solid #2c3b5e;
      border-radius: 12px;
    }

    .video-card video {
      display: block;
      width: 100%;
      aspect-ratio: 9 / 14;
      object-fit: cover;
      background: #000;
    }

    .video-card p {
      padding: 10px;
      color: #d7def2;
      font-size: 13px;
    }

    .empty {
      color: #9eaccd;
      padding: 20px 0;
    }

    .message {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      background: #26385e;
      border: 1px solid #6077ae;
      padding: 12px 18px;
      border-radius: 12px;
      z-index: 100;
      max-width: calc(100% - 30px);
      text-align: center;
    }

    .message.show {
      display: block;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #aebce0;
    }

    .settings-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: #000b;
      z-index: 90;
      padding: 20px;
      align-items: center;
      justify-content: center;
    }

    .settings-modal.show {
      display: flex;
    }

    .settings-content {
      width: min(900px, 100%);
      height: min(750px, 90vh);
      background: #141d35;
      border: 1px solid #405078;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid #344363;
    }

    .settings-content iframe {
      flex: 1;
      width: 100%;
      border: 0;
      background: white;
    }

    @media (max-width: 600px) {
      .page {
        padding: 10px;
      }

      .cover-area {
        height: 210px;
      }

      .avatar {
        width: 100px;
        height: 100px;
      }

      .avatar-row {
        margin-top: -50px;
      }

      .profile-info {
        padding: 0 14px 18px;
      }

      .profile-name {
        font-size: 23px;
      }

      .stats {
        gap: 20px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">NEW STAR</div>

      <div class="menu-wrap">
        <button class="menu-button" id="menuButton" aria-label="Open settings menu">⋮</button>

        <div class="menu" id="menu">
          <button id="editMenuButton">Edit Profile & Cover</button>
          <button id="settingsButton">Full Account & App Settings</button>
          <button id="logoutButton">Log Out</button>
        </div>
      </div>
    </header>

    <div id="loading" class="loading">Loading profile...</div>

    <div id="profilePage" hidden>
      <section class="profile-card">
        <div class="cover-area" id="coverArea">
          <img id="coverImage" class="cover-image" alt="Profile cover">

          <div class="cover-controls">
            <label for="coverUpload">Change Cover</label>
            <button id="openCoverEditor">Adjust Cover</button>
          </div>
        </div>

        <div class="cover-editor" id="coverEditor">
          <label for="coverZoom">Zoom Cover</label>
          <input id="coverZoom" type="range" min="1" max="3" step="0.01" value="1">

          <label for="coverX">Move Horizontally</label>
          <input id="coverX" type="range" min="-100" max="100" value="0">

          <label for="coverY">Move Vertically</label>
          <input id="coverY" type="range" min="-100" max="100" value="0">

          <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
            <button class="primary-button" id="saveCoverButton">Save Cover Position</button>
            <button class="secondary-button" id="resetCoverButton">Reset</button>
          </div>
        </div>

        <div class="profile-info">
          <div class="avatar-row">
            <img id="avatarImage" class="avatar" alt="Profile photo">

            <div class="avatar-actions">
              <label class="secondary-button" for="avatarUpload">Change Photo</label>
              <input id="avatarUpload" type="file" accept="image/*" hidden>
              <input id="coverUpload" type="file" accept="image/*" hidden>
            </div>
          </div>

          <h1 class="profile-name" id="profileName">Creator</h1>
          <div class="username" id="profileUsername"></div>
          <p class="bio" id="profileBio"></p>

          <div class="stats">
            <div class="stat">
              <strong id="videoCount">0</strong>
              <span>Videos</span>
            </div>

            <div class="stat">
              <strong id="followerCount">0</strong>
              <span>Followers</span>
            </div>

            <div class="stat">
              <strong id="followingCount">0</strong>
              <span>Following</span>
            </div>
          </div>

          <div class="edit-form" id="editForm">
            <h2>Edit Profile</h2>

            <div class="field">
              <label for="editName">Full Name</label>
              <input id="editName" type="text" maxlength="80">
            </div>

            <div class="field">
              <label for="editUsername">Username</label>
              <input id="editUsername" type="text" maxlength="40">
            </div>

            <div class="field">
              <label for="editBio">Bio</label>
              <textarea id="editBio" maxlength="500"></textarea>
            </div>

            <button class="primary-button" id="saveProfileButton">Save Profile</button>
            <button class="secondary-button" id="cancelEditButton">Cancel</button>
          </div>
        </div>
      </section>

      <section class="section">
        <h2>My Videos</h2>
        <div id="videoGrid" class="video-grid">
          <p class="empty">No videos uploaded yet.</p>
        </div>
      </section>
    </div>
  </main>

  <div id="message" class="message"></div>

  <div class="settings-modal" id="settingsModal">
    <div class="settings-content">
      <div class="settings-header">
        <strong>Account & App Settings</strong>
        <button class="secondary-button" id="closeSettingsButton">Close</button>
      </div>
      <iframe src="settings.html" title="Account and app settings"></iframe>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      const SUPABASE_URL = "https://uzsusgoetrkujmofxcmb.supabase.co";

      const configuredClient =
        window.supabaseClient ||
        window.cloudClient ||
        window.supabase;

      const db =
        configuredClient ||
        (window.supabase?.createClient
          ? window.supabase.createClient(
              SUPABASE_URL,
              window.SUPABASE_ANON_KEY
            )
          : null);

      const $ = id => document.getElementById(id);

      let currentUser = null;
      let profileData = {};
      let coverTransform = {
        scale: 1,
        x: 0,
        y: 0
      };

      let dragState = null;
      let pinchState = null;

      function notify(message) {
        const box = $("message");
        box.textContent = message;
        box.classList.add("show");

        clearTimeout(notify.timer);
        notify.timer = setTimeout(() => {
          box.classList.remove("show");
        }, 3500);
      }

      function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, char => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        })[char]);
      }

      function applyCoverTransform() {
        $("coverImage").style.transform =
          `translate(${coverTransform.x}px, ${coverTransform.y}px) scale(${coverTransform.scale})`;

        $("coverZoom").value = coverTransform.scale;

        $("coverX").value = coverTransform.x;
        $("coverY").value = coverTransform.y;
      }

      function updateCoverFromControls() {
        coverTransform.scale = Number($("coverZoom").value);
        coverTransform.x = Number($("coverX").value);
        coverTransform.y = Number($("coverY").value);

        applyCoverTransform();
      }

      async function getCurrentSession() {
        if (!db?.auth) {
          throw new Error("Supabase client is not configured.");
        }

        const { data, error } = await db.auth.getSession();

        if (error) throw error;

        if (!data.session?.user) {
          location.href = "index.html";
          return null;
        }

        return data.session.user;
      }

      async function loadProfile() {
        currentUser = await getCurrentSession();
        if (!currentUser) return;

        const metadata = currentUser.user_metadata || {};

        const { data, error } = await db
          .from("profiles")
          .select("*")
          .eq("user_id", currentUser.id)
          .maybeSingle();

        if (error) {
          console.error("Profile load error:", error);
        }

        profileData = data || {};

        const name =
          profileData.full_name ||
          profileData.username ||
          metadata.full_name ||
          metadata.name ||
          "Creator";

        const username =
          profileData.username ||
          metadata.username ||
          currentUser.email?.split("@")[0] ||
          "creator";

        const bio =
          profileData.bio ||
          metadata.bio ||
          "";

        const avatar =
          profileData.avatar_url ||
          metadata.avatar_url ||
          metadata.picture ||
          "";

        const cover =
          metadata.cover_url ||
          profileData.cover_url ||
          "";

        const savedTransform = metadata.cover_transform || {};

        coverTransform = {
          scale: Number(savedTransform.scale) || 1,
          x: Number(savedTransform.x) || 0,
          y: Number(savedTransform.y) || 0
        };

        $("profileName").textContent = name;
        $("profileUsername").textContent = "@" + username;
        $("profileBio").textContent = bio;

        $("editName").value = name;
        $("editUsername").value = username;
        $("editBio").value = bio;

        $("avatarImage").src = avatar ||
          "data:image/svg+xml," +
          encodeURIComponent(
            `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
              <rect width="100%" height="100%" fill="#283858"/>
              <text x="50%" y="55%" text-anchor="middle" font-size="85" fill="white">☺</text>
            </svg>`
          );

        $("coverImage").src = cover || "";

        applyCoverTransform();

        $("loading").hidden = true;
        $("profilePage").hidden = false;

        await loadStatsAndVideos();
      }

      async function uploadImage(file, folder) {
        if (!file) throw new Error("Please select an image.");

        if (!file.type.startsWith("image/")) {
          throw new Error("Please select a valid image.");
        }

        if (file.size > 10 * 1024 * 1024) {
          throw new Error("Image must be smaller than 10 MB.");
        }

        const extension =
          file.name.split(".").pop()?.toLowerCase() || "jpg";

        const path =
          `${currentUser.id}/${folder}-${Date.now()}.${extension}`;

        const { error } = await db.storage
          .from("avatars")
          .upload(path, file, {
            upsert: false,
            contentType: file.type
          });

        if (error) throw error;

        const { data } = db.storage
          .from("avatars")
          .getPublicUrl(path);

        return data.publicUrl;
      }

      async function saveMetadata(updatedData) {
        const { error } = await db.auth.updateUser({
          data: updatedData
        });

        if (error) throw error;

        currentUser = {
          ...currentUser,
          user_metadata: updatedData
        };
      }

      async function handleAvatarUpload(file) {
        try {
          notify("Uploading profile photo...");

          const avatarUrl = await uploadImage(file, "avatar");

          const updatedMetadata = {
            ...(currentUser.user_metadata || {}),
            avatar_url: avatarUrl
          };

          await saveMetadata(updatedMetadata);

          const { error } = await db
            .from("profiles")
            .upsert({
              user_id: currentUser.id,
              avatar_url: avatarUrl,
              updated_at: new Date().toISOString()
            }, {
              onConflict: "user_id"
            });

          if (error) throw error;

          $("avatarImage").src = avatarUrl;
          notify("Profile photo updated successfully.");
        } catch (error) {
          console.error(error);
          notify(error.message || "Could not upload profile photo.");
        }
      }

      async function handleCoverUpload(file) {
        try {
          notify("Uploading cover photo...");

          const coverUrl = await uploadImage(file, "cover");

          coverTransform = {
            scale: 1,
            x: 0,
            y: 0
          };

          const updatedMetadata = {
            ...(currentUser.user_metadata || {}),
            cover_url: coverUrl,
            cover_transform: coverTransform
          };

          await saveMetadata(updatedMetadata);

          $("coverImage").src = coverUrl;
          applyCoverTransform();

          notify("Cover photo uploaded successfully.");
        } catch (error) {
          console.error(error);
          notify(error.message || "Could not upload cover photo.");
        }
      }

      async function saveCoverPosition() {
        try {
          const updatedMetadata = {
            ...(currentUser.user_metadata || {}),
            cover_transform: {
              scale: coverTransform.scale,
              x: coverTransform.x,
              y: coverTransform.y
            }
          };

          await saveMetadata(updatedMetadata);

          notify("Cover position saved.");
        } catch (error) {
          console.error(error);
          notify(error.message || "Could not save cover position.");
        }
      }

      async function saveProfile() {
        const fullName = $("editName").value.trim();
        const username = $("editUsername").value.trim();
        const bio = $("editBio").value.trim();

        if (!fullName || !username) {
          notify("Name and username are required.");
          return;
        }

        try {
          $("saveProfileButton").disabled = true;

          const updatedMetadata = {
            ...(currentUser.user_metadata || {}),
            full_name: fullName,
            username,
            bio
          };

          await saveMetadata(updatedMetadata);

          const { error } = await db
            .from("profiles")
            .upsert({
              user_id: currentUser.id,
              full_name: fullName,
              username,
              bio,
              updated_at: new Date().toISOString()
            }, {
              onConflict: "user_id"
            });

          if (error) throw error;

          profileData = {
            ...profileData,
            full_name: fullName,
            username,
            bio
          };

          $("profileName").textContent = fullName;
          $("profileUsername").textContent = "@" + username;
          $("profileBio").textContent = bio;

          $("editForm").classList.remove("show");

          notify("Profile saved successfully.");
        } catch (error) {
          console.error(error);
          notify(error.message || "Could not save profile.");
        } finally {
          $("saveProfileButton").disabled = false;
        }
      }

      async function loadStatsAndVideos() {
        const userId = currentUser.id;

        try {
          const { data: videos, error } = await db
            .from("videos")
            .select("id,video_url,caption,created_at")
            .eq("user_id", userId)
            .order("created_at", { ascending: false });

          if (error) throw error;

          const list = videos || [];

          $("videoCount").textContent = list.length;

          if (!list.length) {
            $("videoGrid").innerHTML =
              '<p class="empty">No videos uploaded yet.</p>';
          } else {
            $("videoGrid").innerHTML = list.map(video => `
              <article class="video-card">
                <video controls preload="metadata"
                  src="${escapeHTML(video.video_url)}"></video>
                <p>${escapeHTML(video.caption || "Creator video")}</p>
              </article>
            `).join("");
          }
        } catch (error) {
          console.error("Video loading error:", error);
          $("videoGrid").innerHTML =
            '<p class="empty">Could not load videos.</p>';
        }

        try {
          const { count: followers, error: followersError } = await db
            .from("followers")
            .select("*", { count: "exact", head: true })
            .eq("following_id", userId);

          if (!followersError) {
            $("followerCount").textContent = followers ?? 0;
          }

          const { count: following, error: followingError } = await db
            .from("followers")
            .select("*", { count: "exact", head: true })
            .eq("follower_id", userId);

          if (!followingError) {
            $("followingCount").textContent = following ?? 0;
          }
        } catch (error) {
          console.error("Profile stats error:", error);
        }
      }

      function openEditForm() {
        $("editForm").classList.add("show");
        $("menu").classList.remove("show");

        $("editForm").scrollIntoView({
          behavior: "smooth",
          block: "center"
        });
      }

      function resetCover() {
        coverTransform = {
          scale: 1,
          x: 0,
          y: 0
        };

        applyCoverTransform();
      }

      function pointerPosition(event) {
        const rect = $("coverArea").getBoundingClientRect();

        return {
          x: event.clientX - rect.left,
          y: event.clientY - rect.top
        };
      }

      $("menuButton").addEventListener("click", () => {
        $("menu").classList.toggle("show");
      });

      document.addEventListener("click", event => {
        if (!event.target.closest(".menu-wrap")) {
          $("menu").classList.remove("show");
        }
      });

      $("editMenuButton").addEventListener("click", openEditForm);

      $("settingsButton").addEventListener("click", () => {
        $("menu").classList.remove("show");
        $("settingsModal").classList.add("show");
      });

      $("closeSettingsButton").addEventListener("click", () => {
        $("settingsModal").classList.remove("show");
      });

      $("logoutButton").addEventListener("click", async () => {
        const { error } = await db.auth.signOut();

        if (error) {
          notify(error.message);
          return;
        }

        location.href = "index.html";
      });

      $("avatarUpload").addEventListener("change", event => {
        const file = event.target.files?.[0];

        if (file) handleAvatarUpload(file);

        event.target.value = "";
      });

      $("coverUpload").addEventListener("change", event => {
        const file = event.target.files?.[0];

        if (file) handleCoverUpload(file);

        event.target.value = "";
      });

      $("openCoverEditor").addEventListener("click", () => {
        $("coverEditor").classList.toggle("show");
      });

      $("coverZoom").addEventListener("input", updateCoverFromControls);
      $("coverX").addEventListener("input", updateCoverFromControls);
      $("coverY").addEventListener("input", updateCoverFromControls);

      $("saveCoverButton").addEventListener("click", saveCoverPosition);
      $("resetCoverButton").addEventListener("click", resetCover);

      $("saveProfileButton").addEventListener("click", saveProfile);

      $("cancelEditButton").addEventListener("click", () => {
        $("editForm").classList.remove("show");
      });

      $("coverArea").addEventListener("pointerdown", event => {
        if (event.target.closest(".cover-controls")) return;

        $("coverArea").setPointerCapture(event.pointerId);

        const point = pointerPosition(event);

        dragState = {
          pointerId: event.pointerId,
          startX: point.x,
          startY: point.y,
          originalX: coverTransform.x,
          originalY: coverTransform.y
        };
      });

      $("coverArea").addEventListener("pointermove", event => {
        if (!dragState || dragState.pointerId !== event.pointerId) return;

        const point = pointerPosition(event);

        coverTransform.x =
          dragState.originalX + point.x - dragState.startX;

        coverTransform.y =
          dragState.originalY + point.y - dragState.startY;

        applyCoverTransform();
      });

      function stopDragging(event) {
        if (dragState?.pointerId === event.pointerId) {
          dragState = null;
        }
      }

      $("coverArea").addEventListener("pointerup", stopDragging);
      $("coverArea").addEventListener("pointercancel", stopDragging);

      if (db?.auth) {
        db.auth.onAuthStateChange((event, session) => {
          if (event === "SIGNED_OUT" || !session) {
            location.href = "index.html";
          }
        });
      }

      loadProfile().catch(error => {
        console.error(error);
        $("loading").textContent =
          error.message || "Could not load profile.";
      });
    })();
  </script>
</body>
</html>
