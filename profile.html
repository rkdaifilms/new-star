<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>New Star - Profile</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#000;color:#fff;padding-bottom:70px}
button,input{font:inherit}
button{cursor:pointer}
.container{max-width:600px;margin:auto;min-height:100vh;background:#080808;padding:15px 12px 80px}
.hidden{display:none!important}
.card{background:#15151b;border:1px solid #333;border-radius:12px;padding:16px;margin-bottom:12px}
h2,h3{color:#25f4ee;margin-bottom:12px}
h2{font-size:20px}h3{font-size:15px}
label{display:block;color:#ccc;font-size:12px;margin:10px 0 5px}
.input{width:100%;background:#08080b;color:white;border:1px solid #444;padding:12px;border-radius:8px;margin-bottom:8px}
.primary,.secondary{width:100%;padding:12px;border-radius:8px;margin-top:8px;font-weight:bold}
.primary{background:linear-gradient(120deg,#fe2c55,#ff6b8b);border:0;color:white}
.secondary{background:#262630;border:1px solid #555;color:white}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1;min-width:0}
.muted{color:#aaa;font-size:12px;line-height:1.6}
.profile-head{display:flex;gap:15px;align-items:center}
.avatar{width:82px;height:82px;border-radius:50%;background:#252530;border:2px solid #25f4ee;display:flex;align-items:center;justify-content:center;font-size:32px;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.profile-name{font-size:19px;font-weight:bold;overflow-wrap:anywhere}
.profile-email{font-size:12px;color:#aaa;margin-top:5px;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:16px}
.stat{background:#0b0b10;border:1px solid #333;border-radius:9px;text-align:center;padding:12px}
.stat b{font-size:18px;color:#25f4ee;display:block}
.stat span{font-size:11px;color:#aaa}
.video-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.video-card{background:#111;border:1px solid #333;border-radius:10px;overflow:hidden;min-width:0}
.video-card video{width:100%;aspect-ratio:9/14;object-fit:cover;background:#000;display:block}
.video-caption{padding:9px;font-size:12px;line-height:1.5;overflow-wrap:anywhere}
.video-date{font-size:10px;color:#999;margin-top:5px}
.status{background:#101014;border:1px solid #444;border-radius:8px;padding:12px;font-size:12px;line-height:1.6;overflow-wrap:anywhere}
.nav{position:fixed;bottom:0;left:0;width:100%;height:55px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;z-index:100}
.nav a{flex:1;text-align:center;color:#aaa;text-decoration:none;font-size:11px}
button:disabled{opacity:.5}
</style>
</head>
<body>
<div class="container">

<section id="authBox" class="card hidden">
  <h2>⭐ New Star Login</h2>
  <p class="muted">अपनी प्रोफाइल और अपलोड किए हुए वीडियो देखने के लिए Login करें।</p>
  <label>Email</label>
  <input id="email" class="input" type="email" autocomplete="email" placeholder="Email address">
  <label>Password</label>
  <input id="password" class="input" type="password" autocomplete="current-password" placeholder="Password">
  <button class="primary" id="loginBtn" onclick="login()">Login</button>
  <p id="authMessage" class="muted" style="margin-top:10px"></p>
  <button class="secondary" onclick="location.href='camera.html'">Camera Studio खोलें</button>
</section>

<section id="profileBox" class="hidden">
  <div class="card">
    <div class="profile-head">
      <div class="avatar" id="avatar">⭐</div>
      <div style="min-width:0">
        <div class="profile-name" id="profileName">Creator</div>
        <div class="profile-email" id="profileEmail"></div>
        <div class="muted" id="profileUsername"></div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b id="videoCount">0</b><span>Uploaded Videos</span></div>
      <div class="stat"><b id="accountStatus">Active</b><span>Account Status</span></div>
    </div>
    <button class="secondary" onclick="editProfile()">✏️ Edit Profile</button>
    <button class="secondary" onclick="location.href='camera.html'">🎬 Open Camera Studio</button>
    <button class="secondary" onclick="loadMyVideos()">🔄 Refresh Videos</button>
    <button class="secondary" onclick="logout()">Logout</button>
  </div>

  <div id="editBox" class="card hidden">
    <h3>Edit Profile</h3>
    <label>Full Name</label>
    <input id="editName" class="input" maxlength="80" placeholder="Your name">
    <label>Username</label>
    <input id="editUsername" class="input" maxlength="30" placeholder="username">
    <label>Bio</label>
    <input id="editBio" class="input" maxlength="250" placeholder="About you">
    <button class="primary" onclick="saveProfile()">Save Profile</button>
    <button class="secondary" onclick="$('editBox').classList.add('hidden')">Cancel</button>
  </div>

  <div class="card">
    <h3>🎥 My Uploaded Videos</h3>
    <div id="videoStatus" class="status">वीडियो लोड हो रहे हैं...</div>
    <div id="videoGrid" class="video-grid" style="margin-top:12px"></div>
  </div>
</section>
</div>

<nav class="nav">
  <a href="index.html">🏠<br>Home</a>
  <a href="wallet.html">🪙<br>Wallet</a>
  <a href="camera.html">＋<br>Create</a>
  <a href="inbox.html">💬<br>Inbox</a>
  <a href="profile.html">⭐<br>Profile</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
let db=null,currentUser=null;

function getClient(){
  if(typeof supabaseClient!=='undefined')return supabaseClient;
  if(window.supabaseClient)return window.supabaseClient;
  throw new Error('supabase-config.js में supabaseClient नहीं मिला।');
}
function showAuth(message=''){
  $('authBox').classList.remove('hidden');
  $('profileBox').classList.add('hidden');
  $('authMessage').textContent=message;
}
function showProfile(){
  $('authBox').classList.add('hidden');
  $('profileBox').classList.remove('hidden');
  const meta=currentUser.user_metadata||{};
  const name=meta.full_name||meta.name||'New Star Creator';
  const username=meta.username||'';
  $('profileName').textContent=name;
  $('profileEmail').textContent=currentUser.email||'';
  $('profileUsername').textContent=username?'@'+username:'';
  $('editName').value=name;
  $('editUsername').value=username;
  $('editBio').value=meta.bio||'';
  loadMyVideos();
}
async function login(){
  try{
    const email=$('email').value.trim(),password=$('password').value;
    if(!email||!password)throw new Error('Email और Password भरें।');
    $('loginBtn').disabled=true;
    $('authMessage').textContent='Login हो रहा है...';
    const {data,error}=await db.auth.signInWithPassword({email,password});
    if(error)throw error;
    currentUser=data.user;
    showProfile();
  }catch(e){$('authMessage').textContent=e.message}
  finally{$('loginBtn').disabled=false}
}
async function logout(){
  const {error}=await db.auth.signOut();
  if(error){alert('Logout error: '+error.message);return}
  currentUser=null;showAuth('आप Logout हो गए हैं।');
}
function editProfile(){$('editBox').classList.toggle('hidden')}
async function saveProfile(){
  try{
    if(!currentUser)throw new Error('पहले Login करें।');
    const full_name=$('editName').value.trim();
    const username=$('editUsername').value.trim().replace(/^@/,'').toLowerCase();
    const bio=$('editBio').value.trim();
    if(!full_name)throw new Error('नाम खाली नहीं हो सकता।');
    if(username&&!/^[a-z0-9_.]{3,30}$/.test(username)){
      throw new Error('Username में 3-30 अक्षर, नंबर, _ या . इस्तेमाल करें।');
    }
    const {data,error}=await db.auth.updateUser({
      data:{...currentUser.user_metadata,full_name,username,bio}
    });
    if(error)throw error;
    currentUser=data.user;
    showProfile();
    $('editBox').classList.add('hidden');
    alert('Profile updated successfully');
  }catch(e){alert('Profile save error: '+e.message)}
}
function safeHttpUrl(value){
  try{
    const u=new URL(value);
    return ['http:','https:'].includes(u.protocol)?u.href:null;
  }catch{return null}
}
function makeVideoCard(item){
  const card=document.createElement('article');
  card.className='video-card';

  const url=safeHttpUrl(item.video_url);
  if(url){
    const player=document.createElement('video');
    player.src=url;
    player.controls=true;
    player.playsInline=true;
    player.preload='metadata';
    player.setAttribute('controlsList','nodownload');
    card.appendChild(player);
  }else{
    const missing=document.createElement('div');
    missing.className='status';
    missing.textContent='Video URL उपलब्ध नहीं है।';
    card.appendChild(missing);
  }

  const caption=document.createElement('div');
  caption.className='video-caption';
  caption.textContent=item.caption||'Untitled Video';
  card.appendChild(caption);

  const date=document.createElement('div');
  date.className='video-date';
  date.textContent=item.created_at?
    new Date(item.created_at).toLocaleString():'';
  caption.appendChild(date);

  return card;
}
async function loadMyVideos(){
  if(!currentUser)return;
  const grid=$('videoGrid'),status=$('videoStatus');
  grid.replaceChildren();
  status.textContent='Supabase से वीडियो लोड हो रहे हैं...';

  try{
    const {data,error}=await db.from('videos')
      .select('id,user_id,video_url,caption,created_at')
      .eq('user_id',currentUser.id)
      .order('created_at',{ascending:false});

    if(error)throw error;
    $('videoCount').textContent=(data||[]).length;

    if(!data||data.length===0){
      status.textContent='अभी तक आपने कोई वीडियो अपलोड नहीं किया है।';
      return;
    }

    status.textContent='आपके '+data.length+' वीडियो लोड हो गए।';
    data.forEach(item=>grid.appendChild(makeVideoCard(item)));
  }catch(e){
    console.error('Video fetch error:',e);
    status.textContent='वीडियो लोड नहीं हुए: '+e.message;
  }
}
async function init(){
  try{
    db=getClient();
    const {data,error}=await db.auth.getSession();
    if(error)throw error;
    if(data.session){
      currentUser=data.session.user;showProfile();
    }else showAuth();
    db.auth.onAuthStateChange((_event,session)=>{
      currentUser=session?.user||null;
      if(currentUser)showProfile();else showAuth();
    });
  }catch(e){showAuth('Supabase connection error: '+e.message)}
}
init();
</script>
</body>
</html>
