name: New Star Developer Android APK

on:
  push:
    branches: [main]
    paths:
      - "developer-android/**"
      - ".github/workflows/android-developer-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: new-star-developer-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-developer-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build standalone Developer APK
        run: gradle -p developer-android :app:assembleDebug --no-daemon

      - name: Verify APK package
        shell: bash
        run: |
          set -euo pipefail
          APK="developer-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.newstar.developer'"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK" | tee new-star-developer-apk-sha256.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: new-star-developer-android-${{ github.sha }}
          path: |
            developer-android/app/build/outputs/apk/debug/app-debug.apk
            new-star-developer-apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
