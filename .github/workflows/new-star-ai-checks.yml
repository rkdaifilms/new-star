name: New Star AI Checks

on:
  push:
    branches:
      - new-star-gift-ui-fix
    paths:
      - "new-star-ai.js"
      - "new-star-ai.html"
      - "new-star-ai.css"
      - "ai-chat.js"
      - "settings.html"
      - "navbar.js"
      - "creator-ai.html"
      - "supabase/functions/ai-gateway/**"
      - "tests/ai-engine-core_test.ts"
      - ".github/workflows/new-star-ai-checks.yml"
  pull_request:
    paths:
      - "new-star-ai.js"
      - "new-star-ai.html"
      - "new-star-ai.css"
      - "ai-chat.js"
      - "settings.html"
      - "navbar.js"
      - "creator-ai.html"
      - "supabase/functions/ai-gateway/**"
      - "tests/ai-engine-core_test.ts"
      - ".github/workflows/new-star-ai-checks.yml"

permissions:
  contents: read

jobs:
  ai-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check browser JavaScript syntax
        run: |
          node --check new-star-ai.js
          node --check ai-chat.js
      - name: Run New Star AI regression tests
        run: deno test --no-check --allow-read=. tests/ai-engine-core_test.ts
