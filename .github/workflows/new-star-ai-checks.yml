name: New Star AI Engine Checks

on:
  push:
    branches:
      - new-star-ai-engine-foundation
    paths:
      - "new-star-ai.js"
      - "supabase/functions/ai-gateway/**"
      - "ai-model/**"
      - ".github/workflows/new-star-ai-checks.yml"
  pull_request:
    branches:
      - main
    paths:
      - "new-star-ai.js"
      - "supabase/functions/ai-gateway/**"
      - "ai-model/**"
      - ".github/workflows/new-star-ai-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: new-star-ai-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate AI frontend and Edge Function
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check browser JavaScript syntax
        run: node --check new-star-ai.js

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Supabase Edge Function
        run: deno check --no-lock supabase/functions/ai-gateway/index.ts

      - name: Validate self-hosted model runtime configuration
        run: ruby -e 'require "yaml"; config = YAML.load_file("ai-model/docker-compose.yml"); abort "missing new-star-model service" unless config.dig("services", "new-star-model")'

      - name: Verify required AI actions and authentication guards
        shell: bash
        run: |
          set -euo pipefail
          FILE="supabase/functions/ai-gateway/index.ts"
          grep -F 'auth.getUser()' "$FILE"
          grep -F 'consume_ai_gateway_rate_limit' "$FILE"
          grep -F 'body?.action === "transcribe"' "$FILE"
          grep -F 'body?.action === "speak"' "$FILE"
          grep -F 'body?.action === "image"' "$FILE"
          grep -F 'new_star_ai_conversations' "$FILE"
          grep -F 'new_star_ai_messages' "$FILE"
          grep -F 'callNewStarHostedModel' "$FILE"
          grep -F 'NEW_STAR_MODEL_BASE_URL' "$FILE"
          grep -F 'NEW_STAR_MODEL_NAME' "$FILE"
