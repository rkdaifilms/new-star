name: New Star AI Engine Checks

on:
  push:
    branches:
      - new-star-ai-engine-foundation
    paths:
      - "new-star-ai.js"
      - "creator-ai.js"
      - "new-star-ai.html"
      - "new-star-ai.css"
      - "ai-video/**"
      - "supabase/functions/ai-gateway/**"
      - "supabase/migrations/**"
      - "ai-model/**"
      - ".github/workflows/new-star-ai-checks.yml"
  pull_request:
    branches:
      - main
    paths:
      - "new-star-ai.js"
      - "creator-ai.js"
      - "new-star-ai.html"
      - "new-star-ai.css"
      - "ai-video/**"
      - "supabase/functions/ai-gateway/**"
      - "ai-model/**"
      - ".github/workflows/new-star-ai-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: new-star-ai-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate AI frontend and Edge Function
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check browser JavaScript syntax
        run: |
          node --check new-star-ai.js
          node --check creator-ai.js

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Supabase Edge Function
        run: deno check --no-lock supabase/functions/ai-gateway/index.ts

      - name: Validate self-hosted model runtime configuration
        run: ruby -e 'require "yaml"; config = YAML.load_file("ai-model/docker-compose.yml"); abort "missing new-star-model service" unless config.dig("services", "new-star-model")'

      - name: Verify required AI actions and authentication guards
        shell: bash
        run: |
          set -euo pipefail
          FILE="supabase/functions/ai-gateway/index.ts"
          grep -F 'auth.getUser()' "$FILE"
          grep -F 'consume_ai_gateway_rate_limit' "$FILE"
          grep -F 'body?.action === "transcribe"' "$FILE"
          grep -F 'body?.action === "speak"' "$FILE"
          grep -F 'body?.action === "image"' "$FILE"
          grep -F 'body?.action === "search"' "$FILE"
          grep -F 'body?.action === "vision"' "$FILE"
          grep -F 'new_star_ai_conversations' "$FILE"
          grep -F 'new_star_ai_messages' "$FILE"
          grep -F 'callNewStarHostedModel' "$FILE"
          grep -F 'probeNewStarHostedModel' "$FILE"
          grep -F 'newStarHostedModel: newStarModel' "$FILE"
          grep -F 'NEW_STAR_MODEL_BASE_URL' "$FILE"
          grep -F 'NEW_STAR_MODEL_NAME' "$FILE"
          grep -F 'async function probeApiProvider' "$FILE"
          grep -F 'async function probeOpenRouterProvider' "$FILE"
          grep -F 'credits_exhausted' "$FILE"
          grep -F 'providerHealth' "$FILE"
          grep -F 'searchWithGeminiGrounding' "$FILE"
          grep -F 'type: "google_search"' "$FILE"
          grep -F 'generation permissions, billing, quota' "$FILE"
          grep -F 'api_key_create' "$FILE"
          grep -F 'api_key_list' "$FILE"
          grep -F 'api_key_revoke' "$FILE"
          grep -F 'new_star_ai_api_keys' "$FILE"
          grep -F 'consumeAiGatewayRateLimit' "$FILE"
          grep -F 'consume_ai_gateway_api_key_rate_limit' "$FILE"
          grep -F 'apiKeyId' "$FILE"
          grep -F 'private.ai_gateway_api_key_rate_limits' supabase/migrations/20261125000000_ai_gateway_api_key_rate_limits.sql
          grep -F 'sha256Hex' "$FILE"
          grep -F 'body?.action === "video"' "$FILE"
          grep -F 'body?.action === "video-status"' "$FILE"
          grep -F 'store: false' "$FILE"
          grep -F 'p_limit: 60' "$FILE"
          grep -F '"4K": {' "$FILE"

      - name: Verify Creator Studio AI controls and safe video state
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'data-mode="chat"' new-star-ai.html
          grep -F 'data-mode="research"' new-star-ai.html
          grep -F 'data-mode="image"' new-star-ai.html
          grep -F 'data-mode="video"' new-star-ai.html
          grep -F 'client.functions.invoke("ai-gateway"' new-star-ai.js
          grep -F 'action:"search"' new-star-ai.js
          grep -F 'action:"vision"' new-star-ai.js
          grep -F 'async function toggleVoice()' new-star-ai.js
          grep -F 'transcribeVoice(blob)' new-star-ai.js
          grep -F 'selectedAppLanguage()||lastTranscriptionLanguage||"auto"' new-star-ai.js
          grep -F 'pendingSendAfterTranscription' creator-ai.js
          grep -F 'action:"video"' new-star-ai.js
          grep -F 'action:"video-status"' new-star-ai.js
          grep -F 'Developer API keys' new-star-ai.html
          grep -F 'new-star-ai.html' creator-ai.html
          grep -F 'Google Cloud Vertex AI' ai-video/README.md
          grep -F 'No end-to-end provider generation has been verified' ai-video/README.md
          grep -F 'ns_live_YOUR_KEY' new-star-ai.html
