name: Android App (automatic APK)

on:
  push:
    branches:
      - main
      - new-star-gift-ui-fix
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build and verify installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest GitHub source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate and normalize Google Web Client ID
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          GOOGLE_WEB_CLIENT_ID="$(printf '%s' "${GOOGLE_WEB_CLIENT_ID:-}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")"
          if [[ ! "$GOOGLE_WEB_CLIENT_ID" =~ ^[0-9]+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$ ]]; then
            echo "::error::GOOGLE_WEB_CLIENT_ID is missing or invalid. Use the Google OAuth Web Client ID, not the Client Secret."
            exit 1
          fi
          echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID" >> "$GITHUB_ENV"
          echo "Google Web Client ID validated (value hidden)."

      - name: Prepare stable Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 secret is required; refusing to build an APK with a temporary signing key}"
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is required}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS is required}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD is required}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/newstar-upload.jks"
          test -s "$RUNNER_TEMP/newstar-upload.jks"
          KEY_SHA1="$(keytool -list -v -keystore "$RUNNER_TEMP/newstar-upload.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | awk -F': ' '/SHA1:/{print $2; exit}' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_SHA1="43:35:BD:90:21:F6:33:09:6E:9D:B6:43:3C:A8:9D:B5:19:27:3D:57"
          if [[ "$KEY_SHA1" != "$EXPECTED_SHA1" ]]; then
            echo "::error::The configured keystore is not New Star's stable signing key. Expected SHA-1: $EXPECTED_SHA1"
            exit 1
          fi
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/newstar-upload.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "Stable Android signing key loaded and fingerprint verified: $KEY_SHA1"

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --no-daemon

      - name: Print Android OAuth signing fingerprints
        run: gradle -p android :app:signingReport --no-daemon

      - name: Verify APK package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          "$ANDROID_HOME/platform-tools/adb" version
          sha256sum "$APK" | tee android-apk-sha256.txt
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK and build verification
        uses: actions/upload-artifact@v4
        with:
          name: new-star-android-apk-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android-apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
