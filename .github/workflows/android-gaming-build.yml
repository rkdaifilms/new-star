name: Android App (automatic APK)

on:
  push:
    branches:
      - main
      - gaming-connectivity-fix
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build and verify installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest GitHub source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --no-daemon

      - name: Verify APK package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          "$ANDROID_HOME/platform-tools/adb" version
          sha256sum "$APK" | tee android-apk-sha256.txt
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK and build verification
        uses: actions/upload-artifact@v4
        with:
          name: new-star-android-apk-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android-apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
