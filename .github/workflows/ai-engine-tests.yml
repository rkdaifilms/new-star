name: New Star AI Engine Tests

on:
  push:
    branches:
      - new-star-ai-engine-foundation
    paths:
      - "supabase/functions/ai-gateway/**"
      - "tests/**"
      - "ai-engine/self-hosted/**"
      - "scripts/new-star-search-ingest.ts"
      - "supabase/migrations/20261125125100_new_star_private_search.sql"
      - "supabase/migrations/20261125125524_reuse_existing_new_star_search_chunks.sql"
      - "supabase/migrations/20261125130256_new_star_hybrid_search_embedding_rpc.sql"
      - "supabase/migrations/20261125131109_replace_new_star_search_chunks_rpc.sql"
      - "supabase/migrations/20261125131209_harden_search_chunk_replacement_rpc.sql"
      - ".github/workflows/ai-engine-tests.yml"
  pull_request:
    paths:
      - "supabase/functions/ai-gateway/**"
      - "tests/**"
      - "ai-engine/self-hosted/**"
      - "scripts/new-star-search-ingest.ts"
      - "supabase/migrations/20261125125100_new_star_private_search.sql"
      - "supabase/migrations/20261125125524_reuse_existing_new_star_search_chunks.sql"
      - "supabase/migrations/20261125130256_new_star_hybrid_search_embedding_rpc.sql"
      - "supabase/migrations/20261125131109_replace_new_star_search_chunks_rpc.sql"
      - "supabase/migrations/20261125131209_harden_search_chunk_replacement_rpc.sql"
      - ".github/workflows/ai-engine-tests.yml"

permissions:
  contents: read

concurrency:
  group: ai-engine-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: AI engine regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run AI engine regression tests
        run: deno test --allow-read tests/ai-engine-core_test.ts
      - name: Validate private model startup scripts
        run: |
          bash -n ai-engine/self-hosted/verify.sh ai-engine/self-hosted/verify-embeddings.sh ai-engine/self-hosted/deploy-workers.sh
          bash -c 'set -a; source ai-engine/self-hosted/.env.example; python3 -c "import json,os; v=json.loads(os.environ[\\"NEW_STAR_PIPER_VOICES\\"]); assert isinstance(v,dict) and v"'
      - name: Type-check private search ingestion tool
        run: deno check scripts/new-star-search-ingest.ts
      - name: Type-check private gateway adapters
        run: deno check supabase/functions/ai-gateway/private-search.ts supabase/functions/ai-gateway/private-vision.ts supabase/functions/ai-gateway/private-video.ts supabase/functions/ai-gateway/private-image.ts supabase/functions/ai-gateway/private-speech.ts

      - name: Validate private worker Python syntax
        run: python3 -m py_compile ai-engine/self-hosted/speech-worker/main.py ai-engine/self-hosted/image-worker/main.py ai-engine/self-hosted/video-worker/main.py ai-engine/self-hosted/search-worker/main.py ai-engine/self-hosted/vision-worker/main.py ai-engine/training/prepare_dataset.py ai-engine/training/train_lora.py ai-engine/self-hosted/verify-workers.py tests/ai_engine_worker_verify_test.py
      - name: Test private worker verification and authentication checks
        run: python3 -m unittest discover -s tests -p 'ai_engine_worker_verify_test.py' -v
