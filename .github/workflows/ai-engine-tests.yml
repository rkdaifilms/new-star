name: New Star AI Engine Tests

on:
  push:
    branches:
      - new-star-ai-engine-foundation
    paths:
      - "supabase/functions/ai-gateway/**"
      - "tests/ai-engine-core_test.ts"
      - ".github/workflows/ai-engine-tests.yml"
  pull_request:
    paths:
      - "supabase/functions/ai-gateway/**"
      - "tests/ai-engine-core_test.ts"
      - ".github/workflows/ai-engine-tests.yml"

permissions:
  contents: read

concurrency:
  group: ai-engine-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: AI engine regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run AI engine regression tests
        run: deno test --allow-read tests/ai-engine-core_test.ts
      - name: Check formatting
        run: deno fmt --check tests/ai-engine-core_test.ts supabase/functions/ai-gateway
