name: New Star CPU Inference Checks

on:
  pull_request:
    paths:
      - "ai-inference/**"
      - ".github/workflows/ai-inference-checks.yml"
  push:
    branches:
      - new-star-own-ai-engine-cpu
    paths:
      - "ai-inference/**"
      - ".github/workflows/ai-inference-checks.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-inference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-inference/requirements.txt
      - name: Install test dependencies
        run: pip install "fastapi==0.115.12" "pydantic==2.11.4" "pytest==8.3.5" "httpx==0.28.1"
      - name: Compile Python source
        run: python -m compileall -q app.py tests
      - name: Run API tests
        run: pytest -q

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU inference container
        run: docker build --tag new-star-cpu-inference:ci ./ai-inference
