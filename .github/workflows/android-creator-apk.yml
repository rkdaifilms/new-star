name: New Star Creator Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-creator-apk.yml'

permissions:
  contents: read

concurrency:
  group: new-star-creator-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-creator-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      # Fast lane: one Gradle invocation reuses configuration and compilation
      # outputs for both APK assembly and unit tests.
      - name: Build APK and run unit tests
        run: gradle -p android :app:assembleDebug :app:testDebugUnitTest --no-daemon --build-cache --parallel
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.newstar.live'"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK" | tee new-star-android-apk-sha256.txt
      - name: Launch app on Android emulator and check for startup crash
        if: github.event_name == 'workflow_dispatch'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -euo pipefail
            APK="android/app/build/outputs/apk/debug/app-debug.apk"
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop com.newstar.live
            adb shell monkey -p com.newstar.live 1
            sleep 25
            if ! adb shell pidof com.newstar.live >/dev/null; then
              echo "New Star process is not running after launch."
              adb logcat -d -v time
              exit 1
            fi
            if adb logcat -d -v time | grep -E "FATAL EXCEPTION|Fatal signal [0-9]+|Process: com.newstar.live"; then
              echo "A fatal startup error was recorded in logcat."
              exit 1
            fi
            echo "New Star stayed running for the startup smoke-test window."
      - name: Upload installable APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-star-android-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            new-star-android-apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
