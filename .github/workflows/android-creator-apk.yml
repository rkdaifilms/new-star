name: New Star Creator Android APK

on:
  push:
    branches: [main, new-star-gift-ui-fix]
    paths:
      - "android/**"
      - ".github/workflows/android-creator-apk.yml"
      - "new-star-ai.js"
      - "new-star-ai.html"
      - "new-star-ai.css"
      - "ai-chat.js"
      - "settings.html"
      - "navbar.js"
      - "creator-ai.html"
      - "supabase/functions/ai-gateway/**"
      - "tests/ai-engine-core_test.ts"
  pull_request:
    paths:
      - "android/**"
      - "new-star-ai.js"
      - "new-star-ai.html"
      - "new-star-ai.css"
      - "ai-chat.js"
      - "settings.html"
      - "navbar.js"
      - "creator-ai.html"
      - "supabase/functions/ai-gateway/**"
      - "tests/ai-engine-core_test.ts"
      - ".github/workflows/android-creator-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: new-star-creator-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-creator-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check AI browser JavaScript syntax
        run: |
          node --check new-star-ai.js
          node --check ai-chat.js

      - name: Run New Star AI regression tests
        run: deno test --no-check --allow-read=. tests/ai-engine-core_test.ts

      - name: Validate native Google Sign-In configuration
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          # Normalize accidental surrounding whitespace or quotes without exposing the ID.
          GOOGLE_WEB_CLIENT_ID="$(printf '%s' "${GOOGLE_WEB_CLIENT_ID:-}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")"
          if [[ -z "$GOOGLE_WEB_CLIENT_ID" ]]; then
            echo "::error::GOOGLE_WEB_CLIENT_ID is missing from GitHub Actions repository variables or secrets."
            exit 1
          fi
          if [[ ! "$GOOGLE_WEB_CLIENT_ID" =~ ^[0-9]+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$ ]]; then
            echo "::error::GOOGLE_WEB_CLIENT_ID is not a valid-looking Google OAuth Web client ID. Check that the value is the Client ID, not the Client Secret."
            exit 1
          fi
          echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID" >> "$GITHUB_ENV"
          echo "Google Web Client ID format validated (value hidden)."

      - name: Require and verify stable Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 secret is missing}"
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD secret is missing}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS secret is missing}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD secret is missing}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/newstar-upload.jks"
          test -s "$RUNNER_TEMP/newstar-upload.jks"
          KEY_SHA1="$(keytool -list -v -keystore "$RUNNER_TEMP/newstar-upload.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | awk -F': ' '/SHA1:/{print $2; exit}' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_SHA1="43:35:BD:90:21:F6:33:09:6E:9D:B6:43:3C:A8:9D:B5:19:27:3D:57"
          if [[ "$KEY_SHA1" != "$EXPECTED_SHA1" ]]; then
            echo "::error::Wrong Android signing key. Expected the registered New Star SHA-1 fingerprint."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/newstar-upload.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "Stable Android signing key verified (fingerprint hidden)."

      - name: Build New Star Android APK
        run: gradle -p android :app:assembleDebug --no-daemon

      - name: Print APK signing fingerprints for Google OAuth
        run: gradle -p android :app:signingReport --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.newstar.live'"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK" | tee new-star-android-apk-sha256.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: new-star-android-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            new-star-android-apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
