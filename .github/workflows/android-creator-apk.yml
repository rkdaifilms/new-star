name: New Star Creator Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-creator-apk.yml'

permissions:
  contents: read

concurrency:
  group: new-star-creator-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-creator-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build New Star Android APK
        run: gradle -p android :app:assembleDebug --no-daemon
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.newstar.live'"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK" | tee new-star-android-apk-sha256.txt
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: new-star-android-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            new-star-android-apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
