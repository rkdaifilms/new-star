name: Android Release (AAB + APK)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Require and verify registered Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 secret is missing}"
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD secret is missing}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS secret is missing}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD secret is missing}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/newstar-upload-key.jks"
          test -s "$RUNNER_TEMP/newstar-upload-key.jks"
          KEY_SHA1="$(keytool -list -v -keystore "$RUNNER_TEMP/newstar-upload-key.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | awk -F': ' '/SHA1:/{print $2; exit}' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_SHA1="43:35:BD:90:21:F6:33:09:6E:9D:B6:43:3C:A8:9D:B5:19:27:3D:57"
          if [[ "$KEY_SHA1" != "$EXPECTED_SHA1" ]]; then
            echo "::error::Wrong Android signing key. Expected the registered New Star SHA-1 fingerprint."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/newstar-upload-key.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "Registered Android signing key verified (fingerprint hidden)."
      - name: Build signed release APK and Play Store AAB
        run: |
          set -euo pipefail
          gradle -p android :app:assembleRelease :app:bundleRelease --no-daemon
      - name: Verify signed APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK" "$AAB" | tee new-star-android-release-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: new-star-android-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            new-star-android-release-sha256.txt
          if-no-files-found: error
          retention-days: 30
