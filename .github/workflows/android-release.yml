name: Android Release (signed APK + Play Store AAB)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing version tag to build and publish (for example v1.0.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Check signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!value}" ]; then
              echo "::error::Missing GitHub Actions secret: ${value}"
              exit 1
            fi
          done
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/newstar-upload-key.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/newstar-upload-key.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK and Play Store AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle -p android :app:assembleRelease :app:bundleRelease --no-daemon
          mkdir -p release-assets
          cp android/app/build/outputs/apk/release/*.apk release-assets/NewStar.apk
          cp android/app/build/outputs/bundle/release/*.aab release-assets/NewStar.aab
          (cd release-assets && sha256sum NewStar.apk NewStar.aab > SHA256SUMS.txt)
      - name: Publish APK and AAB on GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: New Star ${{ inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/NewStar.apk
            release-assets/NewStar.aab
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
