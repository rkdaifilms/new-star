name: New Star Android Emulator Smoke Test

on:
  push:
    branches: [new-star-repair-pass-1]
    paths:
      - "android/**"
      - ".github/workflows/android-emulator-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: new-star-emulator-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-launch-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --no-daemon

      - name: Boot Android emulator, install and launch app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            APK="android/app/build/outputs/apk/debug/app-debug.apk"
            adb install -r "$APK"
            adb shell pm grant com.newstar.live android.permission.RECORD_AUDIO || true
            adb shell pm grant com.newstar.live android.permission.CAMERA || true
            adb logcat -c
            adb shell am start -W -n com.newstar.live/.MainActivity
            sleep 20
            adb shell pidof com.newstar.live
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | grep -F "com.newstar.live"
            adb shell screencap -p /sdcard/new-star-emulator.png
            adb pull /sdcard/new-star-emulator.png new-star-emulator.png
            adb logcat -d -v time > new-star-emulator-logcat.txt
            if grep -E "FATAL EXCEPTION|Process: com.newstar.live" new-star-emulator-logcat.txt; then
              echo "App crashed during emulator launch smoke test."
              exit 1
            fi

      - name: Upload emulator screenshot and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-star-emulator-smoke-${{ github.run_id }}
          path: |
            new-star-emulator.png
            new-star-emulator-logcat.txt
          if-no-files-found: warn
          retention-days: 14
