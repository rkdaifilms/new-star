name: Supabase Edge Function Type Check

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/supabase-function-check.yml"
  pull_request:
    paths:
      - "supabase/functions/**"
      - ".github/workflows/supabase-function-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check LIVE Edge Function
        run: deno check --no-lock supabase/functions/cloudflare-live/index.ts
