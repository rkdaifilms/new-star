services:
  new-star-cpu-inference:
    build: .
    container_name: new-star-cpu-inference
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    environment:
      MODEL_PATH: ${MODEL_PATH:-/models/Qwen3-0.6B-Q4_0.gguf}
      MODEL_URL: ${MODEL_URL:-https://huggingface.co/ggml-org/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q4_0.gguf}
      MODEL_SHA256: ${MODEL_SHA256:-da2572f16c06133561ce56accaa822216f2391ef4d37fba427801cd6736417d4}
      MODEL_ID: ${MODEL_ID:-new-star-qwen3-0.6b}
      MODEL_TOKEN: ${MODEL_TOKEN:?Set MODEL_TOKEN in ai-inference/.env}
      N_CTX: ${N_CTX:-4096}
      N_THREADS: ${N_THREADS:-2}
      N_GPU_LAYERS: ${N_GPU_LAYERS:-0}
      N_BATCH: ${N_BATCH:-512}
      MAX_TOKENS: ${MAX_TOKENS:-2048}
      MAX_CONCURRENT: ${MAX_CONCURRENT:-1}
    volumes:
      - ./models:/models
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["sh", "-c", "python scripts/download_model.py && uvicorn app:app --host 0.0.0.0 --port 8000 --workers 1"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/healthz'))['ok']"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 600s
    stop_grace_period: 60s
