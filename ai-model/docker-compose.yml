services:
  new-star-model:
    image: vllm/vllm-openai:v0.10.2
    container_name: new-star-model
    restart: unless-stopped
    ipc: host
    ports:
      # Keep inference private on the host. Put a TLS reverse proxy in front
      # before connecting Supabase Edge Functions over the public internet.
      - "127.0.0.1:8000:8000"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    command:
      - --model
      - ${NEW_STAR_MODEL_ID:-Qwen/Qwen3-8B}
      - --served-model-name
      - new-star-model
      - --api-key
      - ${NEW_STAR_MODEL_API_KEY:?Set NEW_STAR_MODEL_API_KEY in ai-model/.env}
      - --max-model-len
      - ${NEW_STAR_MODEL_MAX_LEN:-8192}
      - --dtype
      - auto
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: "16gb"
