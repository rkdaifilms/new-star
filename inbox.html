<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inbox & Direct Messages</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    
    <!-- 📱 PWA MANIFEST & APP INSTALL LINK -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#fe2c55">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="New Star">
    
    <style>
        body.chat-open{overflow:hidden}
        body.chat-open .top-bar,body.chat-open .header,body.chat-open #inboxStatus,body.chat-open .inbox-tabs,body.chat-open .list-container{display:none!important}
        body.chat-open #chatBoxWindow{display:flex!important;position:fixed;inset:0 0 70px;width:100%;height:auto;min-height:0;margin:0;border:0;border-radius:0;z-index:30}
        body.chat-open .chat-box-header{padding-top:max(14px,env(safe-area-inset-top))}
        body.chat-open .chat-messages{overscroll-behavior:contain}
        body.chat-open .chat-input-area{padding-bottom:max(12px,env(safe-area-inset-bottom))}

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #000; color: #fff; padding-bottom: 70px; touch-action: manipulation; }
        
        /* Global Top Navigation Bar (Completely Cleaned) */
        .top-bar { width: 100%; max-width: 450px; display: flex; justify-content: space-between; align-items: center; margin: 10px auto; padding: 0 10px; min-height: 40px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid #222; background: #111; position: sticky; top: 0; z-index: 10; }
        .header h2 { font-size: 18px; color: #fe2c55; }
        #inboxStatus{padding:7px 15px;color:#aaa;font-size:12px;line-height:1.35;background:#080808;border-bottom:1px solid #1b1b1b;min-height:0} #inboxStatus:empty{display:none}
        
        .inbox-tabs{display:flex;gap:20px;padding:12px 16px 8px;background:#111;border-bottom:1px solid #222;overflow-x:auto;white-space:nowrap}
        .inbox-tab{flex:0 0 auto;color:#999;font-size:14px;font-weight:600;padding:6px 0 10px;cursor:pointer;border-bottom:2px solid transparent}
        .inbox-tab.active{color:#fff;border-bottom-color:#fe2c55}
        .inbox-tab small{color:#fe2c55}
        /* Conversation list */
        /* Chat & Follower List */
        .list-container { padding: 10px 15px; }
        .list-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 10px; border-bottom: 1px solid #1a1a1a; cursor: pointer; border-radius: 8px; transition: 0.2s; }
        .list-item:hover { background: #181818; }
        .user-left { display: flex; align-items: center; gap: 12px; flex: 1; }
        .list-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 1px solid #fe2c55; cursor: pointer; }
        .list-info h4 { font-size: 15px; margin-bottom: 3px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .list-info p { font-size: 13px; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 190px; }
        
        .action-tag-btn { background: #fe2c55; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .action-tag-btn.following { background: #222; border: 1px solid #444; color: #ccc; }

        /* REAL MESSENGER CHAT WINDOW - FIXED DISPLAY & POSITIONING */
        #chatBoxWindow { display: none; position: relative; top: auto; left: auto; width: 100%; height: min(68vh,650px); min-height: 390px; margin: 12px 0; background: #000; border: 1px solid #393943; border-radius: 14px; overflow: hidden; z-index: 1; flex-direction: column; }
        .chat-box-header { display: flex; align-items: center; gap: 15px; padding: 15px; background: #111; border-bottom: 1px solid #222; flex-shrink: 0; }
        .chat-box-header img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; cursor: pointer; }
        .chat-box-header h3 { font-size: 16px; cursor: pointer; }
        
        .chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #080808; }
        .message { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-break: break-word; }
        .message.incoming { background: #222; color: #fff; align-self: flex-start; border-bottom-left-radius: 2px; }
        .message.outgoing { background: #fe2c55; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
        .message img, .message video { max-width: 100%; border-radius: 8px; margin-top: 5px; display: block; }
        
        /* Chat Input Area - FIXED AT BOTTOM */
        .chat-input-area { display: flex; padding: 12px 15px; background: #111; border-top: 1px solid #222; gap: 10px; align-items: center; flex-shrink: 0; position: sticky; bottom: 0; }
         .chat-input-area input { flex: 1; min-width:0; padding: 10px 15px; background: #222; border: 1px solid #333; color: #fff; border-radius: 20px; font-size: 14px; outline: none; }
        .chat-input-area input[type="text"]{width:0}
        .chat-input-area #voiceInputStatus{max-width:90px;font-size:10px;line-height:1.2;overflow-wrap:anywhere}
        .chat-icon-btn.is-disabled{opacity:.42;cursor:not-allowed}
        
        .chat-icon-btn { background: #222; border: 1px solid #444; color: #fff; width: 38px; height: 38px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 16px; flex-shrink: 0; }
         .chat-icon-btn:hover { background: #333; border-color: #fe2c55; }
       
        .send-btn { background: #fe2c55; color: #fff; border: none; padding: 8px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; flex-shrink: 0; }

        /* Profile Pop-up Modal */
        .profile-popup-card { background: #181818; border: 1px solid #333; width: 90%; max-width: 320px; border-radius: 16px; padding: 25px; text-align: center; position: relative; }
        .profile-popup-card img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid #fe2c55; margin-bottom: 12px; }
        .profile-popup-card h3 { font-size: 18px; margin-bottom: 4px; }
        .profile-popup-card p { font-size: 13px; color: #aaa; margin-bottom: 15px; }
        .close-popup { position: absolute; top: 12px; right: 15px; font-size: 18px; cursor: pointer; color: #aaa; }
    </style>
</head>
<body>

    <!-- Global Top Bar (Completely Cleaned) -->
    <div class="top-bar">
        <div></div>
        <div></div>
    </div>

    <div class="header">
        <h2 data-i18n="nav.inbox">Inbox</h2>

    </div>

    <div id="inboxStatus" class="empty-state" role="status" aria-live="polite">Connecting to your account…</div>

    <nav class="inbox-tabs" aria-label="Inbox sections">
        <button type="button" class="inbox-tab active" data-tab="messages" onclick="switchInboxTab('messages',this)">Messages</button>
        <button type="button" class="inbox-tab" data-tab="followers" onclick="switchInboxTab('followers',this)">Followers <small id="followersCount"></small></button>
        <button type="button" class="inbox-tab" data-tab="following" onclick="switchInboxTab('following',this)">Following <small id="followingCount"></small></button>
        <button type="button" class="inbox-tab" data-tab="requests" onclick="switchInboxTab('requests',this)">Follow Requests <small id="followRequestCount"></small></button>
    </nav>
    <div class="list-container" id="tabMessages">
        <div class="empty-state" data-i18n="inbox.loading">Loading your conversations…</div>
    </div>
    <div class="list-container" id="tabFollowers" style="display:none"></div>
    <div class="list-container" id="tabFollowing" style="display:none"></div>
    <div class="list-container" id="tabRequests" style="display:none"></div>

    <!-- REAL MESSENGER CHAT WINDOW (FIXED INPUT AREA) -->
    <div id="chatBoxWindow">
        <div class="chat-box-header">
            <span onclick="closeChat()" style="font-size: 22px; cursor: pointer;">←</span>
            <img id="activeChatAvatar" src="" alt="" onclick="showProfileFromChat()">
            <h3 id="activeChatName" onclick="showProfileFromChat()">Creator Name</h3>
        </div>
        
        <div class="chat-messages" id="chatMessagesArea"></div>
        
        <div class="chat-input-area">
            <!-- Plus (+) Button for Gallery Photos/Videos -->
            <button type="button" class="chat-icon-btn is-disabled" title="Photo/video sharing is unavailable until private chat storage is configured" aria-label="Photo and video sharing unavailable" disabled>➕</button>
            <input type="file" id="mediaFile" accept="image/*,video/*" style="display:none;" disabled>
            
            <!-- Voice Recording Mic Button -->
            <button type="button" class="chat-icon-btn" onclick="startVoiceRecording()" id="micBtn" title="Speak your message" aria-label="Start voice input" aria-pressed="false">🎙️</button><span id="voiceInputStatus" class="muted" role="status" aria-live="polite"></span>
            
            <!-- Text Input Box -->
            <input type="text" id="messageInput" maxlength="2000" autocomplete="off" data-i18n-placeholder="inbox.messagePlaceholder" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
            
            <!-- Send Button -->
            <button class="send-btn" onclick="sendMessage()" data-i18n="action.send">Send</button>
        </div>
    </div>

    <!-- 🌟 NAVBAR SCRIPT LOADER (Automatic Footer & Centered Plus) -->
    <script src="i18n.js"></script>
<script src="navbar.js"></script>

    <script>
(function(){"use strict";
const db=window.supabaseClient||window.cloudClient;
const $=id=>document.getElementById(id);
let me=null,activePeer=null,activeConversation=null,realtime=null;
const fallback="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100%" height="100%" fill="#333"/><text x="50%" y="55%" text-anchor="middle" fill="white" font-size="35">★</text></svg>');
function esc(s){return String(s??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]));}
function nameOf(p){return p?.full_name||p?.username||"New Star User";}
function avatarOf(p){return p?.avatar_url||fallback;}
function setStatus(s){const el=$("inboxStatus");if(!el)return;el.textContent=s;el.style.display="block";clearTimeout(window.__newStarInboxStatusTimer);if(/तैयार है|ready/i.test(s)){window.__newStarInboxStatusTimer=setTimeout(()=>{el.textContent="";el.style.display="none";},1800);}}
function setFollowButtonState(button,state){
 const keys={following:"action.following",requested:"action.requested","request-follow":"action.requestFollow",follow:"action.follow",unavailable:null};
 button.dataset.followState=state;
 button.classList.toggle("following",state==="following"||state==="requested");
 const key=keys[state];
 if(key){button.setAttribute("data-i18n",key);button.textContent=state;window.NewStarI18n?.apply(button);}
 else{button.removeAttribute("data-i18n");button.textContent="Unavailable";}
}
async function boot(){
 if(!db?.auth){setStatus("Supabase SDK/config लोड नहीं हुआ। इंटरनेट और supabase-config.js जाँचें।");$("tabMessages").textContent="Inbox कनेक्शन उपलब्ध नहीं है। पेज Reload करें।";return;}
 setStatus("आपका Login session जाँचा जा रहा है…");
 const {data,error}=await db.auth.getUser();
 if(error)throw new Error("Login session जाँच विफल: "+error.message);
 me=data?.user;
 if(!me){setStatus("Login session नहीं मिली। Login पेज खोला जा रहा है…");location.href="auth.html?next="+encodeURIComponent(location.pathname+location.search);return;}
 setStatus("आपके Messages लोड हो रहे हैं…");
 await loadThreads();
 await loadFollowerLists();
 db.channel("newstar-inbox-"+me.id).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"recipient_id=eq."+me.id},async payload=>{
   if(activeConversation===payload.new.conversation_id) await loadConversation();
   await loadThreads();
   await loadFollowRequests();
   await renderRelationList("followers");
 }).subscribe();
 setStatus("Inbox तैयार है।");
 const target=new URLSearchParams(location.search).get("to");
 if(target){
  if(String(target)===String(me.id)){setStatus("आप खुद को Message नहीं भेज सकते।");return;}
  const {data:peer,error:peerError}=await db.from("creator_public_profiles")
   .select("user_id,username,full_name,avatar_url,bio,is_private")
   .eq("user_id",target).maybeSingle();
  if(peerError||!peer){setStatus("यह Creator उपलब्ध नहीं है।");return;}
  if(peer.is_private){setStatus("यह Creator Profile private है।");return;}
  await openChat(peer.user_id,peer);
 }
}
window.switchInboxTab=function(tab,button){
 for(const name of ["messages","followers","following","requests"]){const host=$("tab"+name[0].toUpperCase()+name.slice(1));if(host)host.style.display=name===tab?"block":"none";}
 document.querySelectorAll(".inbox-tab").forEach(x=>x.classList.toggle("active",x===button));
 if(tab==="followers"||tab==="following")renderRelationList(tab);
 if(tab==="requests")loadFollowRequests();
};
async function loadFollowerLists(){await Promise.all([renderRelationList("followers"),renderRelationList("following"),loadFollowRequests()]);}
async function renderRelationList(kind){
 if(!me)return;const host=$("tab"+kind[0].toUpperCase()+kind.slice(1));host.innerHTML='<p class="muted">Loading…</p>';
 let q=db.from("followers").select("follower_id,following_id,created_at");
 q=kind==="followers"?q.eq("following_id",me.id):q.eq("follower_id",me.id);
 const {data:rows,error}=await q.order("created_at",{ascending:false}).limit(200);
 if(error){host.textContent="लिस्ट लोड नहीं हुई।";return;}
 $(kind==="followers"?"followersCount":"followingCount").textContent=rows?.length?"("+rows.length+")":"";
 if(!rows?.length){host.textContent=kind==="followers"?"अभी कोई Follower नहीं है।":"आप अभी किसी Creator को Follow नहीं करते।";return;}
 const ids=rows.map(r=>kind==="followers"?r.follower_id:r.following_id);
 const {data:profiles,error:pe}=await db.from("creator_public_profiles").select("user_id,username,full_name,avatar_url,bio,is_private").in("user_id",ids);
 if(pe){host.textContent="Creator profiles लोड नहीं हुए।";return;}
 const pm=new Map((profiles||[]).map(p=>[String(p.user_id),p]));host.replaceChildren();
 for(const rel of rows){
  const peer=String(kind==="followers"?rel.follower_id:rel.following_id),p=pm.get(peer)||{},row=document.createElement("div");row.className="list-item";
  const left=document.createElement("span");left.className="user-left";const img=document.createElement("img");img.className="list-avatar";img.src=avatarOf(p);img.alt="";
  const info=document.createElement("span");info.className="list-info";const title=document.createElement("h4");title.textContent=nameOf(p);const note=document.createElement("p");note.textContent=p.username?"@"+p.username:"Creator";
  info.append(title,note);left.append(img,info);row.append(left);
  if(kind==="following"){const b=document.createElement("button");b.className="action-tag-btn following";b.textContent="Following";b.onclick=async()=>{b.disabled=true;const {error}=await db.from("followers").delete().eq("follower_id",me.id).eq("following_id",peer);if(error){setStatus("Unfollow नहीं हुआ।");b.disabled=false;return;}await renderRelationList("following");};row.append(b);}
  else row.onclick=()=>location.href="creator.html?user="+encodeURIComponent(peer);
  host.append(row);
 }
}
async function loadFollowRequests(){
 if(!me)return;const host=$("tabRequests");host.innerHTML='<p class="muted">Follow requests लोड हो रहे हैं…</p>';
 const {data:requests,error}=await db.from("follow_requests").select("id,requester_id,created_at,status").eq("target_user_id",me.id).eq("status","pending").order("created_at",{ascending:false}).limit(100);
 if(error){host.textContent="Follow requests लोड नहीं हुए।";$("followRequestCount").textContent="";return;}
 $("followRequestCount").textContent=requests?.length?"("+requests.length+")":"";
 if(!requests?.length){host.textContent="अभी कोई Follow Request नहीं है।";return;}
 const ids=[...new Set(requests.map(x=>x.requester_id))];const {data:profiles}=await db.from("creator_public_profiles").select("user_id,username,full_name,avatar_url,bio").in("user_id",ids);
 const pm=new Map((profiles||[]).map(p=>[String(p.user_id),p]));host.replaceChildren();
 for(const req of requests){
  const p=pm.get(String(req.requester_id))||{},row=document.createElement("div");row.className="list-item";const left=document.createElement("span");left.className="user-left";
  const img=document.createElement("img");img.className="list-avatar";img.src=avatarOf(p);img.alt="";const info=document.createElement("span");info.className="list-info";
  const title=document.createElement("h4");title.textContent=nameOf(p);const note=document.createElement("p");note.textContent="आपको Follow करना चाहते हैं";info.append(title,note);left.append(img,info);
  const actions=document.createElement("span");actions.style.cssText="display:flex;gap:6px";const accept=document.createElement("button");accept.className="action-tag-btn";accept.textContent="Accept";
  const reject=document.createElement("button");reject.className="action-tag-btn following";reject.textContent="Decline";
  accept.onclick=()=>respondFollowRequest(req,"accepted",accept,reject);reject.onclick=()=>respondFollowRequest(req,"rejected",accept,reject);actions.append(accept,reject);row.append(left,actions);host.append(row);
 }
}
async function respondFollowRequest(req,status,accept,reject){
 accept.disabled=true;reject.disabled=true;
 const {error}=await db.from("follow_requests").update({status}).eq("id",req.id).eq("target_user_id",me.id).eq("status","pending");
 if(error){setStatus("Follow request update नहीं हुआ।");accept.disabled=false;reject.disabled=false;return;}
 if(status==="accepted"){const {error:ie}=await db.from("followers").insert({follower_id:req.requester_id,following_id:me.id});if(ie&&!/duplicate|unique/i.test(ie.message||""))setStatus("Request स्वीकार हुई; follower list refresh करें।");}
 setStatus(status==="accepted"?"Follow request स्वीकार कर लिया गया।":"Follow request अस्वीकार कर दिया गया।");
 await Promise.all([loadFollowRequests(),renderRelationList("followers")]);
}
async function loadThreads(){
 const {data,error}=await db.from("messages").select("id,conversation_id,sender_id,recipient_id,body,media_url,created_at,read_at").or("sender_id.eq."+me.id+",recipient_id.eq."+me.id).order("created_at",{ascending:false}).limit(250);
 const host=$("tabMessages");if(error){host.textContent="Messages load नहीं हुए: "+error.message;return;}
 const map=new Map();
 for(const m of data||[]){const peer=m.sender_id===me.id?m.recipient_id:m.sender_id;if(!map.has(peer))map.set(peer,m);}
 if(!map.size){host.innerHTML='<div class="empty-state"><p>अभी कोई बातचीत नहीं है।</p><p class="muted">किसी Creator की Profile पर Message दबाएँ। बातचीत यहाँ दिखाई देगी।</p></div>';return;}
 const ids=[...map.keys()];
 const {data:profiles}=await db.from("creator_public_profiles").select("user_id,username,full_name,avatar_url,bio").in("user_id",ids);
 const pmap=new Map((profiles||[]).map(p=>[p.user_id,p]));
 host.innerHTML="";
 for(const [peer,m] of map){const p=pmap.get(peer)||{};const item=document.createElement("button");item.className="list-item";item.style.cssText="width:100%;background:transparent;color:white;border:0;text-align:left";
 item.innerHTML='<span class="user-left"><img class="list-avatar" src="'+esc(avatarOf(p))+'"><span class="list-info"><h4>'+esc(nameOf(p))+'</h4><p>'+esc(m.body||"Media message")+'</p></span></span><small class="muted">'+esc(new Date(m.created_at).toLocaleDateString())+'</small>';
 item.onclick=()=>openChat(peer,p);host.appendChild(item);}
}
async function stableConversationId(a,b){
 const pair=[String(a),String(b)].sort().join(":");
 const bytes=new TextEncoder().encode("new-star-dm:"+pair);
 const digest=await crypto.subtle.digest("SHA-256",bytes);
 const hex=[...new Uint8Array(digest)].slice(0,16).map(x=>x.toString(16).padStart(2,"0")).join("");
 return hex.slice(0,8)+"-"+hex.slice(8,12)+"-5"+hex.slice(13,16)+"-a"+hex.slice(17,20)+"-"+hex.slice(20,32);
}
async function openChat(peer,p){
 if(!me||!peer||String(peer)===String(me.id)){setStatus("आप खुद को Message नहीं भेज सकते।");return;}
 activePeer=String(peer);$("activeChatName").textContent=nameOf(p);$("activeChatAvatar").src=avatarOf(p);
 const {data:existing,error:lookupError}=await db.from("messages").select("conversation_id,created_at").or("and(sender_id.eq."+me.id+",recipient_id.eq."+peer+"),and(sender_id.eq."+peer+",recipient_id.eq."+me.id+")").order("created_at",{ascending:false}).limit(1);
 if(lookupError){setStatus("Conversation जाँच नहीं हुई: "+lookupError.message);return;}
 activeConversation=existing?.[0]?.conversation_id||await stableConversationId(me.id,peer);
 document.body.classList.add("chat-open");
 $("chatBoxWindow").style.display="flex";await loadConversation();
 $("messageInput").focus();
}
window.openDirectMessage=async function(peer,name,avatar,bio){
 const p={full_name:name,username:name,avatar_url:avatar,bio};
 await openChat(peer,p);
};
async function loadConversation(){
 const {data,error}=await db.from("messages").select("id,sender_id,body,media_url,created_at").eq("conversation_id",activeConversation).order("created_at",{ascending:true}).limit(300);
 const area=$("chatMessagesArea");if(error){area.textContent="Chat load error: "+error.message;return;}
 area.innerHTML=(data||[]).map(m=>{
 const cls=m.sender_id===me.id?"outgoing":"incoming";
 const media=m.media_url?'<a href="'+esc(m.media_url)+'" target="_blank" rel="noopener">Open attachment</a>':"";
 return '<div class="message '+cls+'">'+esc(m.body||"")+(media?'<br>'+media:"")+'<small style="display:block;opacity:.65">'+esc(new Date(m.created_at).toLocaleTimeString())+'</small></div>';
 }).join("")||'<p class="muted">Conversation शुरू करें।</p>';
 area.scrollTop=area.scrollHeight;
 await db.from("messages").update({read_at:new Date().toISOString()}).eq("conversation_id",activeConversation).eq("recipient_id",me.id).is("read_at",null);
}
window.sendMessage=async function(){
 const input=$("messageInput"),body=input.value.trim();if(inboxRecording)inboxRecognition?.stop();if(!body||!activePeer||!activeConversation)return;
 const btn=document.querySelector(".send-btn");if(btn?.disabled)return;
 if(btn)btn.disabled=true;
 try{
  const {error}=await db.from("messages").insert({conversation_id:activeConversation,sender_id:me.id,recipient_id:activePeer,body});
  if(error)throw error;
  input.value="";input.dataset.voiceBase="";inboxVoiceStatus.textContent="";
  await loadConversation();await loadThreads();
  setStatus("Message भेज दिया गया।");
 }catch(error){
  console.error("Inbox send:",error);
  setStatus("Message नहीं भेजा गया। Internet या chat permission जाँचें।");
 }finally{
  if(btn)btn.disabled=false;
 }
};
window.closeChat=function(){$("chatBoxWindow").style.display="none";document.body.classList.remove("chat-open");activePeer=null;activeConversation=null;};
window.handleKeyPress=e=>{if(e.key==="Enter"){e.preventDefault();window.sendMessage();}};

let inboxRecognition=null,inboxRecording=false;
const inboxMic=$("micBtn"),inboxVoiceStatus=$("voiceInputStatus");
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
function inboxSpeechLanguage(){
 const code=(document.documentElement.lang||"hi").toLowerCase();
 const map={hi:"hi-IN",ne:"ne-NP",en:"en-US",bn:"bn-BD",ur:"ur-PK",ar:"ar-SA",es:"es-ES",fr:"fr-FR",de:"de-DE",pt:"pt-PT",it:"it-IT",ja:"ja-JP",ko:"ko-KR",zh:"zh-CN",ru:"ru-RU",tr:"tr-TR"};
 return map[code]||code;
}
if(SpeechRecognition){
 inboxRecognition=new SpeechRecognition();
 inboxRecognition.continuous=true;inboxRecognition.interimResults=true;
 inboxRecognition.lang=inboxSpeechLanguage();
 inboxRecognition.onstart=()=>{inboxRecording=true;inboxMic.textContent="■";inboxMic.setAttribute("aria-pressed","true");inboxMic.setAttribute("aria-label","Stop voice input");inboxVoiceStatus.textContent="Listening… tap the microphone again to stop.";};
 inboxRecognition.onresult=e=>{
  let finalText="",interim="";
  for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=t;else interim+=t;}
  const input=$("messageInput"),base=input.dataset.voiceBase||"";
  input.value=(base+(base&&finalText?" ":"")+finalText+(interim?" "+interim:"")).slice(0,2000);
 };
 inboxRecognition.onerror=e=>{inboxVoiceStatus.textContent=e.error==="not-allowed"?"Microphone permission denied. Allow microphone access in browser settings.":"Voice input error: "+e.error;};
 inboxRecognition.onend=()=>{inboxRecording=false;inboxMic.textContent="🎙️";inboxMic.setAttribute("aria-pressed","false");inboxMic.setAttribute("aria-label","Start voice input");const input=$("messageInput");input.dataset.voiceBase=input.value.trim();if(input.value.trim())inboxVoiceStatus.textContent="Speech converted to text. Review it, then tap Send.";};
}else{inboxMic.disabled=true;inboxVoiceStatus.textContent="Voice typing is not supported in this browser. Try Chrome.";}
window.startVoiceRecording=function(){
 if(!inboxRecognition){inboxVoiceStatus.textContent="Voice typing is not supported in this browser.";return;}
 if(inboxRecording){inboxRecognition.stop();return;}
 if(!window.isSecureContext){inboxVoiceStatus.textContent="Microphone needs a secure HTTPS page.";return;}
 inboxRecognition.lang=inboxSpeechLanguage();
 $("messageInput").dataset.voiceBase=$("messageInput").value.trim();
 try{inboxRecognition.start();}catch(e){inboxVoiceStatus.textContent="Microphone could not start. Try again in a moment.";}
};
window.sendMediaFile=function(e){setStatus("Media upload is not connected yet. Please send text until secure Storage upload is added.");e.target.value="";};
window.showProfileFromChat=function(){if(activePeer)location.href="creator.html?user="+encodeURIComponent(activePeer);};
function startInboxBoot(){
 boot().catch(e=>{
  console.error("Inbox boot:",e);
  setStatus("Inbox लोड नहीं हुआ: "+(e?.message||"Unknown error"));
  $("tabMessages").textContent="Messages अभी लोड नहीं हो सके। Refresh करके फिर कोशिश करें।";
 });
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",startInboxBoot,{once:true});
else startInboxBoot();
})();
</script>
