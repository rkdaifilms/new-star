services:
  new-star-model:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: new-star-private-model
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      LLAMA_ARG_MODEL: /models/${NEW_STAR_MODEL_FILE:?Set NEW_STAR_MODEL_FILE in .env}
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: "8080"
      LLAMA_ARG_N_GPU_LAYERS: ${NEW_STAR_GPU_LAYERS:-999}
      LLAMA_ARG_CTX_SIZE: ${NEW_STAR_CONTEXT_SIZE:-8192}
      LLAMA_ARG_PARALLEL: ${NEW_STAR_PARALLEL:-2}
      LLAMA_ARG_API_KEY: ${NEW_STAR_MODEL_API_KEY:?Set a long random API key in .env}
      LLAMA_ARG_NO_WEBUI: "true"
    volumes:
      - ./models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
