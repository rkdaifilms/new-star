
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#fe2c55">
<title>New Star - Login & Signup</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
 min-height:100vh;background:#000;color:#fff;
 display:flex;align-items:center;justify-content:center;
 padding:20px 20px 85px;
}
.auth-container{
 width:100%;max-width:380px;background:#121214;
 padding:28px;border-radius:16px;border:1px solid #292929;
 box-shadow:0 8px 24px #000;
}
.auth-container h2{
 text-align:center;margin-bottom:22px;color:#fe2c55;font-size:24px
}
.input-group{margin-bottom:16px}
.input-group label{
 display:block;font-size:12px;color:#aaa;margin-bottom:7px
}
.input-group input{
 width:100%;padding:13px;background:#1e1e24;
 border:1px solid #383838;color:#fff;border-radius:8px;
 font-size:15px;outline:none
}
.input-group input:focus{border-color:#fe2c55}
.auth-btn{
 width:100%;background:#fe2c55;color:#fff;border:0;
 padding:13px;border-radius:8px;font-weight:bold;
 font-size:15px;cursor:pointer;margin-top:8px
}
.auth-btn:disabled{opacity:.55;cursor:not-allowed}
.toggle-text{
 text-align:center;margin-top:18px;font-size:13px;color:#aaa;
 cursor:pointer
}
.toggle-text span{color:#25f4ee;font-weight:bold}
#authMessage{
 display:none;margin-top:15px;padding:11px;border-radius:8px;
 font-size:13px;line-height:1.5;overflow-wrap:anywhere
}
#authMessage.error{display:block;background:#451b22;color:#ffb5c0}
#authMessage.success{display:block;background:#12352b;color:#a8ffd3}
.bottom-nav{
 position:fixed;bottom:0;left:0;width:100%;height:62px;
 background:#111;border-top:1px solid #292929;
 display:flex;justify-content:space-around;align-items:center;
 z-index:100
}
.nav-item{
 display:flex;flex-direction:column;align-items:center;
 color:#888;text-decoration:none;font-size:11px;gap:2px
}
.nav-item.active{color:#fff;font-weight:bold}
.nav-item .icon{font-size:20px}
.nav-center-btn{
 width:43px;height:32px;
 background:linear-gradient(135deg,#25f4ee,#fe2c55);
 border-radius:8px;display:flex;justify-content:center;
 align-items:center;font-size:22px;color:#fff;font-weight:bold
}
</style>
</head>

<body>

<div class="auth-container">
 <h2 id="formTitle">🌟 New Star Login</h2>

 <div class="input-group">
  <label for="userEmail">Email Address</label>
  <input type="email" id="userEmail"
   placeholder="Enter your email" autocomplete="email" required>
 </div>

 <div class="input-group">
  <label for="userPassword">Password</label>
  <input type="password" id="userPassword"
   placeholder="Enter password" autocomplete="current-password"
   minlength="6" required>
 </div>

 <button class="auth-btn" id="actionBtn" type="button">
  Login
 </button>

 <div class="toggle-text" id="toggleMode">
  Don't have an account? <span id="toggleLinkText">Sign Up</span>
 </div>

 <div id="authMessage" role="status" aria-live="polite"></div>
</div>

<!-- Auth page navigation -->
<div class="bottom-nav">
 <a href="index.html" class="nav-item">
  <span class="icon">🏠</span><span>Home</span>
 </a>
 <a href="inbox.html" class="nav-item">
  <span class="icon">💬</span><span>Inbox</span>
 </a>
 <a href="camera.html" class="nav-item">
  <span class="nav-center-btn">+</span>
 </a>
 <a href="wallet.html" class="nav-item">
  <span class="icon">💰</span><span>Wallet</span>
 </a>
 <a href="profile.html" class="nav-item">
  <span class="icon">👤</span><span>Profile</span>
 </a>
</div>

<script src="./navbar.js"></script>

<script>
"use strict";

let isSignupMode = false;
let authBusy = false;

const authClient =
 window.supabaseClient || window.cloudClient || null;

const $ = id => document.getElementById(id);

function showAuthMessage(message, type) {
 const box = $("authMessage");
 box.textContent = message;
 box.className = type;
}

function getSafeNextPage() {
 const params = new URLSearchParams(location.search);
 const next = params.get("next");

 const allowedPages = [
  "index.html",
  "profile.html",
  "camera.html",
  "upload.html",
  "wallet.html",
  "inbox.html",
  "settings.html",
  "monetization.html",
  "live.html",
  "gaming.html",
  "campaign.html"
 ];

 if (!next) return "index.html";

 const clean = next.split("?")[0].split("#")[0];

 if (!allowedPages.includes(clean)) return "index.html";

 return next;
}

function goAfterLogin() {
 location.replace(getSafeNextPage());
}

async function checkExistingSession() {
 if (!authClient) {
  showAuthMessage(
   "Supabase client नहीं मिला। supabase-config.js और SDK लोडिंग जाँचें।",
   "error"
  );
  return;
 }

 try {
  const { data, error } = await authClient.auth.getSession();

  if (error) throw error;

  if (data.session) {
   goAfterLogin();
  }
 } catch (error) {
  console.error("Session check:", error);
  showAuthMessage(error.message, "error");
 }
}

function toggleAuthMode() {
 isSignupMode = !isSignupMode;

 $("formTitle").textContent = isSignupMode
  ? "🌟 New Star Sign Up"
  : "🌟 New Star Login";

 $("actionBtn").textContent = isSignupMode
  ? "Create Account"
  : "Login";

 $("toggleLinkText").textContent = isSignupMode
  ? "Login"
  : "Sign Up";

 $("toggleMode").firstChild.textContent = isSignupMode
  ? "Already have an account? "
  : "Don't have an account? ";

 $("userPassword").autocomplete =
  isSignupMode ? "new-password" : "current-password";

 $("authMessage").className = "";
 $("authMessage").textContent = "";
}

async function handleAuthAction() {
 if (authBusy) return;

 if (!authClient) {
  showAuthMessage("Supabase कनेक्शन उपलब्ध नहीं है।", "error");
  return;
 }

 const email = $("userEmail").value.trim();
 const password = $("userPassword").value;

 if (!email || !password) {
  showAuthMessage("Email और Password दोनों भरें।", "error");
  return;
 }

 if (password.length < 6) {
  showAuthMessage("Password कम से कम 6 अक्षर का होना चाहिए।", "error");
  return;
 }

 authBusy = true;
 $("actionBtn").disabled = true;
 $("actionBtn").textContent = "Please wait...";

 try {
  if (isSignupMode) {
   const { data, error } = await authClient.auth.signUp({
    email,
    password,
    options: {
     emailRedirectTo: location.origin + "/index.html"
    }
   });

   if (error) throw error;

   if (data.session) {
    showAuthMessage("Account बन गया! Login सफल।", "success");
    setTimeout(goAfterLogin, 700);
   } else {
    showAuthMessage(
     "Account बन गया। अपने Email में Confirmation Link खोलें, फिर Login करें।",
     "success"
    );
    isSignupMode = false;
    $("formTitle").textContent = "🌟 New Star Login";
    $("actionBtn").textContent = "Login";
    $("toggleLinkText").textContent = "Sign Up";
    $("toggleMode").firstChild.textContent =
     "Don't have an account? ";
   }
  } else {
   const { data, error } =
    await authClient.auth.signInWithPassword({
     email,
     password
    });

   if (error) throw error;

   if (!data.session) {
    throw new Error("Login session नहीं बना। दोबारा कोशिश करें।");
   }

   showAuthMessage("Login सफल! आपका पेज खुल रहा है...", "success");
   setTimeout(goAfterLogin, 400);
  }

 } catch (error) {
  console.error("Authentication error:", error);
  showAuthMessage("Login/Signup Error: " + error.message, "error");
 } finally {
  authBusy = false;
  $("actionBtn").disabled = false;
  $("actionBtn").textContent =
   isSignupMode ? "Create Account" : "Login";
 }
}

$("actionBtn").addEventListener("click", handleAuthAction);
$("toggleMode").addEventListener("click", toggleAuthMode);

$("userPassword").addEventListener("keydown", event => {
 if (event.key === "Enter") handleAuthAction();
});

checkExistingSession();
</script>

</body>
</html>
