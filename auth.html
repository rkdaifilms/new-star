
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#fe2c55">
<title>New Star - Login & Signup</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
 min-height:100vh;background:#000;color:#fff;
 display:flex;align-items:center;justify-content:center;
 padding:20px 20px 90px;
}
.auth-container{
 width:100%;max-width:390px;background:#121214;
 padding:28px;border-radius:18px;border:1px solid #292929;
 box-shadow:0 8px 24px #000;
}
.logo{text-align:center;font-size:42px;margin-bottom:8px}
.auth-container h2{
 text-align:center;margin-bottom:8px;color:#fe2c55;font-size:25px
}
.subtitle{
 text-align:center;color:#999;font-size:13px;margin-bottom:24px
}
.input-group{margin-bottom:16px}
.input-group label{
 display:block;font-size:13px;color:#bbb;margin-bottom:7px
}
.input-group input{
 width:100%;padding:14px;background:#1e1e24;
 border:1px solid #383838;color:#fff;border-radius:9px;
 font-size:15px;outline:none
}
.input-group input:focus{border-color:#fe2c55}
.auth-btn{
 width:100%;background:#fe2c55;color:#fff;border:0;
 padding:14px;border-radius:9px;font-weight:bold;
 font-size:15px;cursor:pointer;margin-top:8px
}
.auth-btn:disabled{opacity:.55;cursor:not-allowed}
.toggle-text{
 text-align:center;margin-top:20px;font-size:13px;color:#aaa;
 cursor:pointer
}
.toggle-text span{color:#25f4ee;font-weight:bold}
#authMessage{
 display:none;margin-top:16px;padding:12px;border-radius:8px;
 font-size:13px;line-height:1.5;overflow-wrap:anywhere
}
#authMessage.error{display:block;background:#451b22;color:#ffb5c0}
#authMessage.success{display:block;background:#12352b;color:#a8ffd3}
.bottom-nav{
 position:fixed;bottom:0;left:0;width:100%;
 min-height:64px;background:#111;border-top:1px solid #292929;
 display:flex;justify-content:space-around;align-items:center;
 z-index:100;padding-bottom:env(safe-area-inset-bottom)
}
.nav-item{
 display:flex;flex-direction:column;align-items:center;
 justify-content:center;color:#888;text-decoration:none;
 font-size:11px;gap:3px;min-width:48px;min-height:54px
}
.nav-item.active{color:#fff;font-weight:bold}
.nav-item .icon{font-size:21px}
.nav-center-btn{
 width:44px;height:32px;
 background:linear-gradient(135deg,#25f4ee,#fe2c55);
 border-radius:8px;display:flex;justify-content:center;
 align-items:center;font-size:24px;color:#fff;font-weight:bold
}
</style>
</head>

<body>

<main class="auth-container">
 <div class="logo">🌟</div>
 <h2 id="formTitle">New Star Login</h2>
 <p class="subtitle">Welcome to New Star Creator Hub</p>

 <div class="input-group">
  <label for="userEmail">Email Address</label>
  <input type="email" id="userEmail"
   placeholder="Enter your email"
   autocomplete="email" required>
 </div>

 <div class="input-group">
  <label for="userPassword">Password</label>
  <input type="password" id="userPassword"
   placeholder="Enter password"
   autocomplete="current-password"
   minlength="6" required>
 </div>

 <button class="auth-btn" id="actionBtn" type="button">
  Login
 </button>

 <div class="toggle-text" id="toggleMode">
  Don't have an account? <span id="toggleLinkText">Sign Up</span>
 </div>

 <div id="authMessage" role="status" aria-live="polite"></div>
</main>

<!-- Auth page navigation: navbar.js इसे नहीं हटाएगा -->
<nav class="bottom-nav">
 <a href="index.html" class="nav-item">
  <span class="icon">🏠</span><span>Home</span>
 </a>
 <a href="wallet.html" class="nav-item">
  <span class="icon">💰</span><span>Wallet</span>
 </a>
 <a href="camera.html" class="nav-item">
  <span class="nav-center-btn">+</span>
 </a>
 <a href="inbox.html" class="nav-item">
  <span class="icon">💬</span><span>Inbox</span>
 </a>
 <a href="profile.html" class="nav-item">
  <span class="icon">👤</span><span>Profile</span>
 </a>
</nav>

<script src="./navbar.js"></script>

<script>
"use strict";

let isSignupMode = false;
let authBusy = false;

const $ = id => document.getElementById(id);

function getAuthClient(){
 if(window.supabaseClient) return window.supabaseClient;
 if(window.cloudClient) return window.cloudClient;

 // navbar.js ने अभी client न बनाया हो तो यहाँ बनाओ।
 if(window.supabase && typeof window.supabase.createClient === "function"){
  const url = window.NS_SUPABASE_URL ||
   "https://uzsusgoetrkujmofxcmb.supabase.co";
  const key = window.NS_SUPABASE_ANON_KEY ||
   "sb_publishable_Zz2hljevMsXBcK8c33UvFw_wuc2itVr";

  window.supabaseClient = window.supabase.createClient(url,key,{
   auth:{
    persistSession:true,
    autoRefreshToken:true,
    detectSessionInUrl:true
   },
   realtime:{timeout:30000}
  });
  window.cloudClient = window.supabaseClient;
  return window.supabaseClient;
 }

 return null;
}

function showMessage(message,type){
 const box=$("authMessage");
 box.textContent=message;
 box.className=type;
}

function getSafeNextPage(){
 const params=new URLSearchParams(location.search);
 let next=params.get("next") || "index.html";

 // केवल इसी साइट के ज्ञात पेज स्वीकार करें।
 try{
  const parsed=new URL(next,location.origin);
  if(parsed.origin!==location.origin) return "index.html";

  const page=parsed.pathname.split("/").pop();
  const allowed=[
   "index.html","profile.html","camera.html","upload.html",
   "wallet.html","inbox.html","settings.html",
   "monetization.html","live.html","gaming.html","campaign.html"
  ];

  if(!allowed.includes(page)) return "index.html";

  return page+parsed.search+parsed.hash;
 }catch(e){
  return "index.html";
 }
}

function goAfterLogin(){
 location.replace(getSafeNextPage());
}

async function checkExistingSession(){
 const client=getAuthClient();

 if(!client){
  showMessage(
   "Supabase client नहीं मिला। SDK और supabase-config.js की लोडिंग जाँचें।",
   "error"
  );
  return;
 }

 try{
  const {data,error}=await client.auth.getSession();
  if(error) throw error;

  if(data && data.session){
   goAfterLogin();
  }
 }catch(error){
  console.error("Session check:",error);
  showMessage(error.message || "Session जाँचने में समस्या हुई।","error");
 }
}

function toggleAuthMode(){
 isSignupMode=!isSignupMode;

 $("formTitle").textContent=isSignupMode
  ?"New Star Sign Up":"New Star Login";

 $("actionBtn").textContent=isSignupMode
  ?"Create Account":"Login";

 $("toggleLinkText").textContent=isSignupMode
  ?"Login":"Sign Up";

 $("toggleMode").firstChild.textContent=isSignupMode
  ?"Already have an account? "
  :"Don't have an account? ";

 $("userPassword").autocomplete=isSignupMode
  ?"new-password":"current-password";

 $("authMessage").className="";
 $("authMessage").textContent="";
}

async function handleAuthAction(){
 if(authBusy) return;

 const client=getAuthClient();

 if(!client){
  showMessage("Supabase कनेक्शन उपलब्ध नहीं है।","error");
  return;
 }

 const email=$("userEmail").value.trim();
 const password=$("userPassword").value;

 if(!email || !password){
  showMessage("Email और Password दोनों भरें।","error");
  return;
 }

 if(password.length<6){
  showMessage("Password कम से कम 6 अक्षर का होना चाहिए।","error");
  return;
 }

 authBusy=true;
 $("actionBtn").disabled=true;
 $("actionBtn").textContent="Please wait...";

 try{
  if(isSignupMode){
   const {data,error}=await client.auth.signUp({
    email,
    password,
    options:{
     emailRedirectTo:location.origin+"/index.html"
    }
   });

   if(error) throw error;

   if(data.session){
    showMessage("Account बन गया! आपका पेज खुल रहा है।","success");
    setTimeout(goAfterLogin,700);
   }else{
    showMessage(
     "Account बन गया। अपने Email में Confirmation Link खोलें, फिर Login करें।",
     "success"
    );
    isSignupMode=false;
    $("formTitle").textContent="New Star Login";
    $("actionBtn").textContent="Login";
    $("toggleLinkText").textContent="Sign Up";
    $("toggleMode").firstChild.textContent="Don't have an account? ";
    $("userPassword").autocomplete="current-password";
   }
  }else{
   const {data,error}=await client.auth.signInWithPassword({
    email,
    password
   });

   if(error) throw error;
   if(!data.session) throw new Error("Login session नहीं बना।");

   showMessage("Login सफल! आपका पेज खुल रहा है...","success");
   setTimeout(goAfterLogin,400);
  }
 }catch(error){
  console.error("Authentication error:",error);
  showMessage("Login/Signup Error: "+(error.message || "कृपया दोबारा कोशिश करें।"),"error");
 }finally{
  authBusy=false;
  $("actionBtn").disabled=false;
  $("actionBtn").textContent=isSignupMode?"Create Account":"Login";
 }
}

$("actionBtn").addEventListener("click",handleAuthAction);
$("toggleMode").addEventListener("click",toggleAuthMode);

$("userPassword").addEventListener("keydown",event=>{
 if(event.key==="Enter") handleAuthAction();
});

checkExistingSession();
</script>

</body>
</html>
