<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>New Star Creator Hub - Camera Studio</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101014;color:#fff;font-family:Arial,sans-serif;padding-bottom:70px}
header{background:#191920;padding:15px;display:flex;justify-content:space-between;align-items:center}
main{max-width:760px;margin:auto;padding:15px}
.card{background:#1c1c24;border:1px solid #383844;border-radius:15px;padding:16px;margin:14px 0}
input,textarea,button{width:100%;padding:13px;margin:6px 0;border-radius:10px;font:inherit}
input,textarea{background:#111118;color:white;border:1px solid #444}
button{border:0;background:#ff3158;color:white;font-weight:bold;cursor:pointer}
button.secondary{background:#343440}
button:disabled{opacity:.5}
video{width:100%;max-height:65vh;background:#000;border-radius:12px}
.row{display:flex;gap:8px}.row>*{flex:1}
.muted{color:#aaa;font-size:13px}
#app{display:none}
#auth{max-width:480px;margin:6vh auto;padding:15px}
.status{white-space:pre-wrap;color:#ffd36a;font-size:13px}
</style>
</head>
<body>
<header>
<b>⭐ New Star Creator Hub</b>
<button class="secondary" style="width:auto" onclick="location.href='profile.html'">👤 My Profile</button>
</header>

<!-- 🔐 LOGIN & AUTH SECTION -->
<section id="auth" class="card">
<h2>अपने अकाउंट में Login करें</h2>
<button onclick="googleLogin()">🌐 Continue with Google</button>
<hr>
<h3>मोबाइल OTP Login</h3>
<input id="phone" type="tel" placeholder="+97798XXXXXXXX">
<button class="secondary" onclick="sendOTP()">Send OTP</button>
<input id="otp" inputmode="numeric" placeholder="SMS OTP डालें">
<button onclick="verifyOTP()">Verify OTP और Login</button>
<hr>
<h3>Email Signup / Login</h3>
<input id="name" placeholder="पूरा नाम (Signup के लिए)">
<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password (कम से कम 6 अक्षर)">
<div class="row">
<button onclick="emailLogin()">Login</button>
<button class="secondary" onclick="emailSignup()">Sign Up</button>
</div>
<p id="authStatus" class="status"></p>
</section>

<!-- 🎥 LIVE CAMERA & UPLOAD STUDIO -->
<main id="app">
<div class="card">
<h2>🎥 New Star Live Camera Studio</h2>
<p id="userInfo" class="muted"></p>
<div class="row">
<button onclick="startCamera()">📷 Open Camera</button>
<button class="secondary" onclick="stopCamera()">⏹️ Stop Camera</button>
</div>
<video id="preview" controls playsinline></video>
<div class="row">
<button onclick="startRecording()">🔴 Start Recording</button>
<button class="secondary" onclick="stopRecording()">⏹️ Stop Recording</button>
</div>
<label class="muted" style="display:block; margin-top:10px;">📁 Gallery से वीडियो चुनें:</label>
<input id="gallery" type="file" accept="video/*">
<p id="fileInfo" class="muted">कोई वीडियो नहीं चुना गया।</p>
</div>

<div class="card">
<h2>📝 Video Upload to Cloud</h2>
<input id="title" maxlength="120" placeholder="वीडियो का Title या Caption">
<textarea id="caption" rows="3" placeholder="वीडियो Description लिखें..."></textarea>
<button id="uploadButton" onclick="uploadVideo()">🚀 Upload Video</button>
<p id="uploadStatus" class="status"></p>
</div>

<div class="card">
<button class="secondary" onclick="logout()">🚪 Logout</button>
</div>
</main>

<script>
const $ = id => document.getElementById(id);
const db = (typeof supabaseClient !== "undefined")
 ? supabaseClient
 : window.supabaseClient;

if(!db){
 $("authStatus").textContent="Supabase client नहीं मिला। Config जांचें।";
 throw new Error("Supabase client missing");
}

let currentUser=null;
let cameraStream=null;
let recorder=null;
let chunks=[];
let selectedVideo=null;
let previewURL=null;

function authMessage(t){$("authStatus").textContent=t;}
function uploadMessage(t){$("uploadStatus").textContent=t;}

function showLogin(){
 $("auth").style.display="block";
 $("app").style.display="none";
}
function showCameraApp(user){
 currentUser=user;
 $("auth").style.display="none";
 $("app").style.display="block";
 $("userInfo").textContent="Logged in: "+(user.email||user.phone||user.id);
}

async function googleLogin(){
 authMessage("Google अकाउंट चुनने के लिए खोला जा रहा है...");
 const {error}=await db.auth.signInWithOAuth({
  provider:"google",
  options:{
   redirectTo:location.origin+location.pathname,
   queryParams:{prompt:"select_account"}
  }
 });
 if(error)authMessage("Google Login Error: "+error.message);
}

async function sendOTP(){
 const phone=$("phone").value.trim();
 if(!/^\+[1-9]\d{7,14}$/.test(phone)){
  authMessage("Country code सहित नंबर लिखें। उदाहरण: +97798XXXXXXXX");
  return;
 }
 authMessage("SMS OTP भेजा जा रहा है...");
 const {error}=await db.auth.signInWithOtp({
  phone,
  options:{shouldCreateUser:true}
 });
 if(error)authMessage("OTP Error: "+error.message);
 else authMessage("OTP भेजने का अनुरोध सफल। SMS Inbox चेक करें।");
}

async function verifyOTP(){
 const phone=$("phone").value.trim();
 const token=$("otp").value.trim();
 if(!phone||!token){authMessage("फोन नंबर और OTP दोनों भरें।");return;}
 authMessage("OTP Verify हो रहा है...");
 const {data,error}=await db.auth.verifyOtp({
  phone,token,type:"sms"
 });
 if(error)authMessage("Verification Error: "+error.message);
 else if(data.user)showCameraApp(data.user);
}

async function emailSignup(){
 const email=$("email").value.trim();
 const password=$("password").value;
 const name=$("name").value.trim();
 if(!email||password.length<6){
  authMessage("सही Email और कम से कम 6 अक्षर का Password भरें।");return;
 }
 authMessage("अकाउंट बनाया जा रहा है...");
 const {data,error}=await db.auth.signUp({
  email,password,
  options:{data:{full_name:name}}
 });
 if(error)authMessage("Signup Error: "+error.message);
 else if(data.session&&data.user)showCameraApp(data.user);
 else authMessage("अकाउंट बन गया। अब Login करें।");
}

async function emailLogin(){
 const email=$("email").value.trim();
 const password=$("password").value;
 if(!email||!password){authMessage("Email और Password भरें।");return;}
 authMessage("Login हो रहा है...");
 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error)authMessage("Login Error: "+error.message);
 else showCameraApp(data.user);
}

async function logout(){
 stopCamera();
 await db.auth.signOut();
 currentUser=null;
 showLogin();
}

async function startCamera(){
 try{
  stopCamera();
  cameraStream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:{ideal:"environment"}},
   audio:true
  });
  $("preview").srcObject=cameraStream;
  $("preview").muted=true;
  uploadMessage("📷 कैमरा चालू है। अब Recording शुरू कर सकते हैं।");
 }catch(e){
  uploadMessage("Camera Error: "+e.message+". कृपया सुनिश्चित करें कि यह HTTPS पर खुला है और कैमरे की अनुमति दी गई है।");
 }
}

function stopCamera(){
 if(cameraStream){
  cameraStream.getTracks().forEach(t=>t.stop());
  cameraStream=null;
 }
 if($("preview").srcObject)$("preview").srcObject=null;
}

function startRecording(){
 if(!cameraStream){uploadMessage("⚠️ पहले 'Open Camera' बटन दबाएँ।");return;}
 if(!window.MediaRecorder){uploadMessage("⚠️ इस Browser में Recording समर्थित नहीं है।");return;}
 chunks=[];
 try{
  const mime=MediaRecorder.isTypeSupported("video/webm;codecs=vp8,opus")
   ?"video/webm;codecs=vp8,opus":"video/webm";
  recorder=new MediaRecorder(cameraStream,{mimeType:mime});
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  recorder.onstop=()=>{
   selectedVideo=new File(chunks,"new-star-"+Date.now()+".webm",{type:"video/webm"});
   showSelectedVideo(selectedVideo);
   stopCamera();
   uploadMessage("✅ Recording तैयार है। अब Title लिखकर Upload करें।");
  };
  recorder.start();
  uploadMessage("🔴 Recording शुरू हो गई है...");
 }catch(e){uploadMessage("Recording Error: "+e.message);}
}

function stopRecording(){
 if(recorder&&recorder.state!=="inactive")recorder.stop();
}

function showSelectedVideo(file){
 if(previewURL)URL.revokeObjectURL(previewURL);
 previewURL=URL.createObjectURL(file);
 $("preview").srcObject=null;
 $("preview").src=previewURL;
 $("preview").muted=false;
 $("fileInfo").textContent=file.name+" • "+(file.size/1024/1024).toFixed(2)+" MB";
}

$("gallery").addEventListener("change",e=>{
 const file=e.target.files[0];
 if(!file)return;
 if(!file.type.startsWith("video/")){
  uploadMessage("⚠️ कृपया केवल वीडियो फाइल चुनें।");return;
 }
 selectedVideo=file;
 stopCamera();
 showSelectedVideo(file);
 uploadMessage("📁 Gallery वीडियो चयन सफल। अब Upload करें।");
});

async function uploadVideo(){
 if(!currentUser){uploadMessage("⚠️ कृपया पहले Login करें।");return;}
 if(!selectedVideo){uploadMessage("⚠️ पहले वीडियो रिकॉर्ड करें या Gallery से चुनें।");return;}
 const title=$("title").value.trim();
 const caption=$("caption").value.trim();
 if(!title){uploadMessage("⚠️ वीडियो का Title लिखना जरूरी है।");return;}

 const button=$("uploadButton");
 button.disabled=true;
 button.textContent="⏳ Uploading to Cloud...";
 let path=null;

 try{
  uploadMessage("⏳ वीडियो Storage में Upload हो रहा है...");
  const ext=(selectedVideo.name.split(".").pop()||"mp4").toLowerCase().replace(/[^a-z0-9]/g,"")||"mp4";
  path=currentUser.id+"/"+Date.now()+"-"+Math.random().toString(36).slice(2)+"."+ext;

  const {data:stored,error:storageError}=await db.storage
   .from("videos")
   .upload(path,selectedVideo,{
    upsert:false,
    contentType:selectedVideo.type||"video/mp4",
    cacheControl:"3600"
   });
  if(storageError)throw storageError;

  const {data:urlData}=db.storage.from("videos").getPublicUrl(stored.path);
  const videoUrl=urlData.publicUrl;

  const {error:dbError}=await db.from("videos").insert({
   user_id:currentUser.id,
   video_url:videoUrl,
   caption:title+(caption?"\n"+caption:"")
  });
  if(dbError)throw dbError;

  uploadMessage("🎉 वीडियो सफलतापूर्वक अपलोड हो गया! अब आप Profile पेज पर जाकर देख सकते हैं।");
  $("title").value="";
  $("caption").value="";
  $("gallery").value="";
  $("fileInfo").textContent="Upload पूरा हुआ।";
  selectedVideo=null;
 }catch(e){
  if(path)await db.storage.from("videos").remove([path]).catch(()=>{});
  uploadMessage("❌ Upload Error: "+(e.message||String(e)));
 }finally{
  button.disabled=false;
  button.textContent="🚀 Upload Video";
 }
}

db.auth.onAuthStateChange((event,session)=>{
 if(session&&session.user)showCameraApp(session.user);
 else if(event==="SIGNED_OUT")showLogin();
});

db.auth.getSession().then(({data,error})=>{
 if(error)authMessage(error.message);
 else if(data.session)showCameraApp(data.session.user);
 else showLogin();
});
</script>
</body>
</html>
