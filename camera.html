<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator & LIVE Studio - Call Priyance</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0b0b0b; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 15px; }
        
        .top-bar { width: 100%; max-width: 450px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .top-close { font-size: 22px; text-decoration: none; color: #fff; background: #222; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        
        /* Side-by-Side Mode Switching Tabs */
        .mode-tabs { display: flex; gap: 8px; overflow-x: auto; width: 100%; max-width: 450px; padding-bottom: 5px; scrollbar-width: none; }
        .mode-tabs::-webkit-scrollbar { display: none; }
        .tab-btn { background: #1a1a1a; color: #aaa; border: 1px solid #333; padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; white-space: nowrap; transition: 0.2s; }
        .tab-btn.active { background: #fe2c55; color: #fff; border-color: #fe2c55; }

        /* Studio Content Container */
        .studio-container { width: 100%; max-width: 450px; margin-top: 15px; background: #141414; border: 1px solid #333; border-radius: 15px; padding: 20px; text-align: left; }
        
        .section-title { font-size: 18px; color: #25f4ee; margin-bottom: 5px; }
        .section-desc { font-size: 12px; color: #aaa; margin-bottom: 15px; }

        /* 9-10 Seats Voice Room Grid */
        .voice-seats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 15px 0; }
        .voice-seat { background: #1f1f1f; border: 1px dashed #555; height: 70px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; color: #ccc; cursor: pointer; position: relative; }
        .voice-seat.active { border: 2px solid #25f4ee; background: #102a2a; color: #25f4ee; font-weight: bold; }
        .seat-number { position: absolute; top: 2px; right: 8px; font-size: 9px; color: #ffcc00; }

        .btn { display: block; width: 100%; background: #fe2c55; color: #fff; text-align: center; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 15px; border: none; cursor: pointer; }
        .btn-live { background: linear-gradient(135deg, #fe2c55, #ff6b8b); }
        .btn-voice { background: linear-gradient(135deg, #00b4d8, #0077b6); color: #fff; }
        .btn-audio { background: linear-gradient(135deg, #7928ca, #ff0055); color: #fff; }
        .btn-game { background: linear-gradient(135deg, #00b4d8, #25f4ee); color: #000; }

        input, select { width: 100%; padding: 10px; background: #111; border: 1px solid #444; color: #fff; border-radius: 6px; margin-top: 6px; font-size: 13px; outline: none; }

        /* LIVE Active Broadcast Screen */
        #activeLiveView { display: none; width: 100%; max-width: 450px; background: #141414; border: 2px solid #fe2c55; padding: 20px; border-radius: 15px; margin-top: 15px; text-align: center; }
        .pulsing-dot { display: inline-block; width: 10px; height: 10px; background: #fe2c55; border-radius: 50%; animation: pulse 1.2s infinite; margin-right: 5px; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* Success Banner */
        .success-banner { background: #113322; border: 1px solid #25f4ee; color: #25f4ee; padding: 12px; border-radius: 8px; margin-top: 12px; font-size: 13px; font-weight: bold; display: none; text-align: center; }

        /* Bottom Navigation Bar */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: rgba(255,255,255,0.6); cursor: pointer; text-decoration: none; font-size: 11px; }
        .nav-item.active { color: #fff; }
        .upload-plus-btn { width: 42px; height: 28px; background: linear-gradient(135deg, #25f4ee, #fe2c55); border-radius: 8px; display: flex; justify-content: center; align-items: center; color: #fff; font-size: 20px; }
    </style>
</head>
<body style="padding-bottom: 80px;">
    <div class="top-bar">
        <a href="index.html" class="top-close">✕</a>
        <h3 style="font-size: 15px; color: #fff;">Call Priyance Creator Studio</h3>
        <div>🎥</div>
    </div>

    <!-- Side-by-Side Switching Tabs -->
    <div class="mode-tabs">
        <button class="tab-btn active" onclick="switchTab('video', this)">📹 Video & Voiceover</button>
        <button class="tab-btn" onclick="switchTab('live', this)">🔴 Video LIVE</button>
        <button class="tab-btn" onclick="switchTab('voice', this)">🎙️ Audio Voice Room</button>
        <button class="tab-btn" onclick="switchTab('gaming', this)">🎮 Gaming Stream</button>
    </div>

    <!-- Dynamic Content Panel -->
    <div class="studio-container" id="studioPanel">
        <!-- Content injected via JavaScript -->
    </div>

    <!-- LIVE Active Broadcast Screen -->
    <div id="activeLiveView">
        <h3 style="color: #fe2c55; margin-bottom: 10px;"><span class="pulsing-dot"></span> BROADCASTING LIVE NOW</h3>
        <p id="liveStatusText" style="font-size: 13px; color: #ccc; margin-bottom: 15px;"></p>
        
        <div id="activeLiveDynamicArea" style="margin-bottom: 15px;"></div>

        <div style="background: #1a1a1a; padding: 12px; border-radius: 8px; margin-bottom: 15px;">
            <p style="font-size: 12px; color: #25f4ee;">🪙 Real-Time Coin Gifts Counter: <b>0</b> 🪙</p>
            <p style="font-size: 11px; color: #888; margin-top: 4px;">Platform Fee: 30% | Your Earning: 70%</p>
        </div>
        <button class="btn" style="background: #333; color: #fff;" onclick="stopLiveBroadcast()">⏹️ End LIVE & Exit</button>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item"><i>🏠</i><span>Home</span></a>
        <a href="wallet.html" class="nav-item"><i>🪙</i><span>Wallet</span></a>
        <a href="camera.html" class="nav-item active"><div class="upload-plus-btn">+</div></a>
        <a href="inbox.html" class="nav-item"><i>💬</i><span>Inbox</span></a>
        <a href="profile.html" class="nav-item"><i>⭐</i><span>Profile</span></a>
    </div>

    <script>
        window.onload = function() {
            switchTab('video', document.querySelector('.tab-btn'));
        };

        function switchTab(mode, btnElement) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            document.getElementById('activeLiveView').style.display = 'none';
            let panel = document.getElementById('studioPanel');
            panel.style.display = 'block';

            if(mode === 'video') {
                panel.innerHTML = `
                    <div class="section-title">📹 Video Recording & File Manager Upload</div>
                    <div class="section-desc">Record direct from camera or select any video file (15 sec to 10+ Mins). Add voiceover & publish.</div>
                    
                    <label style="font-size:11px; color:#aaa;">Select Video from File Manager / Record:</label>
                    <input type="file" accept="video/*" style="margin-bottom:8px;">
                    
                    <label style="font-size:11px; color:#aaa; margin-top:6px; display:block;">Video Caption & Hashtags:</label>
                    <input type="text" id="vidCaption" placeholder="e.g. Amazing Dance #Viral #CallPriyance" style="margin-bottom:8px;">

                    <div style="background:#1f1f1f; padding:12px; border-radius:8px; margin-top:10px; border:1px solid #333;">
                        <p style="font-size:12px; color:#ffcc00; margin-bottom:6px;">🎙️ Microphone Voiceover / Overvoice Studio:</p>
                        <button class="btn btn-audio" style="margin-top:0;" onclick="toggleVoiceRecording(this)">🎙️ Start Recording Overvoice</button>
                        <p id="voiceStatus" style="font-size:11px; color:#aaa; margin-top:5px; display:none;">🔴 Recording microphone audio... Click again to stop.</p>
                    </div>

                    <label style="font-size:11px; color:#aaa; margin-top:10px; display:block;">Privacy Settings:</label>
                    <select style="margin-bottom:8px;">
                        <option>Public (Everyone can watch & gift)</option>
                        <option>Friends Only</option>
                        <option>Private</option>
                    </select>

                    <button class="btn btn-live" onclick="showPublishSuccess()">🚀 Publish Video Now</button>
                    <div id="pubSuccess" class="success-banner">✅ Video published successfully! Ready for distribution & 50% ad revenue share.</div>
                `;
            } else if(mode === 'live') {
                panel.innerHTML = `
                    <div class="section-title">🔴 Video LIVE Stream & PK Battle</div>
                    <div class="section-desc">Go live with multi-creators on split screen & collect real-time coin gifts (30% fee).</div>
                    <label style="font-size:11px; color:#aaa;">Live Stream Title:</label>
                    <input type="text" id="liveTitleInput" value="Night Dance & Music Party 🎉">
                    <label style="font-size:11px; color:#aaa; margin-top:8px; display:block;">Hosting Mode:</label>
                    <select id="liveModeSelect">
                        <option>Single Creator Stream</option>
                        <option>2-Way PK Battle (Split Screen)</option>
                        <option>4-Way Multi-Host Grid</option>
                    </select>
                    <button class="btn btn-live" onclick="startLiveBroadcast('Video LIVE Stream Started', 'video')">🔴 Start Video LIVE Now</button>
                `;
            } else if(mode === 'voice') {
                panel.innerHTML = `
                    <div class="section-title">🎙️ Audio Voice Party Room (10 Seats)</div>
                    <div class="section-desc">Open audio chat room, invite up to 10 friends on stage to talk & receive gifts.</div>
                    <div class="voice-seats-grid">
                        <div class="voice-seat active"><span class="seat-number">1</span>👑 Host</div>
                        <div class="voice-seat" onclick="inviteSeat(2)"><span class="seat-number">2</span>+ Add</div>
                        <div class="voice-seat" onclick="inviteSeat(3)"><span class="seat-number">3</span>+ Add</div>
                        <div class="voice-seat" onclick="inviteSeat(4)"><span class="seat-number">4</span>+ Add</div>
                        <div class="voice-seat" onclick="inviteSeat(5)"><span class="seat-number">5</span>+ Add</div>
                        <div class="voice-seat" onclick="inviteSeat(6)"><span class="seat-number">6</span>+ Add</div>
                        <div class="voice-seat" onclick="inviteSeat(7)"><span class="seat-number">7</span>+ Add</div>
                        <div class="voice-seat" onclick="inviteSeat(8)"><span class="seat-number">8</span>+ Add</div>
                        <div class="voice-seat" onclick="inviteSeat(9)"><span class="seat-number">9</span>+ Add</div>
                        <div class="voice-seat" onclick="inviteSeat(10)"><span class="seat-number">10</span>+ Add</div>
                    </div>
                    <button class="btn btn-voice" onclick="startLiveBroadcast('Audio Voice Party Room Active (10 Seats)', 'voice')">🟢 Go LIVE Audio Room</button>
                `;
            } else if(mode === 'gaming') {
                panel.innerHTML = `
                    <div class="section-title">🎮 Live Gaming Stream & App Launcher</div>
                    <div class="section-desc">Launch and broadcast mobile gameplay live (Free Fire, PUBG, Ludo) instantly.</div>
                    <label style="font-size:11px; color:#aaa;">Select Game to Launch & Stream:</label>
                    <select id="selectedGameName" style="margin-bottom:8px;">
                        <option value="Free Fire">🔥 Free Fire Mobile</option>
                        <option value="PUBG Mobile">🎯 PUBG Mobile / Battlegrounds</option>
                        <option value="Ludo King">🎲 Ludo King</option>
                        <option value="Subway Surfers">🛹 Subway Surfers</option>
                        <option value="Custom Game">🎮 Other Device Game / App</option>
                    </select>
                    <label style="font-size:11px; color:#aaa; margin-top:6px; display:block;">Stream Resolution & FPS:</label>
                    <select style="margin-bottom:8px;">
                        <option>1080p 60FPS (High Speed Gaming)</option>
                        <option>720p 30FPS Standard</option>
                    </select>
                    <button class="btn btn-game" onclick="launchGameStream()">🚀 Launch Game & Start Live Stream</button>
                `;
            }
        }

        let isRecordingVoice = false;
        function toggleVoiceRecording(btn) {
            isRecordingVoice = !isRecordingVoice;
            let status = document.getElementById('voiceStatus');
            if(isRecordingVoice) {
                btn.style.background = '#fe2c55';
                btn.innerText = '⏹️ Stop Recording Voiceover';
                status.style.display = 'block';
            } else {
                btn.style.background = '#7928ca';
                btn.innerText = '🎙️ Record Overvoice Again';
                status.innerText = '✅ Voiceover recorded successfully and attached to video!';
            }
        }

        function showPublishSuccess() {
            document.getElementById('pubSuccess').style.display = 'block';
        }

        function launchGameStream() {
            let gameName = document.getElementById('selectedGameName').value;
            document.getElementById('studioPanel').style.display = 'none';
            let liveView = document.getElementById('activeLiveView');
            liveView.style.display = 'block';
            document.getElementById('liveStatusText').innerText = '🎮 Launching ' + gameName + ' Gameplay & Broadcasting Live to Fans!';

            let dynamicArea = document.getElementById('activeLiveDynamicArea');
            dynamicArea.innerHTML = `
                <div style="background:#112233; border:1px solid #00b4d8; padding:15px; border-radius:10px; text-align:left;">
                    <h4 style="color:#25f4ee; font-size:14px; margin-bottom:5px;">⚡ Game Launcher Active: ${gameName}</h4>
                    <p style="font-size:12px; color:#fff;">Game graphics rendered at 60FPS. Screen capture & mic audio streaming live to followers.</p>
                </div>
            `;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function inviteSeat(seatNo) {
            let friendId = prompt("Enter Friend's Username or ID to invite to Seat #" + seatNo + ":");
            if(friendId) {
                alert('✅ Invitation successfully sent to ' + friendId + ' for Seat #' + seatNo + '!');
            }
        }

        function startLiveBroadcast(msg, type) {
            document.getElementById('studioPanel').style.display = 'none';
            let liveView = document.getElementById('activeLiveView');
            liveView.style.display = 'block';
            document.getElementById('liveStatusText').innerText = msg + ' — Fans can now join and send gifts!';

            let dynamicArea = document.getElementById('activeLiveDynamicArea');
            if(type === 'voice') {
                dynamicArea.innerHTML = `
                    <p style="font-size:12px; color:#ccc; margin-bottom:8px;">Active Audio Voice Room (1 Host + 9 Co-Hosts):</p>
                    <div class="voice-seats-grid" style="margin:0 auto;">
                        <div class="voice-seat active"><span class="seat-number">1</span>👑 Host</div>
                        <div class="voice-seat" onclick="inviteSeat(2)"><span class="seat-number">2</span>+ Add</div>
                        <div class="voice-seat" onclick="inviteSeat(3)"><span class="seat-number">3</span>+ Add</div>
                        <div class="voice-seat" onclick="inviteSeat(4)"><span class="seat-number">4</span>+ Add</div>
                        <div class="voice-seat" onclick="inviteSeat(5)"><span class="seat-number">5</span>+ Add</div>
                        <div class="voice-seat" onclick="inviteSeat(6)"><span class="seat-number">6</span>+ Add</div>
                        <div class="voice-seat" onclick="inviteSeat(7)"><span class="seat-number">7</span>+ Add</div>
                        <div class="voice-seat" onclick="inviteSeat(8)"><span class="seat-number">8</span>+ Add</div>
                        <div class="voice-seat" onclick="inviteSeat(9)"><span class="seat-number">9</span>+ Add</div>
                        <div class="voice-seat" onclick="inviteSeat(10)"><span class="seat-number">10</span>+ Add</div>
                    </div>
                `;
            } else {
                dynamicArea.innerHTML = `<div style="background:#1a1a1a; padding:15px; border-radius:8px; font-size:13px; color:#25f4ee;">📡 Stream Connection Active. Camera & Mic Ready for Global Broadcast.</div>`;
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function stopLiveBroadcast() {
            document.getElementById('activeLiveView').style.display = 'none';
            switchTab('video', document.querySelector('.tab-btn'));
        }
    </script>
</body>
</html>
