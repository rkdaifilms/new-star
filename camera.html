<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Creator & LIVE Studio - New Star</title>
    
    <meta name="theme-color" content="#fe2c55">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0b0b0b; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 15px; padding-bottom: 80px; }
        
        .top-bar { width: 100%; max-width: 450px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .top-close { font-size: 20px; text-decoration: none; color: #fff; background: #222; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid #444; }
        
        .mode-tabs { display: flex; gap: 8px; overflow-x: auto; width: 100%; max-width: 450px; padding-bottom: 5px; scrollbar-width: none; }
        .mode-tabs::-webkit-scrollbar { display: none; }
        .tab-btn { background: #1a1a1a; color: #aaa; border: 1px solid #333; padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; white-space: nowrap; transition: 0.2s; }
        .tab-btn.active { background: #fe2c55; color: #fff; border-color: #fe2c55; }

        .studio-box { width: 100%; max-width: 450px; margin-top: 20px; background: #141414; border: 1px solid #333; border-radius: 20px; padding: 25px 20px; text-align: left; position: relative; }
        .section-title { font-size: 17px; color: #25f4ee; margin-bottom: 4px; font-weight: bold; }
        .section-desc { font-size: 12px; color: #aaa; margin-bottom: 15px; line-height: 1.4; }

        .btn { display: block; width: 100%; background: #fe2c55; color: #fff; text-align: center; padding: 12px; border-radius: 10px; text-decoration: none; font-weight: bold; margin-top: 15px; border: none; cursor: pointer; }
        .btn-live { background: linear-gradient(135deg, #fe2c55, #ff6b8b); }
        .btn-voice { background: linear-gradient(135deg, #00b4d8, #0077b6); color: #fff; }
        .btn-game { background: linear-gradient(135deg, #00b4d8, #25f4ee); color: #000; }

        input, select { width: 100%; padding: 11px; background: #111; border: 1px solid #444; color: #fff; border-radius: 10px; margin-top: 6px; font-size: 13px; outline: none; }
        .big-upload-icon { width: 90px; height: 90px; background: #1f1f1f; border: 2px dashed #fe2c55; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 38px; margin: 10px auto 15px auto; cursor: pointer; }

        /* LIVE BROADCAST VIEW WITH REAL CAMERA */
        #activeLiveView { display: none; width: 100%; max-width: 450px; background: #111; border: 2px solid #fe2c55; padding: 15px; border-radius: 16px; margin-top: 15px; text-align: center; position: relative; }
        .pulsing-dot { display: inline-block; width: 8px; height: 8px; background: #fe2c55; border-radius: 50%; animation: pulse 1.2s infinite; margin-right: 5px; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* Real Camera Feed inside Live Room */
        #liveCameraFeed { width: 100%; height: 260px; background: #000; border-radius: 12px; object-fit: cover; margin-bottom: 10px; border: 1px solid #333; }

        .live-side-actions { position: absolute; right: 12px; bottom: 130px; display: flex; flex-direction: column; gap: 12px; z-index: 10; }
        .live-action-icon { width: 42px; height: 42px; background: rgba(0,0,0,0.6); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 18px; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); color: #fff; }
        .live-gift-btn { background: linear-gradient(135deg, #fe2c55, #ffcc00); border: none; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: rgba(255,255,255,0.6); cursor: pointer; text-decoration: none; font-size: 11px; }
        .nav-item.active { color: #fff; }
        .upload-plus-btn { width: 42px; height: 28px; background: linear-gradient(135deg, #25f4ee, #fe2c55); border-radius: 8px; display: flex; justify-content: center; align-items: center; color: #fff; font-size: 20px; }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="index.html" class="top-close">←</a>
        <h3 style="font-size:15px; color:#fe2c55;">Creator Studio</h3>
        <a href="camera.html" style="font-size: 16px; text-decoration: none; color: #fff; background: #222; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid #444;">➕</a>
    </div>

    <!-- Mode Tabs -->
    <div class="mode-tabs">
        <button class="tab-btn active" onclick="switchTab('video', this)">📹 Video Upload</button>
        <button class="tab-btn" onclick="switchTab('live', this)">🔴 Video LIVE</button>
        <button class="tab-btn" onclick="switchTab('gaming', this)">🎮 Gaming Stream</button>
    </div>

    <div id="studioPanel" style="width:100%; max-width:450px; margin-top:15px;"></div>

    <!-- ACTIVE LIVE BROADCAST ROOM WITH REAL CAMERA -->
    <div id="activeLiveView">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <span style="background:rgba(254,44,85,0.2); border:1px solid #fe2c55; padding:3px 10px; border-radius:12px; font-size:11px; font-weight:bold; color:#fe2c55;"><span class="pulsing-dot"></span> LIVE ROOM ACTIVE</span>
            <span style="font-size:12px; color:#ffcc00;">🪙 Coins: <b id="userWalletCoins">500</b></span>
        </div>

        <p id="liveStatusText" style="font-size: 12px; color: #ccc; margin-bottom: 6px;"></p>
        
        <!-- Real Camera Element for Face-to-Face Live -->
        <video id="liveCameraFeed" autoplay playsinline muted></video>

        <div class="live-side-actions">
            <div class="live-action-icon" onclick="alert('❤️ Liked live room!')">❤️</div>
            <div class="live-action-icon live-gift-btn" onclick="alert('🎁 Open Gifts')">🎁</div>
        </div>

        <button class="btn" style="background: #333; color: #fff; margin-top:10px;" onclick="stopLiveBroadcast()">⏹️ End / Exit LIVE Room</button>
    </div>

    <div class="bottom-nav">
        <a href="index.html" class="nav-item"><i>🏠</i><span>Home</span></a>
        <a href="wallet.html" class="nav-item"><i>🪙</i><span>Wallet</span></a>
        <a href="camera.html" class="nav-item active"><div class="upload-plus-btn">+</div></a>
        <a href="inbox.html" class="nav-item"><i>💬</i><span>Inbox</span></a>
        <a href="profile.html" class="nav-item"><i>⭐</i><span>Profile</span></a>
    </div>

    <script>
        window.onload = function() {
            switchTab('video', document.querySelector('.tab-btn'));
        };

        function switchTab(mode, btnElement) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            document.getElementById('activeLiveView').style.display = 'none';
            let panel = document.getElementById('studioPanel');
            panel.style.display = 'block';

            if(mode === 'video') {
                panel.innerHTML = `
                    <div class="studio-box">
                        <div class="big-upload-icon" onclick="document.getElementById('hiddenVideoInput').click()" title="Choose Video">📹</div>
                        <input type="file" id="hiddenVideoInput" accept="video/*" style="display:none;" onchange="previewSelectedVideo(event)">
                        <div id="videoFileNameDisplay" style="font-size:12px; color:#25f4ee; margin-bottom:10px; text-align:center; font-weight:bold;">No video selected</div>
                        
                        <label style="font-size:11px; color:#aaa; display:block;">Video Caption & Hashtags:</label>
                        <input type="text" id="vidCaption" placeholder="e.g. Amazing Dance #Viral #NewStar" style="margin-bottom:12px;">
                        
                        <button class="btn btn-live" onclick="publishVideoToFeed()">🚀 Publish Video Now</button>
                    </div>
                `;
            } else if(mode === 'live') {
                panel.innerHTML = `
                    <div class="studio-box">
                        <div class="section-title">🔴 Video LIVE Room Setup</div>
                        <div class="section-desc">Go face-to-face live with real camera support:</div>
                        <label style="font-size:11px; color:#aaa; display:block; margin-top:8px;">Live Room Title:</label>
                        <input type="text" id="liveTitleInput" value="Night Dance Party 🎉" style="margin-bottom:15px;">
                        <button class="btn btn-live" onclick="startVideoLiveWithCamera()">🔴 Start Face-to-Face LIVE Now</button>
                    </div>
                `;
            } else if(mode === 'gaming') {
                panel.innerHTML = `
                    <div class="studio-box">
                        <div class="section-title">🎮 Live Gaming Stream Setup</div>
                        <div class="section-desc">Select game to launch directly on your device:</div>
                        <label style="font-size:11px; color:#aaa; display:block; margin-top:8px;">Select Game:</label>
                        <select id="selectedGameName" style="margin-bottom:15px;">
                            <option value="Free Fire">🔥 Free Fire Mobile</option>
                            <option value="PUBG Mobile">🎯 PUBG Mobile</option>
                            <option value="Ludo King">🎲 Ludo King</option>
                        </select>
                        <button class="btn btn-game" onclick="launchGameAndStream()">🚀 Open Game & Start Stream</button>
                    </div>
                `;
            }
        }

        let selectedVideoDataUrl = '';
        function previewSelectedVideo(event) {
            let file = event.target.files[0];
            if(file) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    selectedVideoDataUrl = e.target.result;
                    document.getElementById('videoFileNameDisplay').innerText = '✅ Selected: ' + file.name;
                };
                reader.readAsDataURL(file);
            }
        }

        function publishVideoToFeed() {
            let caption = document.getElementById('vidCaption').value.trim() || 'New Viral Video #NewStar';
            if(!selectedVideoDataUrl) {
                alert('⚠️ Please select a video file from your gallery first!');
                return;
            }

            // Save to localStorage so index.html can load it immediately
            let feedList = JSON.parse(localStorage.getItem('customFeedVideos') || '[]');
            feedList.unshift({
                url: selectedVideoDataUrl,
                caption: caption,
                username: localStorage.getItem('appHandle') || '@newstar981152',
                likes: '12K',
                views: '45.2K'
            });
            localStorage.setItem('customFeedVideos', JSON.stringify(feedList));

            alert('✅ Video published successfully! Redirecting to Home Feed...');
            window.location.href = 'index.html';
        }

        let mediaStream = null;
        function startVideoLiveWithCamera() {
            document.getElementById('studioPanel').style.display = 'none';
            let liveView = document.getElementById('activeLiveView');
            liveView.style.display = 'block';
            document.getElementById('liveStatusText').innerText = '🔴 Face-to-Face Video LIVE Active';

            let videoEl = document.getElementById('liveCameraFeed');
            navigator.mediaDevices.getUserMedia({ video: true, audio: true })
                .then(stream => {
                    mediaStream = stream;
                    videoEl.srcObject = stream;
                })
                .catch(err => {
                    alert('⚠️ Camera access error or permission denied: ' + err.message);
                });
        }

        function launchGameAndStream() {
            let game = document.getElementById('selectedGameName').value;
            alert('🚀 Launching ' + game + ' via deep-link intent...');
            
            // Attempt to open Free Fire / PUBG via Android Intent Scheme
            if(game === 'Free Fire') {
                window.location.href = 'intent://#Intent;package=com.dts.freefireth;end;';
            } else if(game === 'PUBG Mobile') {
                window.location.href = 'intent://#Intent;package=com.tencent.ig;end;';
            } else {
                window.location.href = 'intent://#Intent;package=com.ludo.king;end;';
            }

            // Also start camera stream concurrently
            startVideoLiveWithCamera();
            document.getElementById('liveStatusText').innerText = '🎮 Gaming Stream Active: ' + game;
        }

        function stopLiveBroadcast() {
            if(mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }
            document.getElementById('activeLiveView').style.display = 'none';
            switchTab('video', document.querySelector('.tab-btn'));
        }
    </script>
</body>
</html>
