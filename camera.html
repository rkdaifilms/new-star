<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>New Star - Camera & Video Recorder</title>
    
    <!-- 📱 PWA APP METAS & CORRECT ICONS -->
    <meta name="theme-color" content="#fe2c55">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="New Star">
    
    <!-- 🌟 DIRECT STABLE APP ICON LINKS -->
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/1828/1828884.png">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1828/1828884.png">
    
    <!-- 📋 STANDARD MANIFEST LINK -->
    <link rel="manifest" href="manifest.json">

    <!-- ⚡ SUPABASE JS SDK & CONFIG -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #000; color: #fff; padding-bottom: 70px; overflow-x: hidden; height: 100vh; touch-action: manipulation; }

        /* Camera Viewport Container */
        .camera-container { position: relative; width: 100%; height: calc(100vh - 60px); background: #111; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #cameraPreview { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; background: #000; }

        /* Top Controls Bar */
        .camera-top-bar { position: absolute; top: 15px; left: 0; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; z-index: 20; }
        .cam-top-btn { background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 8px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; backdrop-filter: blur(5px); }

        /* Right Side Filter & Tools Panel */
        .camera-side-tools { position: absolute; right: 15px; top: 80px; display: flex; flex-direction: column; gap: 15px; z-index: 20; }
        .tool-icon-btn { width: 42px; height: 42px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.3); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 18px; color: #fff; cursor: pointer; backdrop-filter: blur(5px); }

        /* Bottom Recording Controls */
        .camera-bottom-controls { position: absolute; bottom: 30px; left: 0; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 15px; z-index: 20; }
        
        .timer-display { font-size: 14px; font-weight: bold; background: rgba(0,0,0,0.6); padding: 4px 12px; border-radius: 12px; color: #fe2c55; display: none; border: 1px solid #fe2c55; }

        .shutter-row { display: flex; align-items: center; justify-content: space-around; width: 80%; max-width: 350px; }
        
        .gallery-preview-thumb { width: 45px; height: 45px; border-radius: 10px; border: 2px solid #fff; object-fit: cover; background: #333; cursor: pointer; }
        
        .shutter-btn { width: 75px; height: 75px; border-radius: 50%; background: transparent; border: 4px solid #fff; display: flex; justify-content: center; align-items: center; cursor: pointer; position: relative; }
        .shutter-inner { width: 60px; height: 60px; border-radius: 50%; background: #fe2c55; transition: 0.2s; }
        .shutter-btn.recording .shutter-inner { border-radius: 8px; width: 35px; height: 35px; background: #ff0000; }

        .flip-cam-btn { width: 45px; height: 45px; border-radius: 50%; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.3); display: flex; justify-content: center; align-items: center; font-size: 20px; color: #fff; cursor: pointer; }

        /* BOTTOM NAVBAR STYLE */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #111; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #888; text-decoration: none; font-size: 11px; cursor: pointer; }
        .nav-item.active { color: #fff; font-weight: bold; }
        .nav-item span.icon { font-size: 20px; margin-bottom: 2px; }
        .nav-center-btn { width: 42px; height: 32px; background: linear-gradient(135deg, #25f4ee, #fe2c55); border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 20px; color: #000; font-weight: bold; box-shadow: 0 2px 8px rgba(254,44,85,0.5); }

        /* FLOATING TOAST */
        #floatingToastMessage { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(50px); background: rgba(20,20,22,0.95); border: 1px solid #25f4ee; color: #fff; padding: 10px 20px; border-radius: 30px; font-size: 12px; z-index: 40000; opacity: 0; transition: 0.3s ease; pointer-events: none; }
        #floatingToastMessage.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div id="floatingToastMessage">Notification</div>

    <!-- Camera Viewport Section -->
    <div class="camera-container">
        <video id="cameraPreview" autoplay playsinline muted></video>

        <!-- Top Controls -->
        <div class="camera-top-bar">
            <button class="cam-top-btn" onclick="toggleFlash()">⚡ Flash: Off</button>
            <button class="cam-top-btn" onclick="selectDuration('60s')">⏱️ 60s Max</button>
            <button class="cam-top-btn" onclick="openAudioLibrary()">🎵 Sounds</button>
        </div>

        <!-- Right Side Tools -->
        <div class="camera-side-tools">
            <div class="tool-icon-btn" onclick="toggleFilters()" title="Filters">✨</div>
            <div class="tool-icon-btn" onclick="toggleTimer()" title="Timer">⏲️</div>
            <div class="tool-icon-btn" onclick="toggleSpeed()" title="Speed">⚡</div>
        </div>

        <!-- Bottom Shutter & Controls -->
        <div class="camera-bottom-controls">
            <div class="timer-display" id="recTimerDisplay">00:00</div>

            <div class="shutter-row">
                <img src="https://cdn-icons-png.flaticon.com/512/1828/1828884.png" class="gallery-preview-thumb" id="galleryThumb" onclick="goToUploadPage()" title="Upload / Gallery">
                
                <div class="shutter-btn" id="shutterBtn" onclick="toggleRecordVideo()">
                    <div class="shutter-inner"></div>
                </div>

                <div class="flip-cam-btn" onclick="switchCameraFacing()">🔄</div>
            </div>
        </div>
    </div>

    <!-- 🌟 BOTTOM NAVIGATION BAR -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item"><span class="icon">🏠</span><span>Home</span></a>
        <a href="inbox.html" class="nav-item"><span class="icon">💬</span><span>Inbox</span></a>
        <a href="camera.html" class="nav-item active"><div class="nav-center-btn">+</div></a>
        <a href="wallet.html" class="nav-item"><span class="icon">💰</span><span>Wallet</span></a>
        <a href="profile.html" class="nav-item"><span class="icon">👤</span><span>Profile</span></a>
    </div>

    <!-- 🌟 NAVBAR SCRIPT LOADER -->
    <script src="navbar.js"></script>

    <script>
        let mediaStream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let useFrontCamera = true;
        let recordTimerInterval = null;
        let recordSeconds = 0;

        window.onload = async function() {
            await initCameraStream();
        };

        async function initCameraStream() {
            try {
                if (mediaStream) {
                    mediaStream.getTracks().forEach(track => track.stop());
                }

                let constraints = {
                    video: { facingMode: useFrontCamera ? 'user' : 'environment', width: {ideal: 1280}, height: {ideal: 720} },
                    audio: true
                };

                mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
                let previewEl = document.getElementById('cameraPreview');
                previewEl.srcObject = mediaStream;
                previewEl.play();
            } catch (err) {
                console.error('Camera access error:', err);
                showToast('⚠️ Camera access denied or not supported.');
            }
        }

        function switchCameraFacing() {
            useFrontCamera = !useFrontCamera;
            initCameraStream();
            showToast(useFrontCamera ? '🔄 Front Camera' : '🔄 Rear Camera');
        }

        function toggleRecordVideo() {
            let shutterBtn = document.getElementById('shutterBtn');
            let timerDisplay = document.getElementById('recTimerDisplay');

            if (!isRecording) {
                // Start Recording
                recordedChunks = [];
                try {
                    mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'video/webm;codecs=vp9,opus' });
                } catch (e) {
                    try {
                        mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'video/mp4' });
                    } catch (err) {
                        mediaRecorder = new MediaRecorder(mediaStream);
                    }
                }

                mediaRecorder.ondataavailable = function(e) {
                    if (e.data && e.data.size > 0) {
                        recordedChunks.push(e.data);
                    }
                };

                mediaRecorder.onstop = async function() {
                    let blob = new Blob(recordedChunks, { type: 'video/mp4' });
                    let videoUrl = URL.createObjectURL(blob);
                    
                    // Save temporarily for upload page or Supabase processing
                    localStorage.setItem('recordedVideoBlobUrl', videoUrl);
                    
                    showToast('✅ Video recorded successfully! Redirecting...');
                    setTimeout(() => {
                        window.location.href = 'upload.html';
                    }, 1000);
                };

                mediaRecorder.start();
                isRecording = true;
                shutterBtn.classList.add('recording');
                timerDisplay.style.display = 'block';

                recordSeconds = 0;
                timerDisplay.innerText = '00:00';
                recordTimerInterval = setInterval(() => {
                    recordSeconds++;
                    let mins = Math.floor(recordSeconds / 60).toString().padStart(2, '0');
                    let secs = (recordSeconds % 60).toString().padStart(2, '0');
                    timerDisplay.innerText = `${mins}:${secs}`;

                    if (recordSeconds >= 60) {
                        toggleRecordVideo(); // Auto stop at 60s
                    }
                }, 1000);

                showToast('🔴 Recording started...');
            } else {
                // Stop Recording
                mediaRecorder.stop();
                isRecording = false;
                shutterBtn.classList.remove('recording');
                timerDisplay.style.display = 'none';
                clearInterval(recordTimerInterval);
            }
        }

        function toggleFlash() {
            showToast('⚡ Flash feature toggled');
        }

        function selectDuration(dur) {
            showToast(`⏱️ Duration set to ${dur}`);
        }

        function openAudioLibrary() {
            showToast('🎵 Opening Sound Library...');
        }

        function toggleFilters() {
            showToast('✨ Filters applied');
        }

        function toggleTimer() {
            showToast('⏲️ Timer set (3s)');
        }

        function toggleSpeed() {
            showToast('⚡ Speed: 1x Standard');
        }

        function goToUploadPage() {
            window.location.href = 'upload.html';
        }

        function showToast(msg) {
            let toast = document.getElementById('floatingToastMessage');
            if(!toast) return;
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2000);
        }
    </script>
</body>
</html>
