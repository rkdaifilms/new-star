<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Upload Studio - New Star</title>
    
    <meta name="theme-color" content="#fe2c55">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- ⚡ SUPABASE JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0b0b; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 15px; padding-bottom: 90px; }
        
        .top-bar { width: 100%; max-width: 450px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .top-close { font-size: 18px; text-decoration: none; color: #fff; background: #181818; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid #333; }
        
        .studio-container { width: 100%; max-width: 450px; background: #121212; border: 1px solid #222; border-radius: 16px; padding: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.8); }
        
        .studio-header { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid #222; padding-bottom: 12px; }
        .studio-header span { font-size: 24px; }
        .studio-header h2 { font-size: 16px; color: #fe2c55; font-weight: bold; }
        .studio-header p { font-size: 11px; color: #888; }

        .media-actions-row { display: flex; gap: 10px; margin-bottom: 20px; }
        .media-btn { flex: 1; background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 12px 10px; text-align: center; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .media-btn:hover { border-color: #fe2c55; background: #222; }
        .media-btn span { font-size: 20px; }
        .media-btn b { font-size: 12px; color: #fff; display: block; }
        .media-btn small { font-size: 10px; color: #888; display: block; }

        .input-group { margin-bottom: 14px; }
        .input-group label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #aaa; margin-bottom: 6px; font-weight: 600; }
        .input-group input, .input-group textarea { width: 100%; padding: 10px 14px; background: #181818; border: 1px solid #333; color: #fff; border-radius: 10px; font-size: 13px; outline: none; transition: border-color 0.2s; }
        .input-group input:focus, .input-group textarea:focus { border-color: #fe2c55; }
        .input-group textarea { resize: none; height: 65px; }

        .post-action-btn { display: block; width: 100%; background: linear-gradient(135deg, #fe2c55, #ff6b8b); color: #fff; text-align: center; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 14px; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(254,44,85,0.4); margin-top: 20px; }
        .post-action-btn:disabled { background: #444; cursor: not-allowed; box-shadow: none; }

        .share-row-btn { display: block; width: 100%; background: #1a1a1a; border: 1px solid #333; color: #25f4ee; text-align: center; padding: 12px; border-radius: 12px; font-weight: bold; font-size: 13px; cursor: pointer; margin-top: 10px; }

        /* Video Preview Box */
        #previewBox { display: none; width: 100%; height: 160px; background: #000; border-radius: 10px; margin-bottom: 15px; overflow: hidden; position: relative; border: 1px solid #333; }
        #previewBox video { width: 100%; height: 100%; object-fit: cover; }

        /* 🚀 CLEAN PERCENTAGE PROGRESS BAR MODAL */
        #uploadProgressModal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.88); z-index: 3000; justify-content: center; align-items: center; flex-direction: column; padding: 30px; }
        .progress-card { background: #1c1c1e; border: 1px solid #333; width: 100%; max-width: 320px; border-radius: 16px; padding: 25px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.9); }
        .progress-card h3 { font-size: 16px; color: #fe2c55; margin-bottom: 15px; }
        .progress-track { width: 100%; height: 10px; background: #333; border-radius: 5px; overflow: hidden; margin-bottom: 12px; }
        .progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #25f4ee, #fe2c55); transition: width 0.15s linear; }
        .progress-status { font-size: 18px; color: #25f4ee; font-weight: bold; }
    </style>
</head>
<body>

    <!-- 🚀 REAL UPLOAD PROGRESS MODAL -->
    <div id="uploadProgressModal">
        <div class="progress-card">
            <h3 id="progressTitleHeading">Publishing Video...</h3>
            <div class="progress-track">
                <div class="progress-fill" id="progressBarFill"></div>
            </div>
            <div class="progress-status" id="progressPercentText">0%</div>
        </div>
    </div>

    <div class="top-bar">
        <a href="index.html" class="top-close">←</a>
        <h3 style="font-size:15px; color:#fe2c55;">📹 Video Studio & Camera</h3>
        <div></div>
    </div>

    <!-- Main Studio Card -->
    <div class="studio-container">
        
        <div class="studio-header">
            <span>🎬</span>
            <div>
                <h2>Create & Publish Reel</h2>
                <p>Record up to 10 mins or choose from gallery (Short & Long supported)</p>
            </div>
        </div>

        <!-- Hidden Inputs for Gallery & Live Camera -->
        <input type="file" id="galleryVideoInput" accept="video/*" style="display:none;" onchange="onVideoFileChosen(event)">
        <input type="file" id="liveCameraInput" accept="video/*" capture="environment" style="display:none;" onchange="onVideoFileChosen(event)">

        <!-- Media Selection Buttons -->
        <div class="media-actions-row">
            <div class="media-btn" onclick="document.getElementById('liveCameraInput').click()">
                <span>🔴</span>
                <div>
                    <b>Record Video</b>
                    <small>Live Camera (Up to 10m)</small>
                </div>
            </div>
            <div class="media-btn" onclick="document.getElementById('galleryVideoInput').click()">
                <span>📁</span>
                <div>
                    <b>Open Gallery</b>
                    <small>Choose Video File</small>
                </div>
            </div>
        </div>

        <!-- Video Preview Container -->
        <div id="previewBox">
            <video id="selectedVideoPreview" controls></video>
        </div>

        <!-- Video Details Form -->
        <div class="input-group">
            <label><span>📝</span> Video Title / Caption:</label>
            <input type="text" id="videoCaptionInput" placeholder="Write catchy title and hashtags (#Viral #Dance)...">
        </div>

        <div class="input-group">
            <label><span>📜</span> Detailed Description (Optional):</label>
            <textarea id="videoDescriptionInput" placeholder="Describe your video content..."></textarea>
        </div>

        <div class="input-group">
            <label><span>🔗</span> Affiliate / Promo / Custom Link (Optional):</label>
            <input type="text" id="videoAffiliateInput" placeholder="https://your-product-link.com">
        </div>

        <button class="post-action-btn" id="postBtn" onclick="publishVideoToGlobalFeed()">🚀 Post Video Now</button>
        <button class="share-row-btn" onclick="shareStudioToAllSocialApps()">🌐 Share App to WhatsApp & Social Apps</button>
    </div>

    <!-- 🌟 NAVBAR SCRIPT LOADER -->
    <script src="navbar.js"></script>

    <script>
        const SUPABASE_URL = "https://uzsusgoetrkujmofxcmb.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_Zz2hljevMsXBcK8c33UvFw_wuc2itVr";

        const { createClient } = window.supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let selectedVideoFile = null;

        function onVideoFileChosen(event) {
            let file = event.target.files[0];
            if(file) {
                selectedVideoFile = file;
                let previewBox = document.getElementById('previewBox');
                let videoElement = document.getElementById('selectedVideoPreview');
                
                videoElement.src = URL.createObjectURL(file);
                previewBox.style.display = 'block';
            }
        }

        function shareStudioToAllSocialApps() {
            let shareData = {
                title: 'New Star Creator Hub',
                text: 'Check out amazing videos and creators on New Star Creator Hub!',
                url: window.location.origin + '/index.html'
            };

            if (navigator.share) {
                navigator.share(shareData).catch((error) => console.log('Share error', error));
            } else {
                navigator.clipboard.writeText(window.location.origin + '/index.html');
                alert('📋 Link copied to clipboard! You can share it directly on WhatsApp or Facebook.');
            }
        }

        async function publishVideoToGlobalFeed() {
            let caption = document.getElementById('videoCaptionInput').value.trim() || 'New Viral Video #StarNewStar';
            let description = document.getElementById('videoDescriptionInput').value.trim() || 'Professional video on New Star Creator Hub.';
            let affiliate = document.getElementById('videoAffiliateInput').value.trim() || '';

            if(!selectedVideoFile) {
                alert('⚠️ Please record a video or choose one from your gallery first!');
                return;
            }

            let btn = document.getElementById('postBtn');
            btn.disabled = true;

            let modal = document.getElementById('uploadProgressModal');
            let fill = document.getElementById('progressBarFill');
            let percentText = document.getElementById('progressPercentText');
            let titleHeading = document.getElementById('progressTitleHeading');

            modal.style.display = 'flex';
            let progress = 0;

            let progressInterval = setInterval(() => {
                progress += Math.floor(Math.random() * 6) + 4;
                if (progress > 95) progress = 95;
                fill.style.width = progress + '%';
                percentText.innerText = progress + '%';
            }, 90);

            let reader = new FileReader();
            reader.onload = async function(e) {
                let permanentVideoUrl = e.target.result;
                let myHandle = localStorage.getItem('appHandle') || '@ramram981152';

                let newPostObj = {
                    id: 'vid_' + Date.now(),
                    url: permanentVideoUrl,
                    caption: caption,
                    description: description,
                    affiliate: affiliate,
                    username: myHandle,
                    likes: 120,
                    views: 850
                };

                // 1. Save to Global Feed Storage
                let globalFeed = JSON.parse(localStorage.getItem('customFeedVideos') || '[]');
                globalFeed.unshift(newPostObj);
                localStorage.setItem('customFeedVideos', JSON.stringify(globalFeed));

                // 2. Save to Profile Feed Storage
                let profileFeed = JSON.parse(localStorage.getItem('profileVideosList') || '[]');
                profileFeed.unshift(newPostObj);
                localStorage.setItem('profileVideosList', JSON.stringify(profileFeed));

                // 3. Sync with Supabase Database
                try {
                    await supabaseClient.from('videos').insert([
                        { 
                            video_url: permanentVideoUrl, 
                            caption: caption, 
                            description: description,
                            affiliate_link: affiliate,
                            username: myHandle,
                            likes_count: 120,
                            views_count: 850
                        }
                    ]);
                } catch(err) {
                    console.log('Supabase DB Sync Note:', err);
                }

                clearInterval(progressInterval);
                fill.style.width = '100%';
                percentText.innerText = '100%';
                titleHeading.innerText = '✨ Upload Successful!';

                setTimeout(() => {
                    modal.style.display = 'none';
                    window.location.href = 'profile.html';
                }, 700);
            };

            reader.onerror = function(err) {
                clearInterval(progressInterval);
                modal.style.display = 'none';
                alert('❌ Error processing video file. Try another video.');
                btn.disabled = false;
            };

            reader.readAsDataURL(selectedVideoFile);
        }
    </script>
</body>
</html>
