<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Upload Studio - Star New Star</title>
    
    <meta name="theme-color" content="#fe2c55">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- ⚡ SUPABASE JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0b0b0b; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 15px; padding-bottom: 80px; }
        
        .top-bar { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .top-close { font-size: 20px; text-decoration: none; color: #fff; background: #222; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid #444; }
        
        .studio-card { width: 100%; max-width: 480px; background: #141414; border: 1px solid #333; border-radius: 20px; padding: 25px 20px; text-align: left; box-shadow: 0 4px 20px rgba(0,0,0,0.8); }
        .section-title { font-size: 18px; color: #25f4ee; margin-bottom: 6px; font-weight: bold; }
        .section-desc { font-size: 12px; color: #aaa; margin-bottom: 20px; line-height: 1.4; }

        .big-upload-box { width: 100%; height: 130px; background: #1a1a1a; border: 2px dashed #fe2c55; border-radius: 14px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; margin-bottom: 15px; transition: 0.2s; }
        .big-upload-box:hover { background: #222; }
        .upload-icon { font-size: 40px; margin-bottom: 5px; }
        .upload-text { font-size: 13px; color: #ff6b8b; font-weight: bold; text-align: center; padding: 0 10px; }

        label { display: block; width: 100%; font-size: 12px; color: #ccc; margin-bottom: 5px; }
        input[type="text"] { width: 100%; padding: 12px; background: #111; border: 1px solid #444; color: #fff; border-radius: 10px; margin-bottom: 15px; font-size: 13px; outline: none; }
        
        .post-btn { display: block; width: 100%; background: linear-gradient(135deg, #fe2c55, #ff6b8b); color: #fff; text-align: center; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 15px; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(254,44,85,0.4); }
        .post-btn:disabled { background: #555; cursor: not-allowed; box-shadow: none; }

        /* 🚀 CLEAN PERCENTAGE PROGRESS BAR MODAL */
        #uploadProgressModal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.88); z-index: 3000; justify-content: center; align-items: center; flex-direction: column; padding: 30px; }
        .progress-card { background: #1c1c1e; border: 1px solid #333; width: 100%; max-width: 320px; border-radius: 16px; padding: 25px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.9); }
        .progress-card h3 { font-size: 16px; color: #fe2c55; margin-bottom: 15px; }
        .progress-track { width: 100%; height: 10px; background: #333; border-radius: 5px; overflow: hidden; margin-bottom: 12px; }
        .progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #25f4ee, #fe2c55); transition: width 0.15s linear; }
        .progress-status { font-size: 18px; color: #25f4ee; font-weight: bold; }

        /* Bottom Navigation Bar */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: rgba(255,255,255,0.6); cursor: pointer; text-decoration: none; font-size: 11px; }
        .nav-item.active { color: #fff; }
        .upload-plus-btn { width: 42px; height: 28px; background: linear-gradient(135deg, #25f4ee, #fe2c55); border-radius: 8px; display: flex; justify-content: center; align-items: center; color: #fff; font-size: 20px; }
    </style>
</head>
<body>

    <!-- 🚀 REAL UPLOAD PROGRESS MODAL -->
    <div id="uploadProgressModal">
        <div class="progress-card">
            <h3>Processing Video...</h3>
            <div class="progress-track">
                <div class="progress-fill" id="progressBarFill"></div>
            </div>
            <div class="progress-status" id="progressPercentText">0%</div>
        </div>
    </div>

    <div class="top-bar">
        <a href="index.html" class="top-close">←</a>
        <h3 style="font-size:16px; color:#fe2c55;">📹 Video Upload Studio</h3>
        <div></div>
    </div>

    <!-- Video Upload Form Card -->
    <div class="studio-card">
        <div class="section-title">Upload Video to Profile & Feed</div>
        <div class="section-desc">Select a video from your gallery, write a catchy title, and post it directly to your Supabase database!</div>
        
        <!-- Gallery File Picker Box -->
        <div class="big-upload-box" onclick="document.getElementById('galleryVideoInput').click()">
            <div class="upload-icon">📁</div>
            <div class="upload-text" id="uploadBoxLabel">Tap to Select Video from Gallery</div>
        </div>
        <input type="file" id="galleryVideoInput" accept="video/*" style="display:none;" onchange="onVideoFileChosen(event)">
        
        <label>Video Title & Hashtags:</label>
        <input type="text" id="videoCaptionInput" value="New Viral Dance Reel 🔥 #StarNewStar #Viral">
        
        <button class="post-btn" id="postBtn" onclick="publishVideoToSupabase()">🚀 Post Video Now</button>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item"><i>🏠</i><span>Home</span></a>
        <a href="wallet.html" class="nav-item"><i>🪙</i><span>Wallet</span></a>
        <a href="camera.html" class="nav-item active"><div class="upload-plus-btn">+</div></a>
        <a href="inbox.html" class="nav-item"><i>💬</i><span>Inbox</span></a>
        <a href="profile.html" class="nav-item"><i>⭐</i><span>Profile</span></a>
    </div>

    <script>
        const SUPABASE_URL = "https://uzsusgoetrkujmofxcmb.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_Zz2hljevMsXBcK8c33UvFw_wuc2itVr";

        const { createClient } = window.supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let selectedVideoFile = null;

        function onVideoFileChosen(event) {
            let file = event.target.files[0];
            if(file) {
                selectedVideoFile = file;
                document.getElementById('uploadBoxLabel').innerText = '✅ Selected: ' + file.name;
            }
        }

        async function publishVideoToSupabase() {
            let caption = document.getElementById('videoCaptionInput').value.trim() || 'New Viral Video #StarNewStar';
            if(!selectedVideoFile) {
                alert('⚠️ Please tap the gallery box and select a video file first!');
                return;
            }

            let btn = document.getElementById('postBtn');
            btn.disabled = true;

            // Show Progress Modal
            let modal = document.getElementById('uploadProgressModal');
            let fill = document.getElementById('progressBarFill');
            let percentText = document.getElementById('progressPercentText');

            modal.style.display = 'flex';
            let progress = 0;

            // Smooth percentage progress runner
            let progressInterval = setInterval(() => {
                progress += Math.floor(Math.random() * 4) + 2;
                if (progress > 94) progress = 94; // Wait for actual upload to finish
                fill.style.width = progress + '%';
                percentText.innerText = progress + '%';
            }, 150);

            try {
                let myHandle = localStorage.getItem('appHandle') || '@newstar981152';
                let fileName = 'video_' + Date.now() + '_' + selectedVideoFile.name;
                let videoPublicUrl = '';

                // 1. Upload video file to Supabase Storage
                let { data: uploadData, error: uploadError } = await supabaseClient.storage
                    .from('videos')
                    .upload(fileName, selectedVideoFile);

                if (uploadError) {
                    console.error('Storage upload error:', uploadError);
                    videoPublicUrl = URL.createObjectURL(selectedVideoFile);
                } else {
                    let { data: publicUrlData } = supabaseClient.storage
                        .from('videos')
                        .getPublicUrl(fileName);
                    videoPublicUrl = publicUrlData.publicUrl;
                }

                // 2. Save record into Supabase database table 'videos'
                let { error: dbError } = await supabaseClient
                    .from('videos')
                    .insert([
                        { 
                            video_url: videoPublicUrl, 
                            caption: caption, 
                            username: myHandle,
                            likes_count: 120,
                            views_count: 850
                        }
                    ]);

                if (dbError) {
                    console.error('DB Insert Error:', dbError.message);
                }

                // 3. Backup to localStorage so profile loads it instantly
                let feedList = JSON.parse(localStorage.getItem('customFeedVideos') || '[]');
                let newPost = {
                    id: 'vid_' + Date.now(),
                    url: videoPublicUrl,
                    caption: caption,
                    username: myHandle,
                    likes: 120,
                    views: 850
                };
                feedList.unshift(newPost);
                localStorage.setItem('customFeedVideos', JSON.stringify(feedList));

                // Finish progress bar to 100%
                clearInterval(progressInterval);
                fill.style.width = '100%';
                percentText.innerText = '100%';

                setTimeout(() => {
                    modal.style.display = 'none';
                    window.location.href = 'profile.html';
                }, 800);

            } catch (err) {
                clearInterval(progressInterval);
                modal.style.display = 'none';
                console.error('Upload exception:', err);
                alert('❌ Error uploading video. Please try again.');
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
