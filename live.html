<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TikTok Style LIVE Room - New Star</title>
    
    <!-- 📱 PWA & META -->
    <meta name="theme-color" content="#fe2c55">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- ⚡ SUPABASE JS SDK & CONFIG -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #000; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* Clean Top Bar (No Unwanted Plus Icons) */
        .top-bar { width: 100%; max-width: 450px; display: flex; justify-content: space-between; align-items: center; margin: 10px auto; padding: 0 10px; position: absolute; top: 0; left: 0; right: 0; z-index: 20; min-height: 40px; }

        /* LIVE Room Container */
        .live-container { flex: 1; position: relative; width: 100%; max-width: 450px; margin: 0 auto; background: #111; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
        .live-video-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }

        /* LIVE Room Top Stats Header */
        .live-room-header { position: absolute; top: 50px; left: 15px; right: 15px; display: flex; justify-content: space-between; align-items: center; z-index: 10; background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 20px; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.1); }
        .live-pill { background: #fe2c55; color: #fff; font-size: 10px; font-weight: bold; padding: 3px 8px; border-radius: 10px; display: flex; align-items: center; gap: 4px; }
        .room-stats-text { font-size: 11px; color: #ffcc00; font-weight: bold; }

        /* LIVE Room Chat & Interaction Area */
        .live-overlay-content { position: absolute; bottom: 70px; left: 0; right: 0; padding: 15px; z-index: 10; display: flex; flex-direction: column; gap: 10px; max-height: 50vh; pointer-events: none; }
        .live-chat-box { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; pointer-events: auto; }
        .chat-bubble { background: rgba(0,0,0,0.5); padding: 6px 10px; border-radius: 10px; font-size: 12px; max-width: 85%; backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.08); }
        .chat-bubble b { color: #25f4ee; }

        /* Bottom Live Control Action Bar */
        .live-bottom-actions { position: absolute; bottom: 10px; left: 15px; right: 15px; display: flex; gap: 10px; align-items: center; z-index: 15; }
        .live-chat-input { flex: 1; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); padding: 10px 14px; border-radius: 20px; color: #fff; font-size: 13px; outline: none; backdrop-filter: blur(5px); }
        
        .live-action-icon-btn { width: 40px; height: 40px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 18px; cursor: pointer; color: #fff; flex-shrink: 0; }
        .live-action-icon-btn:hover { background: rgba(254,44,85,0.4); border-color: #fe2c55; }

        /* 🎁 TREASURE BOX MODAL (ULTRA FLEXIBLE & SMART WALLET DEDUCTION) */
        #treasureBoxModal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .treasure-card { background: #181818; border: 2px solid #fe2c55; width: 100%; max-width: 350px; border-radius: 18px; padding: 22px; box-shadow: 0 10px 30px rgba(0,0,0,0.9); position: relative; }
        .treasure-card h3 { font-size: 16px; color: #ffcc00; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
        
        .t-form-group { margin-bottom: 12px; }
        .t-form-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; font-weight: bold; }
        .t-form-group input { width: 100%; padding: 10px 14px; background: #111; border: 1px solid #333; color: #fff; border-radius: 10px; font-size: 14px; outline: none; }
        .t-form-group input:focus { border-color: #fe2c55; }

        .drop-treasure-btn { display: block; width: 100%; background: linear-gradient(135deg, #fe2c55, #ffcc00); color: #000; text-align: center; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 14px; border: none; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 15px rgba(254,44,85,0.4); }
        .close-treasure { position: absolute; top: 14px; right: 18px; font-size: 18px; cursor: pointer; color: #aaa; }

        /* Active Floating Treasure Box Animation in Live Room */
        #activeTreasureBanner { display: none; position: absolute; top: 110px; left: 15px; right: 15px; background: linear-gradient(135deg, rgba(254,44,85,0.9), rgba(255,204,0,0.9)); padding: 10px 15px; border-radius: 14px; z-index: 12; color: #000; font-weight: bold; box-shadow: 0 5px 20px rgba(0,0,0,0.8); animation: bounceBox 1s infinite alternate; }
        @keyframes bounceBox { 0% { transform: translateY(0); } 100% { transform: translateY(-4px); } }
    </style>
</head>
<body>

    <!-- Clean Top Bar -->
    <div class="top-bar">
        <div></div>
        <div></div>
    </div>

    <!-- LIVE Room Main Viewport -->
    <div class="live-container">
        <!-- Live Video Stream Background -->
        <video class="live-video-bg" autoplay loop muted playsinline src="https://assets.mixkit.co/videos/preview/mixkit-young-woman-dancing-in-a-room-41653-large.mp4"></video>

        <!-- Active Treasure Box Floating Banner -->
        <div id="activeTreasureBanner">
            🎁 <span id="bannerTitle">Treasure Box Active!</span> | <span id="bannerTimer">00:30</span> left! (<span id="bannerCoinsLeft">500</span> 🪙)
        </div>

        <!-- Room Header Stats -->
        <div class="live-room-header">
            <div class="live-pill"><span>🔴</span> LIVE ROOM ACTIVE</div>
            <div class="room-stats-text">🪙 Coins: <span id="roomUserCoins">19,550</span> | 🔥 Rank: #1</div>
        </div>

        <!-- Chat Overlay -->
        <div class="live-overlay-content">
            <div class="live-chat-box" id="liveChatList">
                <div class="chat-bubble"><b>Rohit Painter:</b> Mast live room hai bhai! 🔥</div>
                <div class="chat-bubble"><b>Anjali Dance:</b> Sent a Rose 🌹</div>
            </div>
        </div>

        <!-- Bottom Action Bar -->
        <div class="live-bottom-actions">
            <input type="text" class="live-chat-input" id="liveChatInput" placeholder="Say something nice..." onkeypress="handleLiveChatKey(event)">
            <!-- Treasure Box Trigger Button -->
            <div class="live-action-icon-btn" onclick="openTreasureModal()" title="Drop Treasure Box">🎁</div>
            <div class="live-action-icon-btn" onclick="sendLiveGift('Rose 🌹', 1)" title="Send Gift">🌹</div>
            <div class="live-action-icon-btn" onclick="endLiveRoom()" title="End Live" style="background:#ff3b30;">✕</div>
        </div>
    </div>

    <!-- 🎁 SMART TREASURE BOX SETUP MODAL (UNLIMITED COINS, PEOPLE & TIME) -->
    <div id="treasureBoxModal">
        <div class="treasure-card" onclick="event.stopPropagation()">
            <span class="close-treasure" onclick="closeTreasureModal()">✕</span>
            <h3>🎁 Drop TikTok Treasure Box</h3>
            <p style="font-size: 12px; color: #aaa; margin-bottom: 12px;">Set your custom coins, number of participants, and timer:</p>

            <div class="t-form-group">
                <label>Total Coins in Box (Unlimited):</label>
                <input type="number" id="tbCoinsInput" value="500" min="10" placeholder="e.g. 500, 1000, 5000">
            </div>

            <div class="t-form-group">
                <label>Number of People (Winners):</label>
                <input type="number" id="tbPeopleInput" value="5" min="1" max="100" placeholder="e.g. 5 or 10 people">
            </div>

            <div class="t-form-group">
                <label>Duration / Timer (10 Seconds to 5 Minutes):</label>
                <select id="tbTimerSelect" style="width:100%; padding:10px; background:#111; border:1px solid #333; color:#fff; border-radius:10px; font-size:14px; outline:none;">
                    <option value="10">10 Seconds</option>
                    <option value="30">30 Seconds</option>
                    <option value="60" selected>1 Minute (60s)</option>
                    <option value="180">3 Minutes (180s)</option>
                    <option value="300">5 Minutes (300s)</option>
                </select>
            </div>

            <button class="drop-treasure-btn" onclick="executeDropTreasureBox()">🚀 Drop Treasure Box Now</button>
        </div>
    </div>

    <!-- 🌟 NAVBAR SCRIPT LOADER -->
    <script src="navbar.js"></script>

    <script>
        let myWalletCoins = 19550;

        window.onload = function() {
            let savedCoins = localStorage.getItem('userWalletCoins');
            if(savedCoins) {
                myWalletCoins = parseInt(savedCoins);
            }
            document.getElementById('roomUserCoins').innerText = myWalletCoins.toLocaleString();
        };

        function openTreasureModal() {
            document.getElementById('treasureBoxModal').style.display = 'flex';
        }

        function closeTreasureModal() {
            document.getElementById('treasureBoxModal').style.display = 'none';
        }

        // 🧠 SMART WALLET CHECK & DIRECT WALLET REDIRECT ENGINE
        function checkAndDeductCoins(requiredCoins) {
            let currentCoins = parseInt(localStorage.getItem('userWalletCoins') || '19550');
            
            if (currentCoins < requiredCoins) {
                alert(`⚠️ Insufficient Balance!\nYou need ${requiredCoins.toLocaleString()} coins, but you have ${currentCoins.toLocaleString()} coins.\n\n🔄 Redirecting you to the Wallet & Coin Purchase Dashboard...`);
                window.location.href = 'wallet.html';
                return false;
            }

            // Direct deduction without extra confirmation popups
            currentCoins -= requiredCoins;
            localStorage.setItem('userWalletCoins', currentCoins);
            document.getElementById('roomUserCoins').innerText = currentCoins.toLocaleString();
            return true;
        }

        // 🚀 EXECUTE DROP TREASURE BOX WITH UNLIMITED COINS, PEOPLE & TIMER
        function executeDropTreasureBox() {
            let coinsVal = parseInt(document.getElementById('tbCoinsInput').value);
            let peopleVal = parseInt(document.getElementById('tbPeopleInput').value);
            let timerSeconds = parseInt(document.getElementById('tbTimerSelect').value);

            if (isNaN(coinsVal) || coinsVal <= 0) {
                alert('⚠️ Please enter a valid number of coins!');
                return;
            }
            if (isNaN(peopleVal) || peopleVal <= 0) {
                alert('⚠️ Please enter a valid number of people!');
                return;
            }

            // Check balance and deduct directly or redirect to wallet if low
            if (!checkAndDeductCoins(coinsVal)) {
                return;
            }

            closeTreasureModal();

            // Display active banner in live room
            let banner = document.getElementById('activeTreasureBanner');
            let titleSpan = document.getElementById('bannerTitle');
            let timerSpan = document.getElementById('bannerTimer');
            let coinsLeftSpan = document.getElementById('bannerCoinsLeft');

            titleSpan.innerText = `🎁 Treasure Box (${peopleVal} People)!`;
            coinsLeftSpan.innerText = coinsVal.toLocaleString();
            banner.style.display = 'block';

            let timeLeft = timerSeconds;
            let countdownInterval = setInterval(() => {
                let mins = Math.floor(timeLeft / 60);
                let secs = timeLeft % 60;
                timerSpan.innerText = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
                
                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    banner.style.display = 'none';
                    alert('🎉 Treasure Box timer ended and distributed successfully among viewers!');
                }
                timeLeft--;
            }, 1000);

            // Add system chat message
            let chatList = document.getElementById('liveChatList');
            chatList.innerHTML += `<div class="chat-bubble" style="background:rgba(254,44,85,0.3); border-color:#fe2c55;">🎁 <b>System:</b> Ramkumar dropped a Treasure Box of <b>${coinsVal.toLocaleString()} Coins</b> for ${peopleVal} people! 🔥</div>`;
            chatList.scrollTop = chatList.scrollHeight;
        }

        function sendLiveGift(giftName, cost) {
            if (!checkAndDeductCoins(cost)) {
                return;
            }

            let chatList = document.getElementById('liveChatList');
            let myName = localStorage.getItem('appName') || 'Ramkumar Dhobi';
            chatList.innerHTML += `<div class="chat-bubble"><b>${myName}:</b> Sent ${giftName} (-${cost} Coins) 🎁</div>`;
            chatList.scrollTop = chatList.scrollHeight;
        }

        function handleLiveChatKey(e) {
            if (e.key === 'Enter') {
                let input = document.getElementById('liveChatInput');
                let txt = input.value.trim();
                if(!txt) return;

                let chatList = document.getElementById('liveChatList');
                let myName = localStorage.getItem('appName') || 'Ramkumar Dhobi';
                chatList.innerHTML += `<div class="chat-bubble"><b>${myName}:</b> ${txt}</div>`;
                input.value = '';
                chatList.scrollTop = chatList.scrollHeight;
            }
        }

        function endLiveRoom() {
            if(confirm('🔴 Are you sure you want to end this Live Room?')) {
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
