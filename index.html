<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif}
html,body{width:100%;height:100%;background:#000;color:#fff;overflow:hidden}
body{padding-bottom:62px}
button,input{font:inherit}
button{cursor:pointer}
.feed-top-header{

}
.search-box{

}
.search-box input{

.video-meta{font-size:11px;color:#ddd;margin-top:6px}
.side-actions{

}
.action-btn{

.action-icon{

#emptyState{

 justify-content:center;text-align:center;padding:30px;color:#ddd;

}
#emptyState div{max-width:300px;line-height:1.6}
#emptyState button{
 margin-top:14px;padding:10px 18px;background:#fe2c55;
 color:white;border:0;border-radius:20px
}
#loadingState{
 position:absolute;inset:0;display:flex;align-items:center;
 justify-content:center;background:#080808;color:#fff;z-index:3
}
.modal{
 display:none;position:fixed;left:0;bottom:62px;width:100%;
 max-height:70dvh;background:#181818;border-radius:18px 18px 0 0;
 z-index:200;box-shadow:0 -5px 25px #000;flex-direction:column
}
.modal-header{
 display:flex;justify-content:space-between;align-items:center;
 padding:15px;border-bottom:1px solid #333
}
.modal-header h3{font-size:15px}
.close-btn{background:none;border:0;color:#fff;font-size:22px}
.comment-list{overflow-y:auto;flex:1;padding:14px;min-height:100px}
.comment-item{display:flex;gap:10px;margin-bottom:15px}
.comment-avatar{
 width:34px;height:34px;border-radius:50%;object-fit:cover;background:#333
}
.comment-content{flex:1;overflow-wrap:anywhere}
.comment-content h4{font-size:12px;color:#aaa;margin-bottom:4px}
.comment-content p{font-size:14px;line-height:1.4}
.comment-input-area{
 display:flex;gap:8px;padding:12px;border-top:1px solid #333
}
.comment-input-area input{
 flex:1;min-width:0;border:1px solid #444;background:#292929;
 color:white;border-radius:20px;padding:11px;outline:none
}
.primary-btn{
 border:0;background:#fe2c55;color:#fff;border-radius:20px;
 padding:10px 16px;font-weight:bold
}
#shareModal{padding:16px}
.share-action{
 width:100%;padding:12px;margin-top:10px;border:0;
 border-radius:9px;background:#292929;color:white
}
#toast{
 position:fixed;bottom:78px;left:50%;transform:translateX(-50%);
 background:#222;border:1px solid #555;color:white;padding:10px 17px;
 border-radius:25px;z-index:999999;display:none;font-size:13px;
 max-width:90%;text-align:center
}
#videoCounter{
 position:absolute;top:115px;right:12px;z-index:5;
 background:#0008;padding:5px 9px;border-radius:15px;font-size:11px
}
#playPause{
 position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
 z-index:6;background:#0007;border:0;border-radius:50%;
 width:60px;height:60px;color:white;font-size:27px;display:none
}
@media(min-width:700px){
 .feed-container{max-width:480px;margin:auto}
 .feed-top-header{max-width:480px;left:50%;transform:translateX(-50%)}
}
</style>
</head>

<script>
"use strict";

/*
 * DATABASE CONTRACT
 * videos:
 * id, video_url, caption, category, username,
 * likes_count, views_count, created_at
 *
 * likes assumed:
 * id, video_id, user_id, created_at
 *
 * video_comments assumed:
 * id, video_id, user_id, username, comment, created_at
 */

const $ = id => document.getElementById(id);

let db = window.supabaseClient || null;
let currentUser = null;
let rawVideos = [];
let filteredVideos = [];
let currentIndex = 0;
let currentCategory = "For You";
let currentVideo = null;
let likedVideoIds = new Set();
let toastTimer = null;
let touchStartY = 0;
let loadingComments = false;

function toast(message) {
 const el = $("toast");
 el.textContent = message;
 el.style.display = "block";
 clearTimeout(toastTimer);
 toastTimer = setTimeout(() => el.style.display = "none", 2600);
}

function formatCount(value) {
 const n = Number(value || 0);
 if (n >= 10000000) return (n / 10000000).toFixed(1) + "Cr";
 if (n >= 100000) return (n / 100000).toFixed(1) + "L";
 if (n >= 1000) return (n / 1000).toFixed(1) + "K";
 return String(n);
}

function safeText(value) {
 return String(value ?? "");
}

function getVideoShareUrl(video) {
 const url = new URL(location.href);
 url.search = "";
 url.hash = "";
 url.searchParams.set("video", video.id);
 return url.toString();
}

async function getSessionUser() {
 if (!db) return null;
 try {
  const { data, error } = await db.auth.getUser();
  if (error) return null;
  return data.user || null;
 } catch (e) {
  console.error("Auth error:", e);
  return null;
 }
}

async function loadFeed() {
 $("loadingState").style.display = "flex";
 $("emptyState").style.display = "none";

 if (!db) {
  $("loadingState").style.display = "none";
  showEmpty("Supabase कनेक्शन नहीं मिला। supabase-config.js जाँचें।");
  return;
 }

 try {
  let query = db.from("videos")
   .select("id,video_url,caption,category,username,likes_count,views_count,created_at")
   .order("created_at", { ascending: false });

  const { data, error } = await query;

  if (error) throw error;

  rawVideos = (data || [])
   .filter(v => v.id && v.video_url)
   .map(v => ({
    ...v,
    likes_count: Number(v.likes_count || 0),
    views_count: Number(v.views_count || 0)
   }));

  await loadMyLikes();
  applyFilters();

 } catch (error) {
  console.error("Feed load error:", error);
  showEmpty("वीडियो लोड नहीं हो सके। Supabase videos table और RLS policies जाँचें।");
 } finally {
  $("loadingState").style.display = "none";
 }
}

async function loadMyLikes() {
 likedVideoIds.clear();
 if (!db || !currentUser || rawVideos.length === 0) return;

 try {
  const ids = rawVideos.map(v => v.id);
  const { data, error } = await db.from("likes")
   .select("video_id")
   .eq("user_id", currentUser.id)
   .in("video_id", ids);

  if (error) throw error;
  (data || []).forEach(row => likedVideoIds.add(row.video_id));
 } catch (error) {
  console.warn("Could not load likes:", error.message);
 }
}

function showEmpty(message) {
 $("activeFeedVideo").pause();
 $("activeFeedVideo").removeAttribute("src");
 $("activeFeedVideo").load();
 $("emptyMessage").textContent = message;
 $("emptyState").style.display = "flex";
 $("videoCounter").textContent = "";
 $("feedUsername").textContent = "";
 $("feedCaptionText").textContent = "";
 $("feedVideoMeta").textContent = "";
 $("likeCount").textContent = "0";
 $("commentCount").textContent = "Comments";
 $("likeButton").classList.remove("liked");
 currentVideo = null;
}

function applyFilters() {
 const keyword = $("feedSearchBox").value.trim().toLowerCase();

 filteredVideos = rawVideos.filter(video => {
  const text = [
   video.caption,
   video.username,
   video.category
  ].join(" ").toLowerCase();

  const keywordMatch = !keyword || text.includes(keyword);

  let categoryMatch = true;

  if (currentCategory === "Following" || currentCategory === "Friends") {
   // Following/Friends require a verified relationship query.
   categoryMatch = false;
  } else if (currentCategory === "For You" || currentCategory === "Discover") {
   categoryMatch = true;
  } else if (currentCategory === "Shorts" || currentCategory === "Reels") {
   categoryMatch = true;
  } else if (currentCategory === "Live") {
   categoryMatch = false;
  } else {
   categoryMatch = (video.category || "").toLowerCase()
    .includes(currentCategory.toLowerCase());
  }

  return keywordMatch && categoryMatch;
 });

 currentIndex = 0;

 if (!filteredVideos.length) {
  showEmpty(
   currentCategory === "Following" || currentCategory === "Friends"
    ? "इस सेक्शन के लिए Follow/Friends सिस्टम कनेक्ट करना बाकी है।"
    : currentCategory === "Live"
     ? "अभी कोई Live वीडियो उपलब्ध नहीं है।"
     : "इस खोज या Category में अभी कोई वीडियो नहीं मिला।"
  );
  return;
 }

 $("emptyState").style.display = "none";
 renderVideo();
}

function renderVideo() {
 if (!filteredVideos.length) return;

 currentVideo = filteredVideos[currentIndex];
 if (!currentVideo) return;

 const video = $("activeFeedVideo");
 video.pause();
 video.src = currentVideo.video_url;
 video.load();
 video.play().catch(() => {
  $("playPause").style.display = "block";
 });

 $("feedUsername").textContent =
  currentVideo.username ? "@" + currentVideo.username.replace(/^@/, "") : "New Star Creator";

 $("feedCaptionText").textContent = currentVideo.caption || "";

 $("feedVideoMeta").textContent =
  formatCount(currentVideo.views_count) + " views";

 $("likeCount").textContent = formatCount(currentVideo.likes_count);

 $("videoCounter").textContent =
  (currentIndex + 1) + " / " + filteredVideos.length;

 $("likeButton").classList.toggle(
  "liked", likedVideoIds.has(currentVideo.id)
 );

 const affiliate = currentVideo.affiliate_link;
 const link = $("feedAffiliateLink");

 if (affiliate) {
  try {
   const parsed = new URL(affiliate);
   if (parsed.protocol === "https:" || parsed.protocol === "http:") {
    link.href = parsed.href;
    link.style.display = "inline-block";
   } else {
    link.style.display = "none";
   }
  } catch {
   link.style.display = "none";
  }
 } else {
  link.style.display = "none";
 }

 loadCommentCount(currentVideo.id);
}

async function loadCommentCount(videoId) {
 $("commentCount").textContent = "Comments";
 try {
  const { count, error } = await db.from("video_comments")
   .select("id", { count: "exact", head: true })
   .eq("video_id", videoId);

  if (error) throw error;
  if (currentVideo && currentVideo.id === videoId) {
   $("commentCount").textContent = formatCount(count || 0);
  }
 } catch (error) {
  console.warn("Comment count unavailable:", error.message);
 }
}

async function toggleLike() {
 if (!currentVideo) return;

 if (!currentUser) {
  toast("Like करने के लिए पहले Login करें।");
  location.href = "auth.html";
  return;
 }

 const videoId = currentVideo.id;
 const wasLiked = likedVideoIds.has(videoId);

 $("likeButton").disabled = true;

 try {
  if (wasLiked) {
   const { error } = await db.from("likes")
    .delete()
    .eq("video_id", videoId)
    .eq("user_id", currentUser.id);

   if (error) throw error;

   likedVideoIds.delete(videoId);
   currentVideo.likes_count = Math.max(0, currentVideo.likes_count - 1);
  } else {
   const { error } = await db.from("likes").insert({
    video_id: videoId,
    user_id: currentUser.id
   });

   if (error) throw error;

   likedVideoIds.add(videoId);
   currentVideo.likes_count += 1;
  }

  $("likeButton").classList.toggle("liked", !wasLiked);
  $("likeCount").textContent = formatCount(currentVideo.likes_count);

  // Keep the displayed count consistent with the database.
  const { error: updateError } = await db.from("videos")
   .update({ likes_count: currentVideo.likes_count })
   .eq("id", videoId);

  if (updateError) {
   console.warn("Like count update needs database policy:", updateError.message);
  }

  toast(wasLiked ? "Like हटाया गया" : "❤️ Liked!");

 } catch (error) {
  console.error("Like error:", error);
  toast("Like सेव नहीं हुआ। Database columns/RLS जाँचें।");
 } finally {
  $("likeButton").disabled = false;
 }
}

function openModal(id) {
 document.querySelectorAll(".modal").forEach(m => m.style.display = "none");
 $(id).style.display = "flex";
}

function closeModal(id) {
 $(id).style.display = "none";
}

async function openComments() {
 if (!currentVideo) return;
 openModal("commentModal");
 await loadComments(currentVideo.id);
}

async function loadComments(videoId) {
 if (loadingComments) return;
 loadingComments = true;

 const list = $("commentList");
 list.innerHTML = "<p style='color:#aaa'>Comments लोड हो रहे हैं...</p>";

 try {
  const { data, error } = await db.from("video_comments")
   .select("*")
   .eq("video_id", videoId)
   .order("created_at", { ascending: true });

  if (error) throw error;

  $("commentTitle").textContent = "Comments (" + (data || []).length + ")";
  list.innerHTML = "";

  if (!data || !data.length) {
   list.innerHTML = "<p style='color:#aaa'>अभी कोई Comment नहीं है। पहला Comment करें।</p>";
   return;
  }

  data.forEach(row => {
   const item = document.createElement("div");
   item.className = "comment-item";

   const content = document.createElement("div");
   content.className = "comment-content";

   const name = document.createElement("h4");
   name.textContent = row.username || "New Star User";

   const message = document.createElement("p");
   message.textContent = row.comment || "";

   content.append(name, message);
   item.appendChild(content);
   list.appendChild(item);
  });

 } catch (error) {
  console.error("Comment load error:", error);
  list.innerHTML = "<p style='color:#ff7777'>Comments लोड नहीं हुए। video_comments table के कॉलम और RLS जाँचें।</p>";
 } finally {
  loadingComments = false;
 }
}

async function postComment() {
 if (!currentVideo) return;

 if (!currentUser) {
  toast("Comment करने के लिए Login करें।");
  location.href = "auth.html";
  return;
 }

 const input = $("commentInput");
 const message = input.value.trim();
 if (!message) return;

 const button = $("postCommentButton");
 button.disabled = true;

 try {
  const username =
   currentUser.user_metadata?.username ||
   currentUser.user_metadata?.full_name ||
   currentUser.email?.split("@")[0] ||
   "New Star User";

  const { error } = await db.from("video_comments").insert({
   video_id: currentVideo.id,
   user_id: currentUser.id,
   username: username,
   comment: message
  });

  if (error) throw error;

  input.value = "";
  toast("Comment सेव हो गया!");
  await loadComments(currentVideo.id);
  await loadCommentCount(currentVideo.id);

 } catch (error) {
  console.error("Post comment error:", error);
  toast("Comment सेव नहीं हुआ। Database columns/RLS जाँचें।");
 } finally {
  button.disabled = false;
 }
}

async function shareVideo() {
 if (!currentVideo) return;
 const url = getVideoShareUrl(currentVideo);

 if (navigator.share) {
  try {
   await navigator.share({
    title: "New Star Video",
    text: currentVideo.caption || "Watch this video on New Star",
    url
   });
  } catch (error) {
   if (error.name !== "AbortError") toast("Share नहीं हो सका।");
  }
 } else {
  openModal("shareModal");
 }
}

async function copyVideoLink() {
 if (!currentVideo) return;
 const url = getVideoShareUrl(currentVideo);

 try {
  await navigator.clipboard.writeText(url);
  toast("Video Link कॉपी हो गया!");
 } catch {
  const temp = document.createElement("textarea");
  temp.value = url;
  document.body.appendChild(temp);
  temp.select();
  document.execCommand("copy");
  temp.remove();
  toast("Video Link कॉपी हो गया!");
 }
 closeModal("shareModal");
}

function nextVideo(direction) {
 if (!filteredVideos.length) return;
 currentIndex += direction;

 if (currentIndex >= filteredVideos.length) currentIndex = 0;
 if (currentIndex < 0) currentIndex = filteredVideos.length - 1;

 renderVideo();
}

function setupSwipe() {
 const area = $("feedSwipeContainer");

 area.addEventListener("touchstart", e => {
  touchStartY = e.touches[0].clientY;
 }, { passive: true });

 area.addEventListener("touchend", e => {
  const diff = touchStartY - e.changedTouches[0].clientY;
  if (Math.abs(diff) < 55) return;

  // Don't change videos while a modal is open.
  if ([...document.querySelectorAll(".modal")]
   .some(m => m.style.display === "flex")) return;

  nextVideo(diff > 0 ? 1 : -1);
 }, { passive: true });
}

function setupCategories() {
 $("categoryRow").addEventListener("click", e => {
  const button = e.target.closest(".chip");
  if (!button) return;

  document.querySelectorAll(".chip").forEach(b => b.classList.remove("active"));
  button.classList.add("active");

  currentCategory = button.dataset.category;
  $("feedSearchBox").value = "";
  applyFilters();
 });
}

function setupSearch() {
 $("feedSearchBox").addEventListener("input", applyFilters);
}

function voiceSearch() {
 const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;

 if (!Recognition) {
  toast("इस Browser में Voice Search उपलब्ध नहीं है।");
  return;
 }

 const recognition = new Recognition();
 recognition.lang = "hi-IN";
 recognition.interimResults = false;
 recognition.maxAlternatives = 1;

 recognition.onstart = () => toast("🎙️ बोलिए...");
 recognition.onresult = event => {
  $("feedSearchBox").value = event.results[0][0].transcript;
  applyFilters();
 };
 recognition.onerror = () => toast("Voice Search काम नहीं कर पाया।");
 recognition.start();
}

function setupVideoControls() {
 const video = $("activeFeedVideo");
 const play = $("playPause");

 video.addEventListener("click", () => {
  if (video.paused) {
   video.play().catch(() => {});
  } else {
   video.pause();
  }
 });

 video.addEventListener("play", () => {
  play.style.display = "none";
 });

 video.addEventListener("pause", () => {
  play.style.display = "block";
 });

 play.addEventListener("click", () => {
  video.play().catch(() => {});
 });
}

function setupButtons() {
 $("likeButton").addEventListener("click", toggleLike);
 $("commentButton").addEventListener("click", openComments);

 $("giftButton").addEventListener("click", () => {
  toast("Gifts के लिए Wallet और Coin Transaction verification जोड़ना बाकी है।");
 });

 $("shareButton").addEventListener("click", shareVideo);
 $("nativeShareButton").addEventListener("click", shareVideo);
 $("copyLinkButton").addEventListener("click", copyVideoLink);

 $("postCommentButton").addEventListener("click", postComment);

 $("commentInput").addEventListener("keydown", e => {
  if (e.key === "Enter") postComment();
 });

 $("micButton").addEventListener("click", voiceSearch);
 $("reloadButton").addEventListener("click", loadFeed);

 document.querySelectorAll("[data-close]").forEach(button => {
  button.addEventListener("click", () => closeModal(button.dataset.close));
 });
}

async function initNewStarFeed() {
 if (!db) {
  showEmpty("Supabase client नहीं मिला। supabase-config.js जाँचें।");
  $("loadingState").style.display = "none";
  return;
 }

 currentUser = await getSessionUser();

 setupSwipe();
 setupCategories();
 setupSearch();
 setupVideoControls();
 setupButtons();

 await loadFeed();

 // Open a shared video when URL contains ?video=VIDEO_ID
 const sharedId = new URLSearchParams(location.search).get("video");
 if (sharedId) {
  const foundIndex = filteredVideos.findIndex(v => String(v.id) === sharedId);
  if (foundIndex >= 0) {
   currentIndex = foundIndex;
   renderVideo();
  }
 }
}

document.addEventListener("DOMContentLoaded", initNewStarFeed);
</script>
