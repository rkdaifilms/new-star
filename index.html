<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Priyance - Home Feed</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #000; color: #fff; padding-bottom: 70px; overflow: hidden; height: 100vh; }
        
        /* Video Feed Container */
        .feed-container { height: calc(100vh - 60px); width: 100%; position: relative; display: flex; justify-content: center; align-items: center; background: #111; }
        .feed-video { width: 100%; height: 100%; object-fit: cover; }
        
        .video-info { position: absolute; bottom: 20px; left: 15px; z-index: 10; text-shadow: 0 2px 5px rgba(0,0,0,0.8); }
        .video-info h3 { font-size: 16px; margin-bottom: 5px; color: #fff; }
        .video-info p { font-size: 13px; color: #ddd; }

        /* Right Side Actions (Like, Comment, Share) */
        .side-actions { position: absolute; right: 15px; bottom: 80px; display: flex; flex-direction: column; align-items: center; gap: 20px; z-index: 10; }
        .action-btn { text-align: center; color: #fff; font-size: 12px; cursor: pointer; }
        .action-icon { width: 45px; height: 45px; background: rgba(0,0,0,0.4); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 22px; margin-bottom: 4px; border: 1px solid rgba(255,255,255,0.2); }

        /* Bottom Navigation Bar */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: rgba(255,255,255,0.6); cursor: pointer; text-decoration: none; font-size: 11px; }
        .nav-item.active { color: #fff; }
        .upload-plus-btn { width: 42px; height: 28px; background: linear-gradient(135deg, #25f4ee, #fe2c55); border-radius: 8px; display: flex; justify-content: center; align-items: center; color: #fff; font-size: 20px; }
    </style>
</head>
<body>

    <!-- Main Video Feed Section -->
    <div class="feed-container">
        <!-- Sample Video Feed -->
        <video class="feed-video" autoplay loop muted src="https://assets.mixkit.co/videos/preview/mixkit-girl-dancing-in-a-party-41650-large.mp4"></video>
        
        <div class="video-info">
            <h3 id="feedUsername">@ramram981152</h3>
            <p>Garmi mein thanda girls dance - Call Priyance Creator Hub 🔥</p>
        </div>

        <div class="side-actions">
            <div class="action-btn" onclick="alert('Liked!')">
                <div class="action-icon">❤️</div>
                <span>180K</span>
            </div>
            <div class="action-btn" onclick="alert('Comments')">
                <div class="action-icon">💬</div>
                <span>1,420</span>
            </div>
            <div class="action-btn" onclick="alert('Shared!')">
                <div class="action-icon">↗️</div>
                <span>Share</span>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item active"><i>🏠</i><span>Home</span></a>
        <a href="wallet.html" class="nav-item"><i>🪙</i><span>Wallet</span></a>
        <a href="camera.html" class="nav-item"><div class="upload-plus-btn">+</div></a>
        <a href="inbox.html" class="nav-item"><i>💬</i><span>Inbox</span></a>
        <a href="profile.html" class="nav-item"><i>⭐</i><span>Profile</span></a>
    </div>

    <script>
        // Sync username from profile if changed
        window.onload = function() {
            let savedHandle = localStorage.getItem('appHandle');
            if(savedHandle) {
                document.getElementById('feedUsername').innerText = savedHandle;
            }
        };
    </script>
</body>
</html>
