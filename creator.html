<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101014"><title>Creator Profile · New Star</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#101014;color:#fff;font:16px Arial,sans-serif;padding-bottom:80px}.head{padding:16px;background:#191920;position:sticky;top:0}.wrap{max-width:720px;margin:auto;padding:14px}.card{background:#1c1c2a;border:1px solid #454554;border-radius:18px;padding:22px;text-align:center;margin:12px 0}.avatar{width:112px;height:112px;border-radius:50%;object-fit:cover;background:#333;border:3px solid #fe2c55}.muted{color:#aaa}.btn{border:0;border-radius:24px;background:#fe2c55;color:#fff;padding:12px 22px;font-weight:700;font-size:16px;cursor:pointer}.videos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.video{background:#20202a;border-radius:12px;padding:8px;overflow-wrap:anywhere}.video img{width:100%;aspect-ratio:9/16;object-fit:cover;background:#000;border-radius:8px}.status{color:#ffcf70;white-space:pre-wrap}
</style></head><body><div class="head">⭐ New Star · Creator Profile</div><main class="wrap"><p id="status" class="status">Creator profile लोड हो रही है…</p><section id="profile" class="card" hidden><img id="avatar" class="avatar" alt=""><h1 id="name"></h1><p id="username" class="muted"></p><p id="bio"></p><p id="location" class="muted" hidden></p><button id="message" class="btn">✉ Message</button></section><section><h2>Creator Videos</h2><div id="videos" class="videos"></div></section></main><script>
(()=>{const db=window.supabaseClient||window.cloudClient;const $=id=>document.getElementById(id);const fallback='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100%" height="100%" fill="#333"/><text x="50%" y="55%" text-anchor="middle" fill="white" font-size="35">★</text></svg>');const id=new URLSearchParams(location.search).get('user');const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function run(){if(!db){$('status').textContent='Supabase connection उपलब्ध नहीं।';return;}if(!id){$('status').textContent='Creator ID नहीं मिली।';return;}const {data:session}=await db.auth.getSession();const me=session?.session?.user;if(me?.id===id){location.replace('profile.html');return;}const {data:p,error}=await db.from('creator_public_profiles').select('user_id,username,full_name,avatar_url,bio,is_private,location_name,location_latitude,location_longitude').eq('user_id',id).maybeSingle();if(error||!p){$('status').textContent='Creator profile उपलब्ध नहीं है।';return;}if(p.is_private){$('status').textContent='यह Creator Profile private है।';return;}if(!me){$('status').textContent='Message करने के लिए पहले Login करें।';}else $('status').textContent='';$('profile').hidden=false;$('avatar').src=p.avatar_url||fallback;$('name').textContent=p.full_name||p.username||'New Star Creator';$('username').textContent=p.username?'@'+p.username:'';$('bio').textContent=p.bio||'';if(p.location_name){$('location').textContent='📍 '+p.location_name;$('location').hidden=false;}else{$('location').hidden=true;}$('message').disabled=!me;$('message').onclick=()=>{if(me)location.href='inbox.html?to='+encodeURIComponent(p.user_id);};const {data:rows}=await db.from('videos').select('id,caption,thumbnail_url,visibility').eq('user_id',id).eq('visibility','public').order('created_at',{ascending:false}).limit(30);$('videos').innerHTML=(rows||[]).map(v=>'<article class="video">'+(v.thumbnail_url?'<img src="'+esc(v.thumbnail_url)+'" alt="">':'')+'<p>'+esc(v.caption||'Video')+'</p></article>').join('')||'<p class="muted">अभी कोई Public video नहीं है।</p>';}
run().catch(e=>{$('status').textContent='Profile error: '+e.message;});})();
</script></body></html>
